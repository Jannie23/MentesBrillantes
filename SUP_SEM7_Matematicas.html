<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simulador de Matemáticas: Álgebra y Trigonometría</title>
  <style>
    @font-face {
      font-family: 'Mogena';
      src: url('https://fonts.cdnfonts.com/s/91216/MogenaRegular-8Mzx3.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 35%, #0369a1 70%, #0f172a 100%);
      --card-bg: rgba(15, 23, 42, 0.88);
      --text-main: #f0f9ff;
      --text-muted: #7dd3fc;

      --neon-lime: #38bdf8;
      --pastel-lime: rgba(56, 189, 248, 0.15);
      --neon-emerald: #818cf8;
      --pastel-emerald: rgba(129, 140, 248, 0.15);
      --neon-cyan: #c084fc;
      --pastel-cyan: rgba(192, 132, 252, 0.15);
      --neon-green: #22c55e;
      --pastel-green: rgba(34, 197, 94, 0.2);
      --neon-red: #f43f5e;
      --pastel-red: rgba(244, 63, 94, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Mogena', 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: clamp(6px, 1.5vw, 20px);
    }

    .quiz-container {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      width: 100%;
      max-width: 1250px;
      min-height: min(94vh, 900px);
      border-radius: clamp(16px, 2.5vw, 28px);
      border: clamp(2px, 0.3vw, 3px) solid var(--neon-lime);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      margin: auto;
      position: relative;
    }

    .progress-header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: clamp(12px, 2vw, 20px) clamp(16px, 3vw, 36px);
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: clamp(2px, 0.3vw, 3px) solid var(--neon-lime);
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .progress-info {
      display: flex;
      gap: clamp(10px, 2.5vw, 24px);
      flex-wrap: wrap;
      font-size: clamp(0.95rem, 1.2vw, 1.2rem);
      color: var(--neon-lime);
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    .shortcut-hint {
      font-size: 0.8rem;
      color: #bae6fd;
      font-weight: 600;
      display: none;
    }

    @media (min-width: 1024px) {
      .shortcut-hint {
        display: inline-block;
      }
    }

    .top-brand-logo img {
      height: clamp(34px, 5vw, 68px);
      width: auto;
      object-fit: contain;
      filter: contrast(1.15) drop-shadow(0 0 10px rgba(56, 189, 248, 0.5));
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .top-brand-logo img:hover {
      transform: scale(1.1) rotate(-2deg);
    }

    .progress-bar-bg {
      width: 100%;
      height: clamp(10px, 1.1vw, 15px);
      background-color: rgba(30, 41, 59, 0.8);
      border-radius: 30px;
      overflow: hidden;
      border: 1.5px solid rgba(56, 189, 248, 0.4);
    }

    .progress-bar-fill {
      height: 100%;
      width: 5%;
      background: linear-gradient(90deg, var(--neon-lime), var(--neon-emerald), var(--neon-cyan));
      border-radius: 30px;
      box-shadow: 0 0 15px var(--neon-lime);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .quiz-body {
      padding: clamp(16px, 2.5vw, 36px);
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 1150px;
      margin: 0 auto;
      width: 100%;
      overflow-y: auto;
    }

    .question-topic {
      align-self: flex-start;
      font-size: clamp(0.75rem, 0.9vw, 0.9rem);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 6px clamp(12px, 1.5vw, 18px);
      border-radius: 30px;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      font-weight: 900;
      margin-bottom: clamp(10px, 1.5vw, 18px);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    .question-text {
      font-size: clamp(1.05rem, 1.5vw, 1.45rem);
      line-height: 1.45;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: clamp(16px, 2vw, 24px);
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: clamp(10px, 1.3vw, 16px);
      margin-bottom: clamp(16px, 2vw, 22px);
    }

    .option-btn {
      background: rgba(30, 41, 59, 0.6);
      border: clamp(2px, 0.25vw, 3px) solid rgba(56, 189, 248, 0.35);
      border-radius: clamp(14px, 1.5vw, 18px);
      padding: clamp(12px, 1.4vw, 16px) clamp(14px, 1.6vw, 18px);
      text-align: left;
      font-size: clamp(0.95rem, 1.15vw, 1.1rem);
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: var(--text-main);
      font-weight: 600;
      line-height: 1.35;
      overflow-wrap: break-word;
      word-break: break-word;
      min-height: 56px;
      position: relative;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--neon-lime);
      background-color: var(--pastel-lime);
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
    }

    .option-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .option-btn.selected {
      border-color: var(--neon-lime);
      background-color: var(--pastel-lime);
      color: #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
      transform: scale(1.01);
    }

    .option-prefix {
      font-weight: 900;
      margin-right: 12px;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      width: clamp(34px, 3.2vw, 40px);
      height: clamp(34px, 3.2vw, 40px);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: clamp(0.85rem, 1vw, 1rem);
      color: #0f172a;
      border: 2px solid var(--neon-lime);
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .option-btn.selected .option-prefix {
      background: var(--neon-lime);
      border-color: #ffffff;
      color: #0f172a;
      transform: rotate(360deg);
    }

    .option-btn.correct {
      background-color: var(--pastel-green) !important;
      border-color: var(--neon-green) !important;
      color: #86efac !important;
      box-shadow: 0 0 22px rgba(34, 197, 94, 0.5) !important;
      animation: popSuccess 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .option-btn.correct .option-prefix {
      background: var(--neon-green);
      border-color: var(--neon-green);
      color: #0f172a;
    }

    .option-btn.incorrect {
      background-color: var(--pastel-red) !important;
      border-color: var(--neon-red) !important;
      color: #fca5a5 !important;
      box-shadow: 0 0 20px rgba(244, 63, 94, 0.5) !important;
      animation: shakeError 0.35s ease-in-out;
    }
    .option-btn.incorrect .option-prefix {
      background: var(--neon-red);
      border-color: var(--neon-red);
      color: #ffffff;
    }

    .feedback-panel {
      padding: clamp(14px, 1.8vw, 20px);
      border-radius: clamp(14px, 1.5vw, 18px);
      margin-bottom: clamp(14px, 1.8vw, 20px);
      display: none;
      animation: slideUp 0.3s ease;
      line-height: 1.5;
      font-size: clamp(0.9rem, 1.05vw, 1rem);
    }

    .feedback-panel.success {
      background-color: rgba(34, 197, 94, 0.15);
      border: clamp(2px, 0.25vw, 3px) solid var(--neon-green);
      color: #dcfce7;
    }

    .feedback-panel.error {
      background-color: rgba(244, 63, 94, 0.15);
      border: clamp(2px, 0.25vw, 3px) solid var(--neon-red);
      color: #ffe4e6;
    }

    .feedback-title {
      font-weight: 900;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(1rem, 1.15vw, 1.15rem);
    }

    .quiz-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 4px;
    }

    .action-btn {
      padding: clamp(12px, 1.4vw, 16px) clamp(24px, 2.8vw, 34px);
      font-size: clamp(0.95rem, 1.15vw, 1.1rem);
      font-weight: 800;
      border: none;
      border-radius: clamp(12px, 1.2vw, 16px);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      letter-spacing: 0.5px;
      width: auto;
      min-height: 48px;
    }

    .btn-check {
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
    }
    .btn-check:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.15);
    }
    .btn-check:disabled {
      background: #1e293b;
      color: #475569;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-next {
      background: linear-gradient(135deg, var(--neon-emerald), var(--neon-cyan));
      color: #0f172a;
      display: none;
      box-shadow: 0 6px 20px rgba(129, 140, 248, 0.4);
    }
    .btn-next:hover {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.15);
    }

    .result-screen {
      display: none;
      text-align: center;
      padding: clamp(24px, 4vw, 50px) clamp(14px, 3vw, 24px);
      margin: auto;
      max-width: 800px;
      animation: slideUp 0.4s ease;
    }

    .result-title {
      font-size: clamp(1.8rem, 3.2vw, 2.5rem);
      color: var(--neon-lime);
      font-weight: 900;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
    }

    .result-score {
      font-size: clamp(3.5rem, 7vw, 5rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald), var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: clamp(10px, 1.8vw, 18px) 0;
      filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.6));
    }

    .result-message {
      font-size: clamp(1rem, 1.3vw, 1.2rem);
      color: var(--text-main);
      margin-bottom: clamp(20px, 2.8vw, 32px);
      line-height: 1.5;
      font-weight: 600;
    }

    .btn-restart {
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      padding: clamp(14px, 1.6vw, 18px) clamp(30px, 3.5vw, 44px);
      font-size: clamp(1rem, 1.2vw, 1.15rem);
      box-shadow: 0 8px 25px rgba(56, 189, 248, 0.5);
    }
    .btn-restart:hover {
      transform: scale(1.06);
      filter: brightness(1.15);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popSuccess {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1.01); }
    }

    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    @media (max-width: 580px) {
      .quiz-footer {
        flex-direction: column;
      }
      .action-btn {
        width: 100%;
        text-align: center;
      }
      .options-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <div class="progress-header" id="progressHeader">
    <div class="header-top">
      <div class="progress-info">
        <span id="questionCounter">Pregunta 1 de 15</span>
        <span id="scoreCounter">Aciertos: 0</span>
        <span class="shortcut-hint">💡 Usa las teclas [A, B, C, D] y [Enter]</span>
      </div>
      <div class="top-brand-logo">
        <img src="Logo_MB.png" alt="Logo ECOEMS">
      </div>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </div>

  <div class="quiz-body" id="quizBody">
    <span class="question-topic" id="topicBadge">Tema</span>
    <h2 class="question-text" id="questionText">Cargando reactivo...</h2>

    <div class="options-grid" id="optionsContainer"></div>

    <div class="feedback-panel" id="feedbackPanel">
      <div class="feedback-title" id="feedbackTitle"></div>
      <div id="feedbackText"></div>
    </div>

    <div class="quiz-footer">
      <button class="action-btn btn-check" id="checkBtn" disabled>Comprobar respuesta</button>
      <button class="action-btn btn-next" id="nextBtn">Siguiente pregunta ➔</button>
    </div>
  </div>

  <div class="result-screen" id="resultScreen">
    <h2 class="result-title" id="resultTitle">¡Evaluación Finalizada!</h2>
    <div class="result-score" id="finalScore">0 / 15</div>
    <p class="result-message" id="finalMessage">Mensaje de desempeño</p>
    <button class="action-btn btn-restart" id="restartBtn">↻ Reiniciar simulador</button>
  </div>
</div>

<script>
  const rawQuestions = [
    {
      topic: "Continuidad y Discontinuidad de Funciones",
      question: "Considera la función <i>f(x) = (x² - 9)/(x - 3)</i>. ¿Qué ocurre exactamente en <i>x = 3</i>?",
      options: [
        "La función vale 6 en x = 3",
        "Presenta una discontinuidad de salto finito.",
        "No está definida, pero es una discontinuidad evitable.",
        "Tiene una asíntota vertical en x = 3"
      ],
      answer: 2,
      explanation: "Al evaluar f(3) se obtiene la forma indefinida 0/0. Sin embargo, al factorizar (x - 3)(x + 3)/(x - 3) = x + 3, el límite cuando x tiende a 3 existe y es 6, lo que confirma una discontinuidad evitable."
    },
    {
      topic: "Álgebra de Funciones (Suma)",
      question: "Dadas las funciones <i>f(x) = 2x - 1</i> y <i>g(x) = x² + 3</i>, determina el valor numérico de <i>(f + g)(2)</i>.",
      options: [
        "10",
        "12",
        "8",
        "14"
      ],
      answer: 0,
      explanation: "Evaluando por separado: f(2) = 2(2) - 1 = 3; g(2) = (2)² + 3 = 7. Sumando ambos resultados: 3 + 7 = 10."
    },
    {
      topic: "Composición de Funciones",
      question: "Dadas las funciones <i>f(x) = 3x + 2</i> y <i>g(x) = x²</i>, ¿cuál es el valor exacto de la composición <i>(f ∘ g)(-2)</i>?",
      options: [
        "-10",
        "14",
        "16",
        "-4"
      ],
      answer: 1,
      explanation: "Se evalúa primero la función interna: g(-2) = (-2)² = 4. Luego se aplica la función externa con ese resultado: f(4) = 3(4) + 2 = 14."
    },
    {
      topic: "Trigonometría y Razones Razonadas",
      question: "Desde un punto ubicado a 20 m de la base de una torre, se observa su cúspide con un ángulo de elevación de 60°. ¿Qué expresión permite calcular la altura <i>h</i> de la torre?",
      options: [
        "h = 20 · sen(60°)",
        "h = 20 / tan(60°)",
        "h = 20 · cos(60°)",
        "h = 20 · tan(60°)"
      ],
      answer: 3,
      explanation: "La razón trigonométrica tangente relaciona el cateto opuesto (h) con el cateto adyacente (20 m): tan(60°) = h / 20 ⇒ h = 20 · tan(60°)."
    },
    {
      topic: "Conversión de Ángulos (Grados a Radianes)",
      question: "Convierte un ángulo de 225° a radianes expresado en su forma simplificada e irreductible.",
      options: [
        "5π/4 rad",
        "3π/4 rad",
        "7π/4 rad",
        "4π/3 rad"
      ],
      answer: 0,
      explanation: "Multiplicando por el factor de conversión: 225° × (π / 180°) = 225π / 180. Simplificando dividiendo entre 45 resulta 5π/4 rad."
    },
    {
      topic: "Dominio de Funciones Racionales",
      question: "¿Cuál es el dominio de la función <i>h(x) = (x + 2)/(x² - 16)</i>?",
      options: [
        "Todos los reales excepto x = -2",
        "Todos los reales excepto x = 4 y x = -4",
        "Únicamente los números reales positivos",
        "Todos los reales excepto x = 16"
      ],
      answer: 1,
      explanation: "El denominador no puede ser cero: x² - 16 = 0 ⇒ x² = 16 ⇒ x = ±4. Por lo tanto, el dominio son todos los números reales excepto x = 4 y x = -4."
    },
    {
      topic: "Simplificación de Funciones Racionales",
      question: "Dadas <i>f(x) = x² - 4</i> y <i>g(x) = x + 2</i>, halla la función cociente simplificada <i>(f/g)(x)</i> especificando su restricción.",
      options: [
        "x - 2 para todo x",
        "x + 2 para x ≠ -2",
        "x - 2 para x ≠ -2",
        "x² - x - 5 para x ≠ 2"
      ],
      answer: 2,
      explanation: "Dividiendo las expresiones: (x² - 4)/(x + 2) = (x - 2)(x + 2)/(x + 2) = x - 2. Como el denominador original era x + 2, se debe restringir a x ≠ -2."
    },
    {
      topic: "Evaluación de Composición de Funciones",
      question: "Si <i>f(x) = 2x</i> y <i>g(x) = x + 5</i>, calcula el valor de <i>(g ∘ f)(3)</i>.",
      options: [
        "11",
        "16",
        "13",
        "21"
      ],
      answer: 0,
      explanation: "Evaluando la función interna: f(3) = 2(3) = 6. Luego evaluando la función externa con el valor hallado: g(6) = 6 + 5 = 11."
    },
    {
      topic: "Conversión de Ángulos (Radianes a Grados)",
      question: "Convierte un ángulo de 2π/3 radianes a grados sexagesimales.",
      options: [
        "120°",
        "135°",
        "150°",
        "60°"
      ],
      answer: 0,
      explanation: "Sustituyendo π por 180° o usando el factor (180°/π): (2 · 180°) / 3 = 360° / 3 = 120°."
    },
    {
      topic: "Razones Trigonométricas en Triángulos Rectángulos",
      question: "En un triángulo rectángulo, si el cateto opuesto mide 6 cm y la hipotenusa mide 10 cm, ¿cuál es el valor del coseno del ángulo agudo adyacente a dicho cateto opuesto?",
      options: [
        "0.6",
        "0.8",
        "0.75",
        "1.33"
      ],
      answer: 1,
      explanation: "Por teorema de Pitágoras, el cateto adyacente mide CA = √(10² - 6²) = √(100 - 36) = √64 = 8 cm. Entonces cos θ = CA / Hipotenusa = 8 / 10 = 0.8."
    },
    {
      topic: "Resolución de Triángulos Rectángulos (Aplicación)",
      question: "Un cometa queda atascado en la copa de un árbol. El hilo mide 30 m de largo y forma un ángulo de elevación de 30° con la horizontal. ¿A qué altura del suelo se encuentra el cometa?",
      options: [
        "15 m",
        "25.9 m",
        "17.3 m",
        "20 m"
      ],
      answer: 0,
      explanation: "Utilizando la función seno: sen(30°) = h / 30 ⇒ h = 30 · sen(30°). Como sen(30°) = 0.5, h = 30 · 0.5 = 15 m."
    },
    {
      topic: "Ángulos Negativos y Equivalencia",
      question: "¿Cuál de los siguientes ángulos en radianes es equivalente a un ángulo negativo de -135°?",
      options: [
        "-3π/4 rad",
        "-5π/4 rad",
        "-2π/3 rad",
        "-7π/6 rad"
      ],
      answer: 0,
      explanation: "Al multiplicar por (π / 180°): -135° × (π / 180°) = -135π / 180. Dividiendo entre 45 resulta -3π/4 rad."
    },
    {
      topic: "Análisis Clasificado de Discontinuidades",
      question: "Para la función <i>g(x) = (x - 1)/(x² - 1)</i>, ¿qué tipo de discontinuidad se presenta en <i>x = 1</i> y en <i>x = -1</i> respectivamente?",
      options: [
        "Ambas son evitables.",
        "Evitable en x = 1 e Infinita en x = -1.",
        "Infinita en x = 1 y Evitable en x = -1.",
        "De salto en ambos puntos."
      ],
      answer: 1,
      explanation: "Factorizando el denominador: (x - 1)/((x - 1)(x + 1)) = 1/(x + 1). El factor (x - 1) se cancela, por lo que en x = 1 la discontinuidad es evitable. En x = -1 queda 1/0, lo que genera una asíntota vertical (discontinuidad infinita)."
    },
    {
      topic: "Álgebra de Funciones (Resta)",
      question: "Dadas <i>f(x) = 4x + 1</i> y <i>g(x) = 2x - 3</i>, halla la expresión algebraica de <i>(f - g)(x)</i>.",
      options: [
        "2x - 2",
        "2x + 4",
        "6x - 2",
        "2x - 4"
      ],
      answer: 1,
      explanation: "Aplicando la resta de polinomios cuidando los signos: (4x + 1) - (2x - 3) = 4x + 1 - 2x + 3 = 2x + 4."
    },
    {
      topic: "Ángulos de Depresión y Geometría",
      question: "Un observador en la cima de un acantilado de 50 m de altura divisa una embarcación con un ángulo de depresión de 45°. ¿A qué distancia horizontal se encuentra el barco de la base del acantilado?",
      options: [
        "50 m",
        "25 m",
        "50√3 m",
        "70.7 m"
      ],
      answer: 0,
      explanation: "El ángulo de depresión de 45° equivale al ángulo de elevación desde el barco por ángulos alternos internos. Como tan(45°) = 1 = 50 / d, se obtiene d = 50 m."
    }
  ];

  let questions = [];
  let currentQuestionIndex = 0;
  let selectedOptionIndex = null;
  let score = 0;

  const prefixes = ["A", "B", "C", "D"];

  const questionCounter = document.getElementById("questionCounter");
  const scoreCounter = document.getElementById("scoreCounter");
  const progressBar = document.getElementById("progressBar");
  const topicBadge = document.getElementById("topicBadge");
  const questionText = document.getElementById("questionText");
  const optionsContainer = document.getElementById("optionsContainer");
  const feedbackPanel = document.getElementById("feedbackPanel");
  const feedbackTitle = document.getElementById("feedbackTitle");
  const feedbackText = document.getElementById("feedbackText");
  const checkBtn = document.getElementById("checkBtn");
  const nextBtn = document.getElementById("nextBtn");
  const quizBody = document.getElementById("quizBody");
  const progressHeader = document.getElementById("progressHeader");
  const resultScreen = document.getElementById("resultScreen");
  const finalScore = document.getElementById("finalScore");
  const finalMessage = document.getElementById("finalMessage");
  const resultTitle = document.getElementById("resultTitle");
  const restartBtn = document.getElementById("restartBtn");

  function shuffleArray(array) {
    const shuffled = [...array];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
  }

  function initQuiz() {
    questions = shuffleArray(rawQuestions);
    currentQuestionIndex = 0;
    score = 0;
    resultScreen.style.display = "none";
    progressHeader.style.display = "flex";
    quizBody.style.display = "flex";
    loadQuestion();
  }

  function loadQuestion() {
    selectedOptionIndex = null;
    checkBtn.disabled = true;
    checkBtn.style.display = "inline-block";
    nextBtn.style.display = "none";
    feedbackPanel.style.display = "none";
    feedbackPanel.className = "feedback-panel";

    const q = questions[currentQuestionIndex];

    questionCounter.textContent = `Pregunta ${currentQuestionIndex + 1} de ${questions.length}`;
    scoreCounter.textContent = `Aciertos: ${score}`;
    progressBar.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;

    topicBadge.textContent = q.topic;
    questionText.innerHTML = q.question;

    optionsContainer.innerHTML = "";
    q.options.forEach((optText, index) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerHTML = `<span class="option-prefix">${prefixes[index]}</span> <span>${optText}</span>`;
      btn.addEventListener("click", () => selectOption(index));
      optionsContainer.appendChild(btn);
    });
  }

  function selectOption(index) {
    if (checkBtn.style.display === "none") return;
    selectedOptionIndex = index;
    const allOptions = optionsContainer.querySelectorAll(".option-btn");
    allOptions.forEach((btn, idx) => {
      if (idx === index) {
        btn.classList.add("selected");
      } else {
        btn.classList.remove("selected");
      }
    });
    checkBtn.disabled = false;
  }

  function checkAnswer() {
    if (selectedOptionIndex === null) return;
    const q = questions[currentQuestionIndex];
    const allOptions = optionsContainer.querySelectorAll(".option-btn");

    allOptions.forEach(btn => btn.disabled = true);
    checkBtn.style.display = "none";
    nextBtn.style.display = "inline-block";

    const isCorrect = (selectedOptionIndex === q.answer);

    if (isCorrect) {
      score++;
      scoreCounter.textContent = `Aciertos: ${score}`;
      allOptions[selectedOptionIndex].classList.remove("selected");
      allOptions[selectedOptionIndex].classList.add("correct");

      feedbackPanel.className = "feedback-panel success";
      feedbackTitle.innerHTML = "📐 ¡Excelente! Respuesta correcta";
      feedbackText.innerHTML = q.explanation;
    } else {
      allOptions[selectedOptionIndex].classList.remove("selected");
      allOptions[selectedOptionIndex].classList.add("incorrect");
      allOptions[q.answer].classList.add("correct");

      feedbackPanel.className = "feedback-panel error";
      feedbackTitle.innerHTML = "💡 ¡Casi! Justificación matemática:";
      feedbackText.innerHTML = `<strong>Procedimiento:</strong> ${q.explanation}`;
    }

    feedbackPanel.style.display = "block";
    nextBtn.focus();
  }

  function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < questions.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    quizBody.style.display = "none";
    progressHeader.style.display = "none";
    resultScreen.style.display = "block";

    finalScore.textContent = `${score} / ${questions.length}`;

    let msg = "";
    if (score === 15) {
      resultTitle.textContent = "📐 ¡Dominio Absoluto en Matemáticas!";
      msg = "¡Felicidades! Resolviste correctamente los 15 reactivos de álgebra y trigonometría. Dominas el análisis de funciones, razones trigonométricas y conversiones de ángulos.";
    } else if (score >= 12) {
      resultTitle.textContent = "🌟 ¡Excelente Desempeño!";
      msg = "Tienes un nivel matemático muy avanzado. Revisa las preguntas falladas para dominar al 100% las discontinuidades y composiciones de funciones.";
    } else if (score >= 8) {
      resultTitle.textContent = "👍 ¡Buen Esfuerzo!";
      msg = "Vas por buen camino. Te sugerimos repasar el dominio de funciones racionales y las razones trigonométricas aplicadas.";
    } else {
      resultTitle.textContent = "💪 ¡A Seguir Practicando!";
      msg = "¡No te rindas! Refuerza las fórmulas de conversión de ángulos y operaciones con funciones para volver a intentarlo.";
    }
    finalMessage.textContent = msg;
  }

  checkBtn.addEventListener("click", checkAnswer);
  nextBtn.addEventListener("click", nextQuestion);
  restartBtn.addEventListener("click", initQuiz);

  document.addEventListener("keydown", (e) => {
    if (resultScreen.style.display === "block") {
      if (e.key === "Enter") initQuiz();
      return;
    }

    const key = e.key.toUpperCase();
    if (["A", "1"].includes(key)) selectOption(0);
    else if (["B", "2"].includes(key)) selectOption(1);
    else if (["C", "3"].includes(key)) selectOption(2);
    else if (["D", "4"].includes(key)) selectOption(3);
    else if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (checkBtn.style.display !== "none" && !checkBtn.disabled) {
        checkAnswer();
      } else if (nextBtn.style.display !== "none") {
        nextQuestion();
      }
    }
  });

  initQuiz();
</script>

</body>
</html>
