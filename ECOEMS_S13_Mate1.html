<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simulador ECOEMS: Probabilidad, Muestreo y Medidas</title>
  <style>
    @font-face {
      font-family: 'Mogena';
      src: url('https://fonts.cdnfonts.com/s/91216/MogenaRegular-8Mzx3.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #1e1b4b 40%, #312e81 80%, #020617 100%);
      --card-bg: rgba(15, 23, 42, 0.90);
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;

      --neon-lime: #fbbf24;
      --pastel-lime: rgba(251, 191, 36, 0.15);
      --neon-emerald: #818cf8;
      --pastel-emerald: rgba(129, 140, 248, 0.15);
      --neon-cyan: #38bdf8;
      --pastel-cyan: rgba(56, 189, 248, 0.15);
      --neon-green: #22c55e;
      --pastel-green: rgba(34, 197, 94, 0.2);
      --neon-red: #ef4444;
      --pastel-red: rgba(239, 68, 68, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Mogena', 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: clamp(6px, 1.5vw, 20px);
    }

    .quiz-container {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      width: 100%;
      max-width: 1250px;
      min-height: min(94vh, 900px);
      border-radius: clamp(16px, 2.5vw, 28px);
      border: clamp(2px, 0.3vw, 3px) solid var(--neon-lime);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(251, 191, 36, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      margin: auto;
      position: relative;
    }

    .progress-header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: clamp(12px, 2vw, 20px) clamp(16px, 3vw, 36px);
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: clamp(2px, 0.3vw, 3px) solid var(--neon-lime);
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .progress-info {
      display: flex;
      gap: clamp(10px, 2.5vw, 24px);
      flex-wrap: wrap;
      font-size: clamp(0.95rem, 1.2vw, 1.2rem);
      color: var(--neon-lime);
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
    }

    .shortcut-hint {
      font-size: 0.8rem;
      color: #fde68a;
      font-weight: 600;
      display: none;
    }

    @media (min-width: 1024px) {
      .shortcut-hint {
        display: inline-block;
      }
    }

    .top-brand-logo img {
      height: clamp(34px, 5vw, 68px);
      width: auto;
      object-fit: contain;
      filter: contrast(1.15) drop-shadow(0 0 10px rgba(251, 191, 36, 0.5));
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .top-brand-logo img:hover {
      transform: scale(1.1) rotate(-2deg);
    }

    .progress-bar-bg {
      width: 100%;
      height: clamp(10px, 1.1vw, 15px);
      background-color: rgba(30, 41, 59, 0.8);
      border-radius: 30px;
      overflow: hidden;
      border: 1.5px solid rgba(251, 191, 36, 0.4);
    }

    .progress-bar-fill {
      height: 100%;
      width: 5%;
      background: linear-gradient(90deg, var(--neon-lime), var(--neon-emerald), var(--neon-cyan));
      border-radius: 30px;
      box-shadow: 0 0 15px var(--neon-lime);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .quiz-body {
      padding: clamp(16px, 2.5vw, 36px);
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 1150px;
      margin: 0 auto;
      width: 100%;
      overflow-y: auto;
    }

    .question-topic {
      align-self: flex-start;
      font-size: clamp(0.75rem, 0.9vw, 0.9rem);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 6px clamp(12px, 1.5vw, 18px);
      border-radius: 30px;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      font-weight: 900;
      margin-bottom: clamp(10px, 1.5vw, 18px);
      box-shadow: 0 0 15px rgba(251, 191, 36, 0.4);
    }

    .question-text {
      font-size: clamp(1.05rem, 1.5vw, 1.45rem);
      line-height: 1.45;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: clamp(16px, 2vw, 24px);
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: clamp(10px, 1.3vw, 16px);
      margin-bottom: clamp(16px, 2vw, 22px);
    }

    .option-btn {
      background: rgba(30, 41, 59, 0.6);
      border: clamp(2px, 0.25vw, 3px) solid rgba(251, 191, 36, 0.35);
      border-radius: clamp(14px, 1.5vw, 18px);
      padding: clamp(12px, 1.4vw, 16px) clamp(14px, 1.6vw, 18px);
      text-align: left;
      font-size: clamp(0.95rem, 1.15vw, 1.1rem);
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: var(--text-main);
      font-weight: 600;
      line-height: 1.35;
      overflow-wrap: break-word;
      word-break: break-word;
      min-height: 56px;
      position: relative;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--neon-lime);
      background-color: var(--pastel-lime);
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 8px 20px rgba(251, 191, 36, 0.3);
    }

    .option-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .option-btn.selected {
      border-color: var(--neon-lime);
      background-color: var(--pastel-lime);
      color: #fde68a;
      box-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
      transform: scale(1.01);
    }

    .option-prefix {
      font-weight: 900;
      margin-right: 12px;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      width: clamp(34px, 3.2vw, 40px);
      height: clamp(34px, 3.2vw, 40px);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: clamp(0.85rem, 1vw, 1rem);
      color: #0f172a;
      border: 2px solid var(--neon-lime);
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .option-btn.selected .option-prefix {
      background: var(--neon-lime);
      border-color: #ffffff;
      color: #0f172a;
      transform: rotate(360deg);
    }

    .option-btn.correct {
      background-color: var(--pastel-green) !important;
      border-color: var(--neon-green) !important;
      color: #86efac !important;
      box-shadow: 0 0 22px rgba(34, 197, 94, 0.5) !important;
      animation: popSuccess 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .option-btn.correct .option-prefix {
      background: var(--neon-green);
      border-color: var(--neon-green);
      color: #0f172a;
    }

    .option-btn.incorrect {
      background-color: var(--pastel-red) !important;
      border-color: var(--neon-red) !important;
      color: #fca5a5 !important;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.5) !important;
      animation: shakeError 0.35s ease-in-out;
    }
    .option-btn.incorrect .option-prefix {
      background: var(--neon-red);
      border-color: var(--neon-red);
      color: #ffffff;
    }

    .feedback-panel {
      padding: clamp(14px, 1.8vw, 20px);
      border-radius: clamp(14px, 1.5vw, 18px);
      margin-bottom: clamp(14px, 1.8vw, 20px);
      display: none;
      animation: slideUp 0.3s ease;
      line-height: 1.5;
      font-size: clamp(0.9rem, 1.05vw, 1rem);
    }

    .feedback-panel.success {
      background-color: rgba(34, 197, 94, 0.15);
      border: clamp(2px, 0.25vw, 3px) solid var(--neon-green);
      color: #dcfce7;
    }

    .feedback-panel.error {
      background-color: rgba(239, 68, 68, 0.15);
      border: clamp(2px, 0.25vw, 3px) solid var(--neon-red);
      color: #ffe4e6;
    }

    .feedback-title {
      font-weight: 900;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(1rem, 1.15vw, 1.15rem);
    }

    .quiz-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 4px;
    }

    .action-btn {
      padding: clamp(12px, 1.4vw, 16px) clamp(24px, 2.8vw, 34px);
      font-size: clamp(0.95rem, 1.15vw, 1.1rem);
      font-weight: 800;
      border: none;
      border-radius: clamp(12px, 1.2vw, 16px);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      letter-spacing: 0.5px;
      width: auto;
      min-height: 48px;
    }

    .btn-check {
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      box-shadow: 0 6px 20px rgba(251, 191, 36, 0.4);
    }
    .btn-check:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.15);
    }
    .btn-check:disabled {
      background: #1e293b;
      color: #475569;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-next {
      background: linear-gradient(135deg, var(--neon-emerald), var(--neon-cyan));
      color: #0f172a;
      display: none;
      box-shadow: 0 6px 20px rgba(129, 140, 248, 0.4);
    }
    .btn-next:hover {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.15);
    }

    .result-screen {
      display: none;
      text-align: center;
      padding: clamp(24px, 4vw, 50px) clamp(14px, 3vw, 24px);
      margin: auto;
      max-width: 800px;
      animation: slideUp 0.4s ease;
    }

    .result-title {
      font-size: clamp(1.8rem, 3.2vw, 2.5rem);
      color: var(--neon-lime);
      font-weight: 900;
      text-shadow: 0 0 15px rgba(251, 191, 36, 0.5);
    }

    .result-score {
      font-size: clamp(3.5rem, 7vw, 5rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald), var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: clamp(10px, 1.8vw, 18px) 0;
      filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.6));
    }

    .result-message {
      font-size: clamp(1rem, 1.3vw, 1.2rem);
      color: var(--text-main);
      margin-bottom: clamp(20px, 2.8vw, 32px);
      line-height: 1.5;
      font-weight: 600;
    }

    .btn-restart {
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      padding: clamp(14px, 1.6vw, 18px) clamp(30px, 3.5vw, 44px);
      font-size: clamp(1rem, 1.2vw, 1.15rem);
      box-shadow: 0 8px 25px rgba(251, 191, 36, 0.5);
    }
    .btn-restart:hover {
      transform: scale(1.06);
      filter: brightness(1.15);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popSuccess {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1.01); }
    }

    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    @media (max-width: 580px) {
      .quiz-footer {
        flex-direction: column;
      }
      .action-btn {
        width: 100%;
        text-align: center;
      }
      .options-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <div class="progress-header" id="progressHeader">
    <div class="header-top">
      <div class="progress-info">
        <span id="questionCounter">Pregunta 1 de 20</span>
        <span id="scoreCounter">Aciertos: 0</span>
        <span class="shortcut-hint">💡 Usa las teclas [A, B, C, D] y [Enter]</span>
      </div>
      <div class="top-brand-logo">
        <img src="Logo_MB.png" alt="Logo ECOEMS">
      </div>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </div>

  <div class="quiz-body" id="quizBody">
    <span class="question-topic" id="topicBadge">Estadística y Probabilidad</span>
    <h2 class="question-text" id="questionText">Cargando reactivo...</h2>

    <div class="options-grid" id="optionsContainer"></div>

    <div class="feedback-panel" id="feedbackPanel">
      <div class="feedback-title" id="feedbackTitle"></div>
      <div id="feedbackText"></div>
    </div>

    <div class="quiz-footer">
      <button class="action-btn btn-check" id="checkBtn" disabled>Comprobar respuesta</button>
      <button class="action-btn btn-next" id="nextBtn">Siguiente pregunta ➔</button>
    </div>
  </div>

  <div class="result-screen" id="resultScreen">
    <h2 class="result-title" id="resultTitle">¡Evaluación Finalizada!</h2>
    <div class="result-score" id="finalScore">0 / 20</div>
    <p class="result-message" id="finalMessage">Mensaje de desempeño</p>
    <button class="action-btn btn-restart" id="restartBtn">↻ Nuevo orden aleatorio</button>
  </div>
</div>

<script>
  var rawQuestions = [
    {
      topic: "Medidas de Tendencia Central",
      question: "Los tiempos en minutos que tardaron 7 alumnos en resolver un acertijo matemático fueron: 4, 5, 5, 6, 7, 8, 21. ¿Cuáles son los valores de la media y la mediana de este conjunto?",
      options: [
        "Media = 8, Mediana = 6",
        "Media = 6, Mediana = 8",
        "Media = 8, Mediana = 5",
        "Media = 7, Mediana = 6"
      ],
      answer: 0,
      explanation: "La suma de los 7 datos es 4 + 5 + 5 + 6 + 7 + 8 + 21 = 56, por lo que Media = 56 / 7 = 8. Al estar ordenados los 7 datos, el dato central (posición 4) es la Mediana = 6."
    },
    {
      topic: "Sensibilidad a Valores Extremos",
      question: "En una tienda de electrónica se registraron las ventas diarias de audífonos durante 6 días: 10, 12, 14, 14, 16, 42. Si se elimina el valor extremo (42), ¿qué medida de tendencia central sufre el cambio numérico más drástico?",
      options: [
        "La moda, porque desaparece el dato más frecuente.",
        "La media aritmética, porque depende directamente de la suma total de los datos.",
        "La mediana, porque se duplica su valor.",
        "Ninguna medida cambia al eliminar un dato."
      ],
      answer: 1,
      explanation: "Con el valor 42, la media es 108 / 6 = 18; al eliminarlo, la media baja a 66 / 5 = 13.2. En cambio, la moda sigue siendo 14 y la mediana se mantiene en 14."
    },
    {
      topic: "Cálculo de Media Aritmética",
      question: "Las puntuaciones obtenidas por un jugador de boliche en cinco partidas fueron: 110, 125, 115, 130, 120. ¿Cuál es la media aritmética de sus puntuaciones?",
      options: [
        "115",
        "120",
        "125",
        "130"
      ],
      answer: 1,
      explanation: "x̄ = (110 + 125 + 115 + 130 + 120) / 5 = 600 / 5 = 120."
    },
    {
      topic: "Cálculo de Mediana (Datos Pares)",
      question: "Se registran las temperaturas mínimas en grados Celsius durante ocho días de invierno: 3, 5, 2, 6, 4, 5, 7, 4. ¿Cuál es la mediana de estas temperaturas?",
      options: [
        "4.0 °C",
        "4.5 °C",
        "5.0 °C",
        "5.5 °C"
      ],
      answer: 1,
      explanation: "Ordenando los 8 datos de menor a mayor: 2, 3, 4, 4, 5, 5, 6, 7. Los dos valores centrales son 4 y 5, por lo que Me = (4 + 5) / 2 = 4.5 °C."
    },
    {
      topic: "Elección de Medida Representativa",
      question: "En un conjunto de datos numéricos donde todos los valores son distintos entre sí y existe un único dato extremadamente alto en comparación con el resto, ¿qué medida es más recomendable utilizar para representar el valor típico del grupo?",
      options: [
        "La moda",
        "La media aritmética",
        "La mediana",
        "El rango total"
      ],
      answer: 2,
      explanation: "Al ser todos los datos distintos no hay moda, y la media se distorsiona hacia arriba por el valor extremo; por lo tanto, la mediana es la medida idónea."
    },
    {
      topic: "Regla de la Suma (Eventos no Excluyentes)",
      question: "Al lanzar un dado cúbico equilibrado de 6 caras, ¿cuál es la probabilidad de obtener un número primo o un número mayor que 4?",
      options: [
        "2/3",
        "5/6",
        "1/2",
        "1/3"
      ],
      answer: 0,
      explanation: "Primos en el dado: {2, 3, 5} (P(A) = 3/6). Mayores que 4: {5, 6} (P(B) = 2/6). Intersección: {5} (P(A ∩ B) = 1/6). Por regla de la suma: P(A ∪ B) = 3/6 + 2/6 - 1/6 = 4/6 = 2/3."
    },
    {
      topic: "Probabilidad del Evento Complementario",
      question: "Una urna contiene 6 esferas blancas, 5 esferas negras y 4 esferas grises. Si se extrae una esfera al azar, ¿cuál es la probabilidad de que NO sea de color blanco?",
      options: [
        "2/5",
        "3/5",
        "1/3",
        "4/15"
      ],
      answer: 1,
      explanation: "Total de esferas = 6 + 5 + 4 = 15. La probabilidad de que sea blanca es P(blanca) = 6/15 = 2/5. Aplicando el evento complementario: P(no blanca) = 1 - 2/5 = 3/5."
    },
    {
      topic: "Probabilidad Condicional sin Reemplazo",
      question: "En una bolsa hay 3 canicas rojas y 7 canicas azules. Si se extraen dos canicas consecutivamente sin reemplazo, ¿cuál es la probabilidad de que ambas sean rojas?",
      options: [
        "9/100",
        "1/15",
        "3/10",
        "6/100"
      ],
      answer: 1,
      explanation: "En la primera extracción P(R₁) = 3/10. Al no devolver la canica, quedan 2 rojas de 9 totales: P(R₂ | R₁) = 2/9. La probabilidad conjunta es (3/10) × (2/9) = 6/90 = 1/15."
    },
    {
      topic: "Eventos Mutuamente Excluyentes",
      question: "Se tiene una baraja de 10 tarjetas numeradas del 1 al 10. Si se elige una tarjeta al azar, ¿cuál es la probabilidad de obtener un múltiplo de 4 o un número menor que 3?",
      options: [
        "2/5",
        "1/2",
        "3/10",
        "3/5"
      ],
      answer: 0,
      explanation: "Múltiplos de 4: {4, 8} (2 casos). Menores que 3: {1, 2} (2 casos). Como no tienen elementos en común (son eventos mutuamente excluyentes), P(A ∪ B) = 2/10 + 2/10 = 4/10 = 2/5."
    },
    {
      topic: "Complemento en Probabilidad Decimal",
      question: "El pronóstico meteorológico indica que la probabilidad de que llueva mañana en una ciudad es de 0.35. ¿Cuál es la probabilidad de que NO llueva mañana?",
      options: [
        "0.35",
        "0.55",
        "0.65",
        "0.75"
      ],
      answer: 2,
      explanation: "Por la regla del evento complementario: P(no llueva) = 1 - P(llueva) = 1 - 0.35 = 0.65."
    },
    {
      topic: "Extracción Sucesiva sin Reemplazo",
      question: "En un frasco hay 5 dulces de menta y 4 dulces de fresa. Si una persona saca dos dulces al azar uno tras otro sin reemplazo, ¿cuál es la probabilidad de que ambos sean de fresa?",
      options: [
        "16/81",
        "1/6",
        "4/9",
        "12/81"
      ],
      answer: 1,
      explanation: "Total = 9 dulces. Primera extracción: 4/9. Segunda extracción sin reemplazo: 3/8. Producto: (4/9) × (3/8) = 12/72 = 1/6."
    },
    {
      topic: "Espacio Muestral de Monedas",
      question: "Se lanzan dos monedas equilibradas al aire simultáneamente. ¿Cuál es la probabilidad de obtener exactamente una cara ('águila') y una cruz ('sol')?",
      options: [
        "1/4",
        "1/2",
        "3/4",
        "1/3"
      ],
      answer: 1,
      explanation: "El espacio muestral tiene 4 resultados equiprobables: {(A, A), (A, S), (S, A), (S, S)}. Los casos favorables con una cara y una cruz son 2: (A, S) y (S, A). Por tanto, P = 2/4 = 1/2."
    },
    {
      topic: "Definición de Eventos Disjuntos",

      options: [

      answer: 1,
      explanation: "En un muestreo aleatorio simple, por puro azar un subgrupo pequeño podría quedar subrepresentado o ausente; el muestreo estratificado garantiza una representación proporcional exacta de cada estrato."

    {

      question: "Un inspector de calidad desea evaluar el estado de las bancas en las 60 escuelas secundarias de un distrito escolar. Para ello, selecciona al azar 5 escuelas completas y revisa absolutamente todas las bancas dentro de esas 5 escuelas. ¿Qué técnica de muestreo empleó?",
      options: [

      answer: 1,
      explanation: "Cada escuela funciona como una agrupación natural (conglomerado). Al seleccionar al azar algunos conglomerados enteros y analizar a todos los elementos de su interior, se realiza un muestreo por conglomerados."

    {

        "La población es la totalidad de elementos objeto de estudio, mientras que la muestra es un subconjunto representativo extraído de ella.",

      ],
      answer: 1,
      explanation: "Por definición estadística, la población abarca el 100% de los elementos con una característica común de interés, y la muestra es una parte seleccionada de dicha población para su análisis."

  var questions = [];
  var currentQuestionIndex = 0;
  var selectedOptionIndex = null;
  var score = 0;

  var prefixes = ["A", "B", "C", "D"];

  var questionCounter = document.getElementById("questionCounter");
  var scoreCounter = document.getElementById("scoreCounter");
  var progressBar = document.getElementById("progressBar");
  var topicBadge = document.getElementById("topicBadge");
  var questionText = document.getElementById("questionText");
  var optionsContainer = document.getElementById("optionsContainer");
  var feedbackPanel = document.getElementById("feedbackPanel");
  var feedbackTitle = document.getElementById("feedbackTitle");
  var feedbackText = document.getElementById("feedbackText");
  var checkBtn = document.getElementById("checkBtn");
  var nextBtn = document.getElementById("nextBtn");
  var quizBody = document.getElementById("quizBody");
  var progressHeader = document.getElementById("progressHeader");
  var resultScreen = document.getElementById("resultScreen");
  var finalScore = document.getElementById("finalScore");
  var finalMessage = document.getElementById("finalMessage");
  var resultTitle = document.getElementById("resultTitle");
  var restartBtn = document.getElementById("restartBtn");

  function shuffleArray(array) {
    var shuffled = array.slice();
    for (var i = shuffled.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = shuffled[i];
      shuffled[i] = shuffled[j];
      shuffled[j] = temp;
    }
    return shuffled;
  }

  function initQuiz() {
    questions = shuffleArray(rawQuestions);
    currentQuestionIndex = 0;
    score = 0;
    resultScreen.style.display = "none";
    progressHeader.style.display = "flex";
    quizBody.style.display = "flex";
    loadQuestion();
  }

  function loadQuestion() {
    selectedOptionIndex = null;
    checkBtn.disabled = true;
    checkBtn.style.display = "inline-block";
    nextBtn.style.display = "none";
    feedbackPanel.style.display = "none";
    feedbackPanel.className = "feedback-panel";

    var q = questions[currentQuestionIndex];

    questionCounter.textContent = "Pregunta " + (currentQuestionIndex + 1) + " de " + questions.length;
    scoreCounter.textContent = "Aciertos: " + score;
    progressBar.style.width = (((currentQuestionIndex + 1) / questions.length) * 100) + "%";

    topicBadge.textContent = q.topic;
    questionText.innerHTML = (currentQuestionIndex + 1) + ". " + q.question;

    optionsContainer.innerHTML = "";
    q.options.forEach(function(optText, index) {
      var btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerHTML = '<span class="option-prefix">' + prefixes[index] + '</span> <span>' + optText + '</span>';
      btn.addEventListener("click", function() { selectOption(index); });
      optionsContainer.appendChild(btn);
    });
  }

  function selectOption(index) {
    if (checkBtn.style.display === "none") return;
    selectedOptionIndex = index;
    var allOptions = optionsContainer.querySelectorAll(".option-btn");
    allOptions.forEach(function(btn, idx) {
      if (idx === index) {
        btn.classList.add("selected");
      } else {
        btn.classList.remove("selected");
      }
    });
    checkBtn.disabled = false;
  }

  function checkAnswer() {
    if (selectedOptionIndex === null) return;
    var q = questions[currentQuestionIndex];
    var allOptions = optionsContainer.querySelectorAll(".option-btn");

    allOptions.forEach(function(btn) { btn.disabled = true; });
    checkBtn.style.display = "none";
    nextBtn.style.display = "inline-block";

    var isCorrect = (selectedOptionIndex === q.answer);

    if (isCorrect) {
      score++;
      scoreCounter.textContent = "Aciertos: " + score;
      allOptions[selectedOptionIndex].classList.remove("selected");
      allOptions[selectedOptionIndex].classList.add("correct");

      feedbackPanel.className = "feedback-panel success";
      feedbackTitle.innerHTML = "📊 ¡Excelente! Respuesta correcta";
      feedbackText.innerHTML = q.explanation;
    } else {
      allOptions[selectedOptionIndex].classList.remove("selected");
      allOptions[selectedOptionIndex].classList.add("incorrect");
      allOptions[q.answer].classList.add("correct");

      feedbackPanel.className = "feedback-panel error";
      feedbackTitle.innerHTML = "💡 Justificación estadística:";
      feedbackText.innerHTML = "<strong>Desarrollo:</strong> " + q.explanation;
    }

    feedbackPanel.style.display = "block";
    nextBtn.focus();
  }

  function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < questions.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    quizBody.style.display = "none";
    progressHeader.style.display = "none";
    resultScreen.style.display = "block";

    finalScore.textContent = score + " / " + questions.length;

    var msg = "";
    if (score === 20) {
      resultTitle.textContent = "🏆 ¡Dominio Absoluto en Probabilidad y Estadística!";
      msg = "¡Súper bien! Resolviste correctamente los 20 reactivos. Dominas medidas de tendencia central, reglas de probabilidad y técnicas de muestreo.";
    } else if (score >= 16) {
      resultTitle.textContent = "🌟 ¡Excelente Desempeño!";
      msg = "Tienes un nivel de preparación muy sólido. Repasa la diferencia entre muestreo estratificado y por conglomerados para alcanzar la perfección.";
    } else if (score >= 11) {
      resultTitle.textContent = "👍 ¡Buen Esfuerzo!";
      msg = "Vas por buen camino. Te sugerimos practicar más la probabilidad condicional sin reemplazo y la regla de la suma.";
    } else {
      resultTitle.textContent = "💪 ¡A Seguir Practicando!";
      msg = "¡No te desanimes! Refuerza el cálculo de media, mediana, eventos complementarios y tipos de muestreo para volver a intentarlo.";
    }
    finalMessage.textContent = msg;
  }

  checkBtn.addEventListener("click", checkAnswer);
  nextBtn.addEventListener("click", nextQuestion);
  restartBtn.addEventListener("click", initQuiz);

  document.addEventListener("keydown", function(e) {
    if (resultScreen.style.display === "block") {
      if (e.key === "Enter") initQuiz();
      return;
    }

    var key = e.key.toUpperCase();
    if (["A", "1"].indexOf(key) !== -1) selectOption(0);
    else if (["B", "2"].indexOf(key) !== -1) selectOption(1);
    else if (["C", "3"].indexOf(key) !== -1) selectOption(2);
    else if (["D", "4"].indexOf(key) !== -1) selectOption(3);
    else if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (checkBtn.style.display !== "none" && !checkBtn.disabled) {
        checkAnswer();
      } else if (nextBtn.style.display !== "none") {
        nextQuestion();
      }
    }
  });

  window.addEventListener("DOMContentLoaded", initQuiz);
</script>
