<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simulador de Habilidad Matemática: Razonamiento Espacial</title>
  <style>
    @font-face {
      font-family: 'Mogena';
      src: url('https://fonts.cdnfonts.com/s/91216/MogenaRegular-8Mzx3.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 35%, #311b92 70%, #020617 100%);
      --card-bg: rgba(15, 23, 42, 0.90);
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;

      --neon-lime: #f97316;
      --pastel-lime: rgba(249, 115, 22, 0.15);
      --neon-emerald: #fb923c;
      --pastel-emerald: rgba(251, 146, 60, 0.15);
      --neon-cyan: #38bdf8;
      --pastel-cyan: rgba(56, 189, 248, 0.15);
      --neon-green: #22c55e;
      --pastel-green: rgba(34, 197, 94, 0.2);
      --neon-red: #ef4444;
      --pastel-red: rgba(239, 68, 68, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Mogena', 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: clamp(6px, 1.5vw, 20px);
    }

    .quiz-container {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      width: 100%;
      max-width: 1250px;
      min-height: min(94vh, 900px);
      border-radius: clamp(16px, 2.5vw, 28px);
      border: clamp(2px, 0.3vw, 3px) solid var(--neon-lime);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(249, 115, 22, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      margin: auto;
      position: relative;
    }

    .progress-header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: clamp(12px, 2vw, 20px) clamp(16px, 3vw, 36px);
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: clamp(2px, 0.3vw, 3px) solid var(--neon-lime);
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .progress-info {
      display: flex;
      gap: clamp(10px, 2.5vw, 24px);
      flex-wrap: wrap;
      font-size: clamp(0.95rem, 1.2vw, 1.2rem);
      color: var(--neon-lime);
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(249, 115, 22, 0.4);
    }

    .shortcut-hint {
      font-size: 0.8rem;
      color: #ffedd5;
      font-weight: 600;
      display: none;
    }

    @media (min-width: 1024px) {
      .shortcut-hint {
        display: inline-block;
      }
    }

    .top-brand-logo img {
      height: clamp(34px, 5vw, 68px);
      width: auto;
      object-fit: contain;
      filter: contrast(1.15) drop-shadow(0 0 10px rgba(249, 115, 22, 0.5));
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .top-brand-logo img:hover {
      transform: scale(1.1) rotate(-2deg);
    }

    .progress-bar-bg {
      width: 100%;
      height: clamp(10px, 1.1vw, 15px);
      background-color: rgba(30, 41, 59, 0.8);
      border-radius: 30px;
      overflow: hidden;
      border: 1.5px solid rgba(249, 115, 22, 0.4);
    }

    .progress-bar-fill {
      height: 100%;
      width: 5%;
      background: linear-gradient(90deg, var(--neon-lime), var(--neon-emerald), var(--neon-cyan));
      border-radius: 30px;
      box-shadow: 0 0 15px var(--neon-lime);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .quiz-body {
      padding: clamp(16px, 2.5vw, 36px);
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 1150px;
      margin: 0 auto;
      width: 100%;
      overflow-y: auto;
    }

    .question-topic {
      align-self: flex-start;
      font-size: clamp(0.75rem, 0.9vw, 0.9rem);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 6px clamp(12px, 1.5vw, 18px);
      border-radius: 30px;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      font-weight: 900;
      margin-bottom: clamp(10px, 1.5vw, 18px);
      box-shadow: 0 0 15px rgba(249, 115, 22, 0.4);
    }

    .question-text {
      font-size: clamp(1.05rem, 1.5vw, 1.45rem);
      line-height: 1.45;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: clamp(16px, 2vw, 24px);
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: clamp(10px, 1.3vw, 16px);
      margin-bottom: clamp(16px, 2vw, 22px);
    }

    .option-btn {
      background: rgba(30, 41, 59, 0.6);
      border: clamp(2px, 0.25vw, 3px) solid rgba(249, 115, 22, 0.35);
      border-radius: clamp(14px, 1.5vw, 18px);
      padding: clamp(12px, 1.4vw, 16px) clamp(14px, 1.6vw, 18px);
      text-align: left;
      font-size: clamp(0.95rem, 1.15vw, 1.1rem);
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: var(--text-main);
      font-weight: 600;
      line-height: 1.35;
      overflow-wrap: break-word;
      word-break: break-word;
      min-height: 56px;
      position: relative;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--neon-lime);
      background-color: var(--pastel-lime);
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 8px 20px rgba(249, 115, 22, 0.3);
    }

    .option-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .option-btn.selected {
      border-color: var(--neon-lime);
      background-color: var(--pastel-lime);
      color: #fed7aa;
      box-shadow: 0 0 20px rgba(249, 115, 22, 0.5);
      transform: scale(1.01);
    }

    .option-prefix {
      font-weight: 900;
      margin-right: 12px;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      width: clamp(34px, 3.2vw, 40px);
      height: clamp(34px, 3.2vw, 40px);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: clamp(0.85rem, 1vw, 1rem);
      color: #0f172a;
      border: 2px solid var(--neon-lime);
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .option-btn.selected .option-prefix {
      background: var(--neon-lime);
      border-color: #ffffff;
      color: #0f172a;
      transform: rotate(360deg);
    }

    .option-btn.correct {
      background-color: var(--pastel-green) !important;
      border-color: var(--neon-green) !important;
      color: #86efac !important;
      box-shadow: 0 0 22px rgba(34, 197, 94, 0.5) !important;
      animation: popSuccess 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .option-btn.correct .option-prefix {
      background: var(--neon-green);
      border-color: var(--neon-green);
      color: #0f172a;
    }

    .option-btn.incorrect {
      background-color: var(--pastel-red) !important;
      border-color: var(--neon-red) !important;
      color: #fca5a5 !important;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.5) !important;
      animation: shakeError 0.35s ease-in-out;
    }
    .option-btn.incorrect .option-prefix {
      background: var(--neon-red);
      border-color: var(--neon-red);
      color: #ffffff;
    }

    .feedback-panel {
      padding: clamp(14px, 1.8vw, 20px);
      border-radius: clamp(14px, 1.5vw, 18px);
      margin-bottom: clamp(14px, 1.8vw, 20px);
      display: none;
      animation: slideUp 0.3s ease;
      line-height: 1.5;
      font-size: clamp(0.9rem, 1.05vw, 1rem);
    }

    .feedback-panel.success {
      background-color: rgba(34, 197, 94, 0.15);
      border: clamp(2px, 0.25vw, 3px) solid var(--neon-green);
      color: #dcfce7;
    }

    .feedback-panel.error {
      background-color: rgba(239, 68, 68, 0.15);
      border: clamp(2px, 0.25vw, 3px) solid var(--neon-red);
      color: #ffe4e6;
    }

    .feedback-title {
      font-weight: 900;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(1rem, 1.15vw, 1.15rem);
    }

    .quiz-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 4px;
    }

    .action-btn {
      padding: clamp(12px, 1.4vw, 16px) clamp(24px, 2.8vw, 34px);
      font-size: clamp(0.95rem, 1.15vw, 1.1rem);
      font-weight: 800;
      border: none;
      border-radius: clamp(12px, 1.2vw, 16px);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      letter-spacing: 0.5px;
      width: auto;
      min-height: 48px;
    }

    .btn-check {
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      box-shadow: 0 6px 20px rgba(249, 115, 22, 0.4);
    }
    .btn-check:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.15);
    }
    .btn-check:disabled {
      background: #1e293b;
      color: #475569;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-next {
      background: linear-gradient(135deg, var(--neon-emerald), var(--neon-cyan));
      color: #0f172a;
      display: none;
      box-shadow: 0 6px 20px rgba(251, 146, 60, 0.4);
    }
    .btn-next:hover {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.15);
    }

    .result-screen {
      display: none;
      text-align: center;
      padding: clamp(24px, 4vw, 50px) clamp(14px, 3vw, 24px);
      margin: auto;
      max-width: 800px;
      animation: slideUp 0.4s ease;
    }

    .result-title {
      font-size: clamp(1.8rem, 3.2vw, 2.5rem);
      color: var(--neon-lime);
      font-weight: 900;
      text-shadow: 0 0 15px rgba(249, 115, 22, 0.5);
    }

    .result-score {
      font-size: clamp(3.5rem, 7vw, 5rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald), var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: clamp(10px, 1.8vw, 18px) 0;
      filter: drop-shadow(0 0 15px rgba(249, 115, 22, 0.6));
    }

    .result-message {
      font-size: clamp(1rem, 1.3vw, 1.2rem);
      color: var(--text-main);
      margin-bottom: clamp(20px, 2.8vw, 32px);
      line-height: 1.5;
      font-weight: 600;
    }

    .btn-restart {
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      padding: clamp(14px, 1.6vw, 18px) clamp(30px, 3.5vw, 44px);
      font-size: clamp(1rem, 1.2vw, 1.15rem);
      box-shadow: 0 8px 25px rgba(249, 115, 22, 0.5);
    }
    .btn-restart:hover {
      transform: scale(1.06);
      filter: brightness(1.15);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popSuccess {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1.01); }
    }

    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    @media (max-width: 580px) {
      .quiz-footer {
        flex-direction: column;
      }
      .action-btn {
        width: 100%;
        text-align: center;
      }
      .options-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <div class="progress-header" id="progressHeader">
    <div class="header-top">
      <div class="progress-info">
        <span id="questionCounter">Pregunta 1 de 20</span>
        <span id="scoreCounter">Aciertos: 0</span>
        <span class="shortcut-hint">💡 Usa las teclas [A, B, C, D] y [Enter]</span>
      </div>
      <div class="top-brand-logo">
        <img src="Logo_MB.png" alt="Logo ECOEMS">
      </div>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </div>

  <div class="quiz-body" id="quizBody">
    <span class="question-topic" id="topicBadge">Habilidad Matemática: Razonamiento Espacial</span>
    <h2 class="question-text" id="questionText">Cargando reactivo...</h2>

    <div class="options-grid" id="optionsContainer"></div>

    <div class="feedback-panel" id="feedbackPanel">
      <div class="feedback-title" id="feedbackTitle"></div>
      <div id="feedbackText"></div>
    </div>

    <div class="quiz-footer">
      <button class="action-btn btn-check" id="checkBtn" disabled>Comprobar respuesta</button>
      <button class="action-btn btn-next" id="nextBtn">Siguiente pregunta ➔</button>
    </div>
  </div>

  <div class="result-screen" id="resultScreen">
    <h2 class="result-title" id="resultTitle">¡Evaluación Finalizada!</h2>
    <div class="result-score" id="finalScore">0 / 20</div>
    <p class="result-message" id="finalMessage">Mensaje de desempeño</p>
    <button class="action-btn btn-restart" id="restartBtn">↻ Reiniciar simulador</button>
  </div>
</div>

<script>
  var rawQuestions = [
    {
      topic: "Conteo de Caras en Cubos Subdivisiones",
      question: "1. Un cubo grande de madera de 4×4×4 centímetros se pinta completamente de negro en su superficie exterior y luego se sierra en 64 cubitos unitarios de 1×1×1 centímetro. ¿Cuántos cubitos tienen EXACTAMENTE una sola cara pintada de negro?",
      options: [
        "16 cubitos",
        "24 cubitos",
        "8 cubitos",
        "12 cubitos"
      ],
      answer: 1,
      explanation: "Los cubitos con una sola cara pintada se ubican en el centro de las 6 caras del cubo. Para n = 4, el número de cubitos en el centro de cada cara es (n - 2)² = (4 - 2)² = 2² = 4. Al multiplicar por las 6 caras: 6 × 4 = 24 cubitos."
    },
    {
      topic: "Núcleo Interior (0 Caras Pintadas)",
      question: "2. Un cubo de 5×5×5 unidades se pinta exteriormente de rojo y se divide en 125 cubitos unitarios. ¿Cuántos cubitos quedan totalmente limpios sin ninguna cara pintada (0 caras pintadas)?",
      options: [
        "27 cubitos",
        "9 cubitos",
        "36 cubitos",
        "64 cubitos"
      ],
      answer: 0,
      explanation: "Los cubitos con 0 caras pintadas forman el núcleo interior del cubo. Su cantidad es N₀ = (n - 2)³. Con n = 5, se obtiene N₀ = (5 - 2)³ = 3³ = 27 cubitos."
    },
    {
      topic: "Cubitos de Vértices (3 Caras Pintadas)",
      question: "3. Se tiene un cubo de 3×3×3 pintado de verde en sus seis caras. Si se desmonta en sus 27 cubitos componentes, ¿cuántos cubitos presentan exactamente 3 caras pintadas de verde?",
      options: [
        "12 cubitos",
        "6 cubitos",
        "8 cubitos",
        "4 cubitos"
      ],
      answer: 2,
      explanation: "Los cubitos con 3 caras pintadas corresponden exclusivamente a las esquinas o vértices del cubo original. Todo cubo posee exactamente 8 vértices, por lo que la respuesta es 8."
    },
    {
      topic: "Topología e Invariantes Geométricos",
      question: "4. Un cubo tiene tres caras adyacentes pintadas de amarillo, azul y rojo que concurren en un mismo vértice V. Si el cubo gira libremente en el espacio tridimensional, ¿cuál de las siguientes propiedades geométricas permanece inalterada?",
      options: [
        "La orientación de las caras respecto al observador exterior.",
        "La relación de adyacencia y contacto común entre las tres caras coloreadas.",
        "La posición absoluta del vértice V en el espacio.",
        "La proyección de la sombra del cubo sobre el plano horizontal."
      ],
      answer: 1,
      explanation: "Las rotaciones rígidas en el espacio conservan la topología interna del cuerpo. Aunque el cubo cambie de posición o de orientación vista por el observador, la relación de vecindad entre las tres caras que comparten el vértice V es una propiedad invariante."
    },
    {
      topic: "Pintado Parcial de Superficies",
      question: "5. Se construye una estructura cúbica de 4×4×4 cortada en 64 cubitos de 1×1×1. Si únicamente se pintan las superficies superior e inferior del cubo grande de color amarillo, ¿cuántos cubitos tendrán al menos una cara pintada de amarillo?",
      options: [
        "32 cubitos",
        "16 cubitos",
        "24 cubitos",
        "48 cubitos"
      ],
      answer: 0,
      explanation: "La capa superior del cubo contiene 4 × 4 = 16 cubitos y la capa inferior contiene otros 4 × 4 = 16 cubitos. Al sumar ambas capas pintadas: 16 + 16 = 32 cubitos."
    },
    {
      topic: "Desarrollo Plano y Adyacencia",
      question: "6. Si se despliega la superficie de un cubo de cartón en un desarrollo plano (red de 6 cuadrados), ¿cuántas caras son adyacentes (comparten una arista) a una cara elegida cualquiera?",
      options: [
        "2 caras",
        "3 caras",
        "4 caras",
        "5 caras"
      ],
      answer: 2,
      explanation: "En la estructura tridimensional de un cubo, cualquier cara seleccionada comparte una arista directamente con 4 caras adyacentes (norte, sur, este y oeste). La cara restante es su cara opuesta."
    },
    {
      topic: "Cubitos de Aristas (2 Caras Pintadas)",
      question: "7. Un cubo de 5×5×5 pintado exteriormente de blanco se divide en 125 cubitos de 1×1×1. ¿Cuántos cubitos tienen exactamente 2 caras pintadas?",
      options: [
        "36 cubitos",
        "24 cubitos",
        "48 cubitos",
        "30 cubitos"
      ],
      answer: 0,
      explanation: "Los cubitos con 2 caras pintadas están en las aristas. Un cubo tiene 12 aristas y en cada una hay (n - 2) cubitos. Para n = 5: N₂ = 12 × (5 - 2) = 12 × 3 = 36 cubitos."
    },
    {
      topic: "Propiedades del Dado Estándar",
      question: "8. Se tiene un cubo con las caras numeradas del 1 al 6 como en un dado estándar (donde las caras opuestas suman 7). Si la cara 1 está en la base inferior, ¿qué número se encuentra en la cara superior y cuántas caras adyacentes rodean lateralmente a la cara 1?",
      options: [
        "Cara superior: 6; Caras adyacentes: 4.",
        "Cara superior: 5; Caras adyacentes: 4.",
        "Cara superior: 6; Caras adyacentes: 5.",
        "Cara superior: 2; Caras adyacentes: 4."
      ],
      answer: 0,
      explanation: "Si las caras opuestas suman 7, la cara opuesta al 1 es 7 - 1 = 6 (cara superior). Toda cara de un cubo está rodeada por exactamente 4 caras adyacentes."
    },
    {
      topic: "Cortes Mínimos Tridimensionales",
      question: "9. ¿Cuántos cortes rectos paralelos a las caras son necesarios como mínimo para dividir un cubo sólido de 3×3×3 en sus 27 cubitos unitarios componentes?",
      options: [
        "9 cortes",
        "6 cortes",
        "12 cortes",
        "3 cortes"
      ],
      answer: 1,
      explanation: "Se requieren 2 cortes paralelos a lo largo del eje X, 2 cortes a lo largo del eje Y y 2 cortes a lo largo del eje Z para obtener las subdivisiones. En total: 2 + 2 + 2 = 6 cortes."
    },
    {
      topic: "Perspectiva y Visión Tridimensional",
      question: "10. Al observar un dado sólido desde una esquina fija, ¿cuál es el número MÁXIMO de caras que un observador puede ver simultáneamente a simple vista sin mover el dado ni usar espejos?",
      options: [
        "2 caras",
        "4 caras",
        "3 caras",
        "1 cara"
      ],
      answer: 2,
      explanation: "Desde una perspectiva de esquina (vértice), la línea de visión permite abarcar al mismo tiempo únicamente las tres caras que concurren en ese vértice particular."
    },
    {
      topic: "Combinatoria (Apretones de Manos)",
      question: "11. En una reunión de fin de curso asisten 8 amigos. Si cada uno estrecha la mano de todos los demás asistentes exactamente una vez como saludo, ¿cuántos apretones de manos se efectúan en total?",
      options: [
        "56 apretones",
        "28 apretones",
        "64 apretones",
        "32 apretones"
      ],
      answer: 1,
      explanation: "Aplicando la fórmula de combinaciones para parejas: Total = [n(n - 1)] / 2. Para n = 8: Total = (8 × 7) / 2 = 56 / 2 = 28 apretones."
    },
    {
      topic: "Principio Multiplicativo con Restricciones",
      question: "12. Se desea generar una clave de seguridad de 3 dígitos distintos utilizando los números del conjunto {1, 2, 3, 4, 5, 6, 7}. Si el primer dígito debe ser impar y el último dígito debe ser par, ¿cuántas claves diferentes se pueden crear?",
      options: [
        "60 claves",

  var questions = [];
  var currentQuestionIndex = 0;
  var selectedOptionIndex = null;
  var score = 0;

  var prefixes = ["A", "B", "C", "D"];

  var questionCounter = document.getElementById("questionCounter");
  var scoreCounter = document.getElementById("scoreCounter");
  var progressBar = document.getElementById("progressBar");
  var topicBadge = document.getElementById("topicBadge");
  var questionText = document.getElementById("questionText");
  var optionsContainer = document.getElementById("optionsContainer");
  var feedbackPanel = document.getElementById("feedbackPanel");
  var feedbackTitle = document.getElementById("feedbackTitle");
  var feedbackText = document.getElementById("feedbackText");
  var checkBtn = document.getElementById("checkBtn");
  var nextBtn = document.getElementById("nextBtn");
  var quizBody = document.getElementById("quizBody");
  var progressHeader = document.getElementById("progressHeader");
  var resultScreen = document.getElementById("resultScreen");
  var finalScore = document.getElementById("finalScore");
  var finalMessage = document.getElementById("finalMessage");
  var resultTitle = document.getElementById("resultTitle");
  var restartBtn = document.getElementById("restartBtn");

  function initQuiz() {
    questions = rawQuestions;
    currentQuestionIndex = 0;
    score = 0;
    resultScreen.style.display = "none";
    progressHeader.style.display = "flex";
    quizBody.style.display = "flex";
    loadQuestion();
  }

  function loadQuestion() {
    selectedOptionIndex = null;
    checkBtn.disabled = true;
    checkBtn.style.display = "inline-block";
    nextBtn.style.display = "none";
    feedbackPanel.style.display = "none";
    feedbackPanel.className = "feedback-panel";

    var q = questions[currentQuestionIndex];

    questionCounter.textContent = "Pregunta " + (currentQuestionIndex + 1) + " de " + questions.length;
    scoreCounter.textContent = "Aciertos: " + score;
    progressBar.style.width = (((currentQuestionIndex + 1) / questions.length) * 100) + "%";

    topicBadge.textContent = q.topic;
    questionText.innerHTML = q.question;

    optionsContainer.innerHTML = "";
    q.options.forEach(function(optText, index) {
      var btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerHTML = '<span class="option-prefix">' + prefixes[index] + '</span> <span>' + optText + '</span>';
      btn.addEventListener("click", function() { selectOption(index); });
      optionsContainer.appendChild(btn);
    });
  }

  function selectOption(index) {
    if (checkBtn.style.display === "none") return;
    selectedOptionIndex = index;
    var allOptions = optionsContainer.querySelectorAll(".option-btn");
    allOptions.forEach(function(btn, idx) {
      if (idx === index) {
        btn.classList.add("selected");
      } else {
        btn.classList.remove("selected");
      }
    });
    checkBtn.disabled = false;
  }

  function checkAnswer() {
    if (selectedOptionIndex === null) return;
    var q = questions[currentQuestionIndex];
    var allOptions = optionsContainer.querySelectorAll(".option-btn");

    allOptions.forEach(function(btn) { btn.disabled = true; });
    checkBtn.style.display = "none";
    nextBtn.style.display = "inline-block";

    var isCorrect = (selectedOptionIndex === q.answer);

    if (isCorrect) {
      score++;
      scoreCounter.textContent = "Aciertos: " + score;
      allOptions[selectedOptionIndex].classList.remove("selected");
      allOptions[selectedOptionIndex].classList.add("correct");

      feedbackPanel.className = "feedback-panel success";
      feedbackTitle.innerHTML = "🎲 ¡Excelente! Respuesta correcta";
      feedbackText.innerHTML = q.explanation;
    } else {
      allOptions[selectedOptionIndex].classList.remove("selected");
      allOptions[selectedOptionIndex].classList.add("incorrect");
      allOptions[q.answer].classList.add("correct");

      feedbackPanel.className = "feedback-panel error";
      feedbackTitle.innerHTML = "💡 Justificación espacial y matemática:";
      feedbackText.innerHTML = "<strong>Demostración:</strong> " + q.explanation;
    }

    feedbackPanel.style.display = "block";
    nextBtn.focus();
  }

  function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < questions.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    quizBody.style.display = "none";
    progressHeader.style.display = "none";
    resultScreen.style.display = "block";

    finalScore.textContent = score + " / " + questions.length;

    var msg = "";
    if (score === 20) {
      resultTitle.textContent = "🚀 ¡Dominio Absoluto en Razonamiento Espacial!";
      msg = "¡Súper bien! Resolviste correctamente los 20 reactivos. Dominas las fórmulas de cortes y pintura en cubos, combinatoria, permutaciones con restricciones y navegación vectorial.";
    } else if (score >= 16) {
      resultTitle.textContent = "🌟 ¡Excelente Desempeño!";
      msg = "Tienes un nivel de razonamiento matemático muy alto. Revisa detalladamente los ejercicios de cubos pintados para pulir los últimos conceptos.";
    } else if (score >= 11) {
      resultTitle.textContent = "👍 ¡Buen Esfuerzo!";
      msg = "Vas por buen camino. Te sugerimos repasar la fórmula de apretones de manos [n(n-1)]/2 y los giros de 90° en planos cartesianos.";
    } else {
      resultTitle.textContent = "💪 ¡A Seguir Estudiando!";
      msg = "¡No te desanimes! Refuerza el principio multiplicativo de conteo y las vistas tridimensionales para volver a intentarlo.";
    }
    finalMessage.textContent = msg;
  }

  checkBtn.addEventListener("click", checkAnswer);
  nextBtn.addEventListener("click", nextQuestion);
  restartBtn.addEventListener("click", initQuiz);

  document.addEventListener("keydown", function(e) {
    if (resultScreen.style.display === "block") {
      if (e.key === "Enter") initQuiz();
      return;
    }

    var key = e.key.toUpperCase();
    if (["A", "1"].indexOf(key) !== -1) selectOption(0);
    else if (["B", "2"].indexOf(key) !== -1) selectOption(1);
    else if (["C", "3"].indexOf(key) !== -1) selectOption(2);
    else if (["D", "4"].indexOf(key) !== -1) selectOption(3);
    else if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (checkBtn.style.display !== "none" && !checkBtn.disabled) {
        checkAnswer();
      } else if (nextBtn.style.display !== "none") {
        nextQuestion();
      }
    }
  });

  window.addEventListener("DOMContentLoaded", initQuiz);
</script>
