<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simulador de Química: El Agua y Disoluciones</title>
  <style>
    @font-face {
      font-family: 'Mogena';
      src: url('https://fonts.cdnfonts.com/s/91216/MogenaRegular-8Mzx3.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-gradient: linear-gradient(135deg, #0284c7 0%, #0369a1 35%, #0f172a 70%, #0284c7 100%);
      --card-bg: rgba(12, 74, 110, 0.88);
      --text-main: #f0f9ff;
      --text-muted: #7dd3fc;

      --neon-lime: #38bdf8;
      --pastel-lime: rgba(56, 189, 248, 0.15);
      --neon-emerald: #2dd4bf;
      --pastel-emerald: rgba(45, 212, 191, 0.15);
      --neon-cyan: #22d3ee;
      --pastel-cyan: rgba(34, 211, 238, 0.15);
      --neon-green: #22c55e;
      --pastel-green: rgba(34, 197, 94, 0.2);
      --neon-red: #f43f5e;
      --pastel-red: rgba(244, 63, 94, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Mogena', 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: clamp(6px, 1.5vw, 20px);
    }

    .quiz-container {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      width: 100%;
      max-width: 1250px;
      min-height: min(94vh, 900px);
      border-radius: clamp(16px, 2.5vw, 28px);
      border: clamp(2px, 0.3vw, 3px) solid var(--neon-cyan);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(34, 211, 238, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      margin: auto;
      position: relative;
    }

    .progress-header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: clamp(12px, 2vw, 20px) clamp(16px, 3vw, 36px);
      background: rgba(12, 74, 110, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: clamp(2px, 0.3vw, 3px) solid var(--neon-lime);
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .progress-info {
      display: flex;
      gap: clamp(10px, 2.5vw, 24px);
      flex-wrap: wrap;
      font-size: clamp(0.95rem, 1.2vw, 1.2rem);
      color: var(--neon-lime);
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    .shortcut-hint {
      font-size: 0.8rem;
      color: #bae6fd;
      font-weight: 600;
      display: none;
    }

    @media (min-width: 1024px) {
      .shortcut-hint {
        display: inline-block;
      }
    }

    .top-brand-logo img {
      height: clamp(34px, 5vw, 68px);
      width: auto;
      object-fit: contain;
      filter: contrast(1.15) drop-shadow(0 0 10px rgba(34, 211, 238, 0.5));
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .top-brand-logo img:hover {
      transform: scale(1.1) rotate(-2deg);
    }

    .progress-bar-bg {
      width: 100%;
      height: clamp(10px, 1.1vw, 15px);
      background-color: rgba(7, 89, 133, 0.8);
      border-radius: 30px;
      overflow: hidden;
      border: 1.5px solid rgba(34, 211, 238, 0.4);
    }

    .progress-bar-fill {
      height: 100%;
      width: 5%;
      background: linear-gradient(90deg, var(--neon-lime), var(--neon-emerald), var(--neon-cyan));
      border-radius: 30px;
      box-shadow: 0 0 15px var(--neon-lime);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .quiz-body {
      padding: clamp(16px, 2.5vw, 36px);
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 1150px;
      margin: 0 auto;
      width: 100%;
      overflow-y: auto;
    }

    .question-topic {
      align-self: flex-start;
      font-size: clamp(0.75rem, 0.9vw, 0.9rem);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 6px clamp(12px, 1.5vw, 18px);
      border-radius: 30px;
      background: linear-gradient(135deg, var(--neon-emerald), var(--neon-cyan));
      color: #0c4a6e;
      font-weight: 900;
      margin-bottom: clamp(10px, 1.5vw, 18px);
      box-shadow: 0 0 15px rgba(45, 212, 191, 0.4);
    }

    .question-text {
      font-size: clamp(1.05rem, 1.5vw, 1.45rem);
      line-height: 1.45;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: clamp(16px, 2vw, 24px);
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: clamp(10px, 1.3vw, 16px);
      margin-bottom: clamp(16px, 2vw, 22px);
    }

    .option-btn {
      background: rgba(7, 89, 133, 0.6);
      border: clamp(2px, 0.25vw, 3px) solid rgba(34, 211, 238, 0.35);
      border-radius: clamp(14px, 1.5vw, 18px);
      padding: clamp(12px, 1.4vw, 16px) clamp(14px, 1.6vw, 18px);
      text-align: left;
      font-size: clamp(0.95rem, 1.15vw, 1.1rem);
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: var(--text-main);
      font-weight: 600;
      line-height: 1.35;
      overflow-wrap: break-word;
      word-break: break-word;
      min-height: 56px;
      position: relative;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--neon-lime);
      background-color: var(--pastel-lime);
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
    }

    .option-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .option-btn.selected {
      border-color: var(--neon-lime);
      background-color: var(--pastel-lime);
      color: #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
      transform: scale(1.01);
    }

    .option-prefix {
      font-weight: 900;
      margin-right: 12px;
      background: linear-gradient(135deg, var(--neon-emerald), var(--neon-lime));
      width: clamp(34px, 3.2vw, 40px);
      height: clamp(34px, 3.2vw, 40px);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: clamp(0.85rem, 1vw, 1rem);
      color: #0c4a6e;
      border: 2px solid var(--neon-lime);
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .option-btn.selected .option-prefix {
      background: var(--neon-lime);
      border-color: #ffffff;
      color: #0c4a6e;
      transform: rotate(360deg);
    }

    .option-btn.correct {
      background-color: var(--pastel-green) !important;
      border-color: var(--neon-green) !important;
      color: #86efac !important;
      box-shadow: 0 0 22px rgba(34, 197, 94, 0.5) !important;
      animation: popSuccess 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .option-btn.correct .option-prefix {
      background: var(--neon-green);
      border-color: var(--neon-green);
      color: #0c4a6e;
    }

    .option-btn.incorrect {
      background-color: var(--pastel-red) !important;
      border-color: var(--neon-red) !important;
      color: #fca5a5 !important;
      box-shadow: 0 0 20px rgba(244, 63, 94, 0.5) !important;
      animation: shakeError 0.35s ease-in-out;
    }
    .option-btn.incorrect .option-prefix {
      background: var(--neon-red);
      border-color: var(--neon-red);
      color: #ffffff;
    }

    .feedback-panel {
      padding: clamp(14px, 1.8vw, 20px);
      border-radius: clamp(14px, 1.5vw, 18px);
      margin-bottom: clamp(14px, 1.8vw, 20px);
      display: none;
      animation: slideUp 0.3s ease;
      line-height: 1.5;
      font-size: clamp(0.9rem, 1.05vw, 1rem);
    }

    .feedback-panel.success {
      background-color: rgba(34, 197, 94, 0.15);
      border: clamp(2px, 0.25vw, 3px) solid var(--neon-green);
      color: #dcfce7;
    }

    .feedback-panel.error {
      background-color: rgba(244, 63, 94, 0.15);
      border: clamp(2px, 0.25vw, 3px) solid var(--neon-red);
      color: #ffe4e6;
    }

    .feedback-title {
      font-weight: 900;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(1rem, 1.15vw, 1.15rem);
    }

    .quiz-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 4px;
    }

    .action-btn {
      padding: clamp(12px, 1.4vw, 16px) clamp(24px, 2.8vw, 34px);
      font-size: clamp(0.95rem, 1.15vw, 1.1rem);
      font-weight: 800;
      border: none;
      border-radius: clamp(12px, 1.2vw, 16px);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      letter-spacing: 0.5px;
      width: auto;
      min-height: 48px;
    }

    .btn-check {
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0c4a6e;
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
    }
    .btn-check:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.15);
    }
    .btn-check:disabled {
      background: #0f172a;
      color: #475569;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-next {
      background: linear-gradient(135deg, var(--neon-emerald), var(--neon-cyan));
      color: #0c4a6e;
      display: none;
      box-shadow: 0 6px 20px rgba(45, 212, 191, 0.4);
    }
    .btn-next:hover {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.15);
    }

    .result-screen {
      display: none;
      text-align: center;
      padding: clamp(24px, 4vw, 50px) clamp(14px, 3vw, 24px);
      margin: auto;
      max-width: 800px;
      animation: slideUp 0.4s ease;
    }

    .result-title {
      font-size: clamp(1.8rem, 3.2vw, 2.5rem);
      color: var(--neon-lime);
      font-weight: 900;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
    }

    .result-score {
      font-size: clamp(3.5rem, 7vw, 5rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald), var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: clamp(10px, 1.8vw, 18px) 0;
      filter: drop-shadow(0 0 15px rgba(45, 212, 191, 0.6));
    }

    .result-message {
      font-size: clamp(1rem, 1.3vw, 1.2rem);
      color: var(--text-main);
      margin-bottom: clamp(20px, 2.8vw, 32px);
      line-height: 1.5;
      font-weight: 600;
    }

    .btn-restart {
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0c4a6e;
      padding: clamp(14px, 1.6vw, 18px) clamp(30px, 3.5vw, 44px);
      font-size: clamp(1rem, 1.2vw, 1.15rem);
      box-shadow: 0 8px 25px rgba(56, 189, 248, 0.5);
    }
    .btn-restart:hover {
      transform: scale(1.06);
      filter: brightness(1.15);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popSuccess {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1.01); }
    }

    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    @media (max-width: 580px) {
      .quiz-footer {
        flex-direction: column;
      }
      .action-btn {
        width: 100%;
        text-align: center;
      }
      .options-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <div class="progress-header" id="progressHeader">
    <div class="header-top">
      <div class="progress-info">
        <span id="questionCounter">Pregunta 1 de 15</span>
        <span id="scoreCounter">Aciertos: 0</span>
        <span class="shortcut-hint">💡 Usa las teclas [A, B, C, D] y [Enter]</span>
      </div>
      <div class="top-brand-logo">
        <img src="Logo_MB.png" alt="Logo ECOEMS">
      </div>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </div>

  <div class="quiz-body" id="quizBody">
    <span class="question-topic" id="topicBadge">Tema</span>
    <h2 class="question-text" id="questionText">Cargando reactivo...</h2>

    <div class="options-grid" id="optionsContainer"></div>

    <div class="feedback-panel" id="feedbackPanel">
      <div class="feedback-title" id="feedbackTitle"></div>
      <div id="feedbackText"></div>
    </div>

    <div class="quiz-footer">
      <button class="action-btn btn-check" id="checkBtn" disabled>Comprobar respuesta</button>
      <button class="action-btn btn-next" id="nextBtn">Siguiente pregunta ➔</button>
    </div>
  </div>

  <div class="result-screen" id="resultScreen">
    <h2 class="result-title" id="resultTitle">¡Evaluación Finalizada!</h2>
    <div class="result-score" id="finalScore">0 / 15</div>
    <p class="result-message" id="finalMessage">Mensaje de desempeño</p>
    <button class="action-btn btn-restart" id="restartBtn">↻ Reiniciar simulador</button>
  </div>
</div>

<script>
  const rawQuestions = [
    {
      topic: "Estructura y Propiedades Físicas del Agua",
      question: "El agua posee un punto de ebullición relativamente elevado frente a sustancias de masa molecular semejante (como el H₂S). ¿Qué fenómeno explica mejor esta propiedad?",
      options: [
        "La formación de enlaces covalentes no polares.",
        "Sus moléculas forman puentes de hidrógeno que requieren energía para ser superados.",
        "La disociación completa de sus moléculas en iones.",
        "Su baja capacidad calorífica específica."
      ],
      answer: 1,
      explanation: "Los puentes de hidrógeno intermoleculares requieren gran cantidad de energía térmica para romperse antes de que las moléculas pasen a la fase gaseosa."
    },
    {
      topic: "Solubilidad y Polaridad",
      question: "Se agregaron al agua dos sustancias desconocidas: X está formada por moléculas polares y Y por moléculas no polares. ¿Cuál resultado es el más probable?",
      options: [
        "Y se disolverá más rápido por no tener cargas.",
        "X presenta mayor tendencia a disolverse por sus interacciones favorables con el agua.",
        "Ni X ni Y podrán disolverse en el agua.",
        "Ambas sustancias formarán una mezcla homogénea."
      ],
      answer: 1,
      explanation: "Siguiendo el principio de solubilidad 'lo semejante disuelve a lo semejante', las moléculas polares (X) interactúan favorablemente con el dipolo permanente del agua."
    },
    {
      topic: "Termoquímica y Calor Específico",
      question: "Se suministran 8.4 kJ de calor a 200 g de agua pura. Considerando c = 4.2 J/(g·°C) y ausencia de pérdidas térmicas, ¿cuál es el incremento de temperatura (ΔT)?",
      options: [
        "5 °C",
        "10 °C",
        "20 °C",
        "42 °C"
      ],
      answer: 1,
      explanation: "Aplicando la fórmula de calor Q = m · c · ΔT ⇒ ΔT = Q / (m · c) = 8400 J / (200 g · 4.2 J/(g·°C)) = 8400 / 840 = 10 °C."
    },
    {
      topic: "Conductividad Eléctrica y Electrolitos",
      question: "Dos disoluciones tienen igual concentración molar. La sustancia M produce una gran proporción de iones en agua, mientras que N produce una proporción pequeña. ¿Qué predicción es correcta?",
      options: [
        "N conducirá mejor por tener moléculas neutras.",
        "M conducirá mejor porque contiene una mayor proporción de partículas cargadas móviles.",
        "Ambas conducirán con la misma intensidad.",
        "Ninguna conducirá la corriente eléctrica."
      ],
      answer: 1,
      explanation: "La conductividad eléctrica en disolución acuosa depende directamente de la cantidad de iones libres (partículas cargadas con movilidad) presentes."
    },
    {
      topic: "Clasificación de Electrolitos",
      question: "Tres disoluciones de igual concentración presentan: P conductividad alta; Q conductividad baja pero detectable; R conductividad nula. ¿Cuál es la interpretación más consistente?",
      options: [
        "P es un electrolito débil y R uno fuerte.",
        "P puede ser un electrolito fuerte y Q uno débil, debido a diferencias en la formación de iones.",
        "P, Q y R corresponden a solutos no polares.",
        "R es un ácido fuerte disociado al 100%."
      ],
      answer: 1,
      explanation: "P se disocia completamente (electrolito fuerte), Q se disocia parcialmente (electrolito débil) y R permanece en forma molecular neutra (no electrolito)."
    },
    {
      topic: "Enlace Químico Intramolecular",
      question: "¿Qué tipo de enlace une covalentemente al átomo de oxígeno con los dos átomos de hidrógeno DENTRO de una misma molécula de agua?",
      options: [
        "Enlace covalente no polar",
        "Enlace covalente polar",
        "Puente de hidrógeno",
        "Enlace iónico"
      ],
      answer: 1,
      explanation: "Dentro de la molécula, el enlace entre el oxígeno y cada hidrógeno es covalente polar debido a la marcada diferencia de electronegatividad entre ambos elementos."
    },
    {
      topic: "Geometría Molecular y Polaridad",
      question: "La geometría molecular del agua es angular (~104.5°). ¿Qué consecuencia directa tiene esta geometría en la molécula?",
      options: [
        "Cancela los momentos dipolares.",
        "Impide la cancelación de los dipolos, otorgándole un momento dipolar neto y polaridad.",
        "Permite que sea un electrolito fuerte.",
        "Provoca que su punto de fusión sea menor a -50 °C."
      ],
      answer: 1,
      explanation: "La geometría angular evita que los momentos dipolares O-H se anulen por simetría, generando un momento dipolar neto permanente en la molécula."
    },
    {
      topic: "Definiciones de Capacidad Calorífica",
      question: "¿Cuál es la definición exacta de la capacidad calorífica específica (c) de una sustancia?",
      options: [
        "La masa para evaporar 1 litro de agua a 100 °C.",
        "La cantidad de calor requerida para elevar 1 g de sustancia en 1 °C.",
        "La energía liberada al disolver un mol.",
        "El volumen ocupado al cambiar de estado."
      ],
      answer: 1,
      explanation: "La capacidad calorífica específica (c) representa la energía en forma de calor requerida para elevar la temperatura de un gramo de masa en un grado Celsius."
    },
    {
      topic: "Tipos de Solutos y Electrolitos",
      question: "¿Cuál de los siguientes solutos actuará como un NO ELECTROLITO al disolverse en agua?",
      options: [
        "Cloruro de sodio (NaCl)",
        "Hidróxido de sodio (NaOH)",
        "Glucosa (C₆H₁₂O₆)",
        "Ácido clorhídrico (HCl)"
      ],
      answer: 2,
      explanation: "La glucosa es un compuesto orgánico molecular que se disuelve por puentes de hidrógeno sin disociarse en iones, actuando como no electrolito."
    },
    {
      topic: "Reglas de Solubilidad",
      question: "Aplicando la regla de solubilidad 'lo semejante disuelve a lo semejante', ¿cuál sustancia se disolverá con mayor facilidad en agua?",
      options: [
        "Aceite vegetal (hidrocarburo no polar)",
        "Ácido acético (CH₃COOH, molécula polar)",
        "Hexano (solvente no polar)",
        "Cera de parafina"
      ],
      answer: 1,
      explanation: "El ácido acético posee un grupo polar carboxilo (-COOH) capaz de establecer interacciones por puentes de hidrógeno y dipolo-dipolo con el agua."
    },
    {
      topic: "Cálculo de Capacidad Calorífica Específica",
      question: "Si se requieren 420 J para elevar la temperatura de 50 g de un líquido desconocido en 2 °C, ¿cuál es su capacidad calorífica específica?",
      options: [
        "4.2 J/(g·°C)",
        "2.1 J/(g·°C)",
        "8.4 J/(g·°C)",
        "1.0 J/(g·°C)"
      ],
      answer: 0,
      explanation: "Despejando c = Q / (m · ΔT) = 420 J / (50 g · 2 °C) = 420 / 100 = 4.2 J/(g·°C)."
    },
    {
      topic: "Regulación Térmica del Agua",
      question: "¿Por qué el agua es un excelente regulador térmico en los seres vivos y en el clima terrestre?",
      options: [
        "Debido a su baja densidad en estado sólido.",
        "Debido a su elevada capacidad calorífica específica.",
        "Porque se disocia rápidamente en iones.",
        "Porque reacciona con el aire al calentarse."
      ],
      answer: 1,
      explanation: "Su alto calor específico le permite absorber o ceder grandes cantidades de calor experimentando variaciones muy pequeñas de temperatura."
    },
    {
      topic: "Enlaces Intermoleculares vs Intramoleculares",
      question: "Un estudiante afirma que 'los puentes de hidrógeno son enlaces intramoleculares fuertes que unen átomos dentro del agua'. ¿Es correcta esta afirmación?",
      options: [
        "Sí, son los enlaces más fuertes dentro del átomo.",
        "No, son interacciones intermoleculares (entre moléculas distintas).",
        "Sí, porque garantizan la conducción eléctrica.",
        "No, en realidad son enlaces iónicos."
      ],
      answer: 1,
      explanation: "Los puentes de hidrógeno son fuerzas de atracción intermoleculares que ocurren entre el átomo de hidrógeno de una molécula y el oxígeno de otra molécula vecina."
    },
    {
      topic: "Pares de Electrolitos (Fuerte y Débil)",
      question: "¿Cuál de las siguientes combinaciones representa un ELECTROLITO FUERTE y un ELECTROLITO DÉBIL respectivamente?",
      options: [
        "NaCl (fuerte) y HCl (débil)",
        "HCl (fuerte) y CH₃COOH (débil)",
        "Sacarosa (fuerte) y NaOH (débil)",
        "CH₃COOH (fuerte) y NaCl (débil)"
      ],
      answer: 1,
      explanation: "El HCl es un ácido fuerte que se ioniza completamente al 100% en solución acuosa, mientras que el CH₃COOH (ácido acético) es un ácido débil con ionización parcial."
    },
    {
      topic: "Cambios de Fase y Fenómenos Térmicos",
      question: "¿Qué ocurre con la red de puentes de hidrógeno cuando el agua pasa de estado líquido a vapor durante la ebullición?",
      options: [
        "Se rompen los enlaces covalentes H-O.",
        "Se absorbe energía para romper las interacciones por puentes de hidrógeno.",
        "Las moléculas se convierten en iones móviles.",
        "Se forman puentes de hidrógeno más fuertes."
      ],
      answer: 1,
      explanation: "El cambio de fase de líquido a gas requiere suministrar calor latente de vaporización para romper completamente las atracciones intermoleculares por puentes de hidrógeno."
    }
  ];

  let questions = [];
  let currentQuestionIndex = 0;
  let selectedOptionIndex = null;
  let score = 0;

  const prefixes = ["A", "B", "C", "D"];

  const questionCounter = document.getElementById("questionCounter");
  const scoreCounter = document.getElementById("scoreCounter");
  const progressBar = document.getElementById("progressBar");
  const topicBadge = document.getElementById("topicBadge");
  const questionText = document.getElementById("questionText");
  const optionsContainer = document.getElementById("optionsContainer");
  const feedbackPanel = document.getElementById("feedbackPanel");
  const feedbackTitle = document.getElementById("feedbackTitle");
  const feedbackText = document.getElementById("feedbackText");
  const checkBtn = document.getElementById("checkBtn");
  const nextBtn = document.getElementById("nextBtn");
  const quizBody = document.getElementById("quizBody");
  const progressHeader = document.getElementById("progressHeader");
  const resultScreen = document.getElementById("resultScreen");
  const finalScore = document.getElementById("finalScore");
  const finalMessage = document.getElementById("finalMessage");
  const resultTitle = document.getElementById("resultTitle");
  const restartBtn = document.getElementById("restartBtn");

  function shuffleArray(array) {
    const shuffled = [...array];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
  }

  function initQuiz() {
    questions = shuffleArray(rawQuestions);
    currentQuestionIndex = 0;
    score = 0;
    resultScreen.style.display = "none";
    progressHeader.style.display = "flex";
    quizBody.style.display = "flex";
    loadQuestion();
  }

  function loadQuestion() {
    selectedOptionIndex = null;
    checkBtn.disabled = true;
    checkBtn.style.display = "inline-block";
    nextBtn.style.display = "none";
    feedbackPanel.style.display = "none";
    feedbackPanel.className = "feedback-panel";

    const q = questions[currentQuestionIndex];

    questionCounter.textContent = `Pregunta ${currentQuestionIndex + 1} de ${questions.length}`;
    scoreCounter.textContent = `Aciertos: ${score}`;
    progressBar.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;

    topicBadge.textContent = q.topic;
    questionText.innerHTML = q.question;

    optionsContainer.innerHTML = "";
    q.options.forEach((optText, index) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerHTML = `<span class="option-prefix">${prefixes[index]}</span> <span>${optText}</span>`;
      btn.addEventListener("click", () => selectOption(index));
      optionsContainer.appendChild(btn);
    });
  }

  function selectOption(index) {
    if (checkBtn.style.display === "none") return;
    selectedOptionIndex = index;
    const allOptions = optionsContainer.querySelectorAll(".option-btn");
    allOptions.forEach((btn, idx) => {
      if (idx === index) {
        btn.classList.add("selected");
      } else {
        btn.classList.remove("selected");
      }
    });
    checkBtn.disabled = false;
  }

  function checkAnswer() {
    if (selectedOptionIndex === null) return;
    const q = questions[currentQuestionIndex];
    const allOptions = optionsContainer.querySelectorAll(".option-btn");

    allOptions.forEach(btn => btn.disabled = true);
    checkBtn.style.display = "none";
    nextBtn.style.display = "inline-block";

    const isCorrect = (selectedOptionIndex === q.answer);

    if (isCorrect) {
      score++;
      scoreCounter.textContent = `Aciertos: ${score}`;
      allOptions[selectedOptionIndex].classList.remove("selected");
      allOptions[selectedOptionIndex].classList.add("correct");

      feedbackPanel.className = "feedback-panel success";
      feedbackTitle.innerHTML = "🧪 ¡Excelente! Respuesta correcta";
      feedbackText.innerHTML = q.explanation;
    } else {
      allOptions[selectedOptionIndex].classList.remove("selected");
      allOptions[selectedOptionIndex].classList.add("incorrect");
      allOptions[q.answer].classList.add("correct");

      feedbackPanel.className = "feedback-panel error";
      feedbackTitle.innerHTML = "💡 ¡Casi! Justificación química:";
      feedbackText.innerHTML = `<strong>Fundamento teórico:</strong> ${q.explanation}`;
    }

    feedbackPanel.style.display = "block";
    nextBtn.focus();
  }

  function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < questions.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    quizBody.style.display = "none";
    progressHeader.style.display = "none";
    resultScreen.style.display = "block";

    finalScore.textContent = `${score} / ${questions.length}`;

    let msg = "";
    if (score === 15) {
      resultTitle.textContent = "🧪 ¡Dominio Absoluto en Química!";
      msg = "¡Súper bien! Resolviste correctamente los 15 reactivos sobre el agua y disoluciones. Dominas las propiedades del enlace, puentes de hidrógeno y electrolitos.";
    } else if (score >= 12) {
      resultTitle.textContent = "🌟 ¡Excelente Desempeño!";
      msg = "Tienes un nivel de preparación muy destacado. Revisa los detalles de termoquímica y clasificación de electrolitos para lograr el puntaje perfecto.";
    } else if (score >= 8) {
      resultTitle.textContent = "👍 ¡Buen Esfuerzo!";
      msg = "Vas por buen camino. Te sugerimos repasar la diferencia entre fuerzas intermoleculares e intramoleculares y los cálculos de calor específico.";
    } else {
      resultTitle.textContent = "💪 ¡A Seguir Estudiando!";
      msg = "¡No te desanimes! Refuerza las reglas de solubilidad y el concepto de electrolitos para volver a intentarlo.";
    }
    finalMessage.textContent = msg;
  }

  checkBtn.addEventListener("click", checkAnswer);
  nextBtn.addEventListener("click", nextQuestion);
  restartBtn.addEventListener("click", initQuiz);

  document.addEventListener("keydown", (e) => {
    if (resultScreen.style.display === "block") {
      if (e.key === "Enter") initQuiz();
      return;
    }

    const key = e.key.toUpperCase();
    if (["A", "1"].includes(key)) selectOption(0);
    else if (["B", "2"].includes(key)) selectOption(1);
    else if (["C", "3"].includes(key)) selectOption(2);
    else if (["D", "4"].includes(key)) selectOption(3);
    else if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (checkBtn.style.display !== "none" && !checkBtn.disabled) {
        checkAnswer();
      } else if (nextBtn.style.display !== "none") {
        nextQuestion();
      }
    }
  });

  initQuiz();
</script>

</body>
</html>
