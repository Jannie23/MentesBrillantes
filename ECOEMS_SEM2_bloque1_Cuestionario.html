<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Proporcionalidad - ECOEMS</title>
  <style>
    @font-face {
      font-family: 'Mogena';
      src: url('https://fonts.cdnfonts.com/s/91216/MogenaRegular-8Mzx3.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      /* Fondo dinámico y multicolor */
      --bg-gradient: linear-gradient(135deg, #fbcfe8 0%, #ddd6fe 35%, #bae6fd 70%, #bbf7d0 100%);
      --card-bg: rgba(255, 255, 255, 0.92);
      --text-main: #18181b;
      --text-muted: #4b5563;

      /* Paleta Neón / Pastel Saturado */
      --neon-pink: #ff007f;
      --pastel-pink: #fdf2f8;
      --neon-purple: #9333ea;
      --pastel-purple: #f3e8ff;
      --neon-blue: #00b4d8;
      --pastel-blue: #e0f2fe;
      --neon-green: #10b981;
      --pastel-green: #d1fae5;
      --neon-red: #f43f5e;
      --pastel-red: #ffe4e6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Mogena', 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow-x: hidden;
      padding: 24px;
    }

    /* Logo Superior Derecho: Fundido directamente con el fondo y sin marcos ni bordes duros */
    .top-brand-logo {
      position: absolute;
      top: 28px;
      right: 36px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      box-shadow: none;
      pointer-events: none;
    }

    .top-brand-logo img {
      height: 95px;
      width: auto;
      object-fit: contain;
      background: transparent;
      border: none;
      outline: none;
      /* Modo de fusión para desaparecer bordes claros/blancos y fundir sobre el fondo */
      mix-blend-mode: multiply;
      filter: contrast(1.1) drop-shadow(0 4px 12px rgba(147, 51, 234, 0.18));
      transition: transform 0.3s ease;
      pointer-events: auto;
    }

    .top-brand-logo img:hover {
      transform: scale(1.05);
    }

    /* Contenedor Full Page */
    .quiz-container {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      width: 100%;
      max-width: 100%;
      min-height: calc(100vh - 48px);
      border-radius: 32px;
      border: 3px solid var(--neon-purple);
      box-shadow: 0 20px 40px rgba(147, 51, 234, 0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      margin: auto;
    }

    /* Barra de progreso */
    .progress-header {
      padding: 32px 48px 20px;
      background: linear-gradient(90deg, #fdf2f8, #f5f3ff, #ecfeff);
      border-bottom: 3px solid var(--neon-pink);
      padding-right: 280px; /* Margen para respetar el logo fundido */
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 1.35rem;
      color: var(--neon-purple);
      margin-bottom: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 18px;
      background-color: var(--pastel-purple);
      border-radius: 30px;
      overflow: hidden;
      border: 1px solid #d8b4fe;
    }

    .progress-bar-fill {
      height: 100%;
      width: 10%;
      background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple), var(--neon-blue), var(--neon-green));
      border-radius: 30px;
      transition: width 0.4s ease;
    }

    /* Contenido principal */
    .quiz-body {
      padding: 40px 60px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .question-topic {
      align-self: flex-start;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 8px 22px;
      border-radius: 30px;
      background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
      color: #ffffff;
      font-weight: 800;
      margin-bottom: 24px;
    }

    .question-text {
      font-size: 1.85rem;
      line-height: 1.45;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 32px;
    }

    /* Opciones */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .option-btn {
      background: #ffffff;
      border: 3px solid #e9d5ff;
      border-radius: 20px;
      padding: 20px 24px;
      text-align: left;
      font-size: 1.35rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      color: var(--text-main);
      font-weight: 600;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--neon-pink);
      background-color: var(--pastel-pink);
      transform: translateY(-3px);
    }

    .option-btn.selected {
      border-color: var(--neon-purple);
      background-color: var(--pastel-purple);
      color: var(--neon-purple);
    }

    .option-prefix {
      font-weight: 900;
      margin-right: 18px;
      background: linear-gradient(135deg, var(--pastel-pink), var(--pastel-blue));
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 1.25rem;
      color: var(--neon-purple);
      border: 2px solid var(--neon-blue);
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .option-btn.selected .option-prefix {
      background: var(--neon-purple);
      border-color: var(--neon-purple);
      color: #ffffff;
    }

    /* Retroalimentación */
    .option-btn.correct {
      background-color: var(--pastel-green) !important;
      border-color: var(--neon-green) !important;
      color: #065f46 !important;
    }
    .option-btn.correct .option-prefix {
      background: var(--neon-green);
      border-color: var(--neon-green);
      color: #ffffff;
    }

    .option-btn.incorrect {
      background-color: var(--pastel-red) !important;
      border-color: var(--neon-red) !important;
      color: #9f1239 !important;
    }
    .option-btn.incorrect .option-prefix {
      background: var(--neon-red);
      border-color: var(--neon-red);
      color: #ffffff;
    }

    .feedback-panel {
      padding: 24px 28px;
      border-radius: 20px;
      margin-bottom: 28px;
      display: none;
      animation: fadeIn 0.3s ease;
      line-height: 1.6;
      font-size: 1.3rem;
    }

    .feedback-panel.success {
      background-color: #ecfdf5;
      border: 3px solid var(--neon-green);
      color: #065f46;
    }

    .feedback-panel.error {
      background-color: #fff1f2;
      border: 3px solid var(--neon-red);
      color: #9f1239;
    }

    .feedback-title {
      font-weight: 900;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.45rem;
    }

    /* Botones de acción */
    .quiz-footer {
      display: flex;
      justify-content: flex-end;
      gap: 20px;
      margin-top: 10px;
    }

    .action-btn {
      padding: 16px 40px;
      font-size: 1.3rem;
      font-weight: 800;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      transition: all 0.25s ease;
      letter-spacing: 0.5px;
    }

    .btn-check {
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
      color: #ffffff;
    }
    .btn-check:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }
    .btn-check:disabled {
      background: #e2e8f0;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .btn-next {
      background: linear-gradient(135deg, var(--neon-blue), var(--neon-green));
      color: #ffffff;
      display: none;
    }
    .btn-next:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    /* Pantalla de Resultados */
    .result-screen {
      display: none;
      text-align: center;
      padding: 60px 20px;
      margin: auto;
      max-width: 850px;
      animation: fadeIn 0.4s ease;
    }

    .result-title {
      font-size: 3rem;
      color: var(--neon-purple);
      font-weight: 900;
    }

    .result-score {
      font-size: 6.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple), var(--neon-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 20px 0;
    }

    .result-message {
      font-size: 1.5rem;
      color: var(--text-main);
      margin-bottom: 40px;
      line-height: 1.6;
      font-weight: 600;
    }

    .btn-restart {
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
      color: #ffffff;
      padding: 18px 48px;
      font-size: 1.35rem;
    }
    .btn-restart:hover {
      transform: scale(1.05);
      filter: brightness(1.1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      body {
        padding: 12px;
      }
      .top-brand-logo {
        top: 14px;
        right: 16px;
      }
      .top-brand-logo img {
        height: 60px;
      }
      .progress-header {
        padding-right: 140px;
        padding-left: 20px;
      }
      .quiz-body {
        padding: 20px;
      }
      .options-grid {
        grid-template-columns: 1fr;
      }
      .question-text {
        font-size: 1.35rem;
      }
      .option-btn {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

<!-- Logo Esquina Superior Derecha: Fundido e integrado naturalmente -->
<div class="top-brand-logo">
  <img src="https://files.catbox.moe/k8pjc7.png" alt="Logo ECOEMS">
</div>

<div class="quiz-container">
  <div class="progress-header" id="progressHeader">
    <div class="progress-info">
      <span id="questionCounter">Pregunta 1 de 10</span>
      <span id="scoreCounter">Aciertos: 0</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </div>

  <div class="quiz-body" id="quizBody">
    <span class="question-topic" id="topicBadge">Tema</span>
    <h2 class="question-text" id="questionText">Texto del reactivo</h2>

    <div class="options-grid" id="optionsContainer"></div>

    <div class="feedback-panel" id="feedbackPanel">
      <div class="feedback-title" id="feedbackTitle"></div>
      <div id="feedbackText"></div>
    </div>

    <div class="quiz-footer">
      <button class="action-btn btn-check" id="checkBtn" disabled>Comprobar respuesta</button>
      <button class="action-btn btn-next" id="nextBtn">Siguiente pregunta ➔</button>
    </div>
  </div>

  <div class="result-screen" id="resultScreen">
    <h2 class="result-title">¡Evaluación Finalizada!</h2>
    <div class="result-score" id="finalScore">0 / 10</div>
    <p class="result-message" id="finalMessage">Mensaje de desempeño</p>
    <button class="action-btn btn-restart" id="restartBtn">↻ Reiniciar simulador</button>
  </div>
</div>

<script>
  const questions = [
    {
      topic: "Proporcionalidad Directa Simple",
      question: "Si 15 libretas del mismo modelo tienen un costo de $375, ¿cuánto se pagará por 24 libretas?",
      options: ["$550", "$600", "$625", "$720"],
      answer: 1,
      explanation: "A mayor número de libretas corresponde mayor costo (relación directa). El costo unitario es 375 ÷ 15 = $25. Al multiplicar 24 × $25 obtenemos exactamente $600."
    },
    {
      topic: "Directa con Decimales",
      question: "Para elaborar 16 litros de pintura de un tono especial se necesitan 3.6 litros de pigmento concentrado. ¿Cuántos litros de pigmento se requerirán para preparar 28 litros de pintura?",
      options: ["5.8 L", "6.3 L", "7.2 L", "8.1 L"],
      answer: 1,
      explanation: "Es una relación directa: x = (28 × 3.6) ÷ 16. Simplificando 28/16 a 7/4, obtenemos (7 × 3.6) ÷ 4 = 25.2 ÷ 4 = 6.3 litros de pigmento."
    },
    {
      topic: "Proporcionalidad Inversa / Velocidad",
      question: "Un automóvil viaja a una velocidad constante de 90 km/h y tarda 4 horas en recorrer cierta distancia. ¿Cuánto tiempo tardará en realizar el mismo trayecto si viaja a 60 km/h?",
      options: ["2.6 horas", "5.5 horas", "6 horas", "8 horas"],
      answer: 2,
      explanation: "Al disminuir la velocidad, el tiempo necesario aumenta (proporcionalidad inversa). El producto de las magnitudes se mantiene constante: 90 × 4 = 60 × x → 360 = 60x → x = 360 ÷ 60 = 6 horas."
    },
    {
      topic: "Proporcionalidad Inversa / Trabajadores",
      question: "Un equipo de 8 pintores tarda 6 días en pintar una nave industrial. Si se contratan 4 pintores adicionales con el mismo rendimiento (total 12 pintores), ¿en cuántos días terminarán el trabajo?",
      options: ["3 días", "4 días", "7 días", "9 días"],
      answer: 1,
      explanation: "A mayor número de trabajadores, menor tiempo (relación inversa). Multiplicamos horizontalmente: 8 × 6 = 12 × x → 48 = 12x → x = 48 ÷ 12 = 4 días."
    },
    {
      topic: "Fracciones y Números Mixtos",
      question: "Un repostero utiliza 1 ¾ kg de harina para elaborar 3.5 kg de pastel. ¿Cuántos kilogramos de harina necesitará para producir 10 kg de pastel?",
      options: ["4.5 kg", "5 kg", "5.25 kg", "6 kg"],
      answer: 1,
      explanation: "Convertimos el número mixto a decimal: 1 ¾ = 1.75 kg. Aplicando proporción directa: x = (10 × 1.75) ÷ 3.5 = 17.5 ÷ 3.5 = 5 kg."
    },
    {
      topic: "Consistencia de Unidades de Tiempo",
      question: "Una llave arroja agua a flujo constante y llena un depósito de 45 litros en 18 minutos. ¿Cuántos litros de agua verterá si permanece abierta durante 1 hora y media?",
      options: ["67.5 L", "180 L", "225 L", "375 L"],
      answer: 2,
      explanation: "Estandarizamos unidades: 1 hora y media = 90 minutos. Proporción directa: x = (90 × 45) ÷ 18. Como 90 ÷ 18 = 5, multiplicamos 5 × 45 = 225 litros."
    },
    {
      topic: "Rendimiento y Número Mixto",
      question: "Una camioneta gasta 3 ½ litros de combustible en un recorrido de 42 km. ¿Cuántos litros gastará al recorrer una distancia de 108 km bajo las mismas condiciones?",
      options: ["8 L", "8.5 L", "9 L", "10.5 L"],
      answer: 2,
      explanation: "Convertimos 3 ½ a decimal: 3.5 L. Proporción directa: x = (108 × 3.5) ÷ 42. Al simplificar 108/42 entre 6 queda 18/7, y (18 × 3.5) ÷ 7 = 63 ÷ 7 = 9 litros."
    },
    {
      topic: "Proporcionalidad Compuesta / Máquinas",
      question: "2 máquinas idénticas producen 800 envases en un turno de 4 horas. ¿Cuántos envases producirán 5 máquinas trabajando durante 6 horas al mismo ritmo?",
      options: ["2,400 envases", "2,750 envases", "3,000 envases", "3,600 envases"],
      answer: 2,
      explanation: "Por método Causa-Efecto: (Máquinas × Horas) ÷ Envases = Constante. (2 × 4) ÷ 800 = (5 × 6) ÷ x → 8/800 = 30/x → 1/100 = 30/x → x = 30 × 100 = 3,000 envases."
    },
    {
      topic: "Proporcionalidad Compuesta / Avance",
      question: "8 obreros construyen 160 metros de muro en 5 días. ¿Cuántos metros construirán 12 obreros trabajando durante 8 días con el mismo rendimiento?",
      options: ["320 m", "360 m", "384 m", "412 m"],
      answer: 2,
      explanation: "Relacionando obreros-días con la obra: (8 × 5) ÷ 160 = (12 × 8) ÷ x → 40/160 = 96/x → 1/4 = 96/x → x = 96 × 4 = 384 metros."
    },
    {
      topic: "Compuesta Inversa / Horas-Hombre",
      question: "6 carpinteros elaboran un lote de muebles en 10 días trabajando jornadas de 8 horas diarias. Si se cuenta con 10 carpinteros y trabajan jornadas de 6 horas diarias, ¿cuántos días tardarán?",
      options: ["6 días", "8 días", "10 días", "12 días"],
      answer: 1,
      explanation: "Al ser el mismo trabajo, el producto total de horas-hombre es constante: 6 × 10 × 8 = 10 × x × 6 → 480 = 60x → x = 480 ÷ 60 = 8 días."
    }
  ];

  let currentQuestionIndex = 0;
  let selectedOptionIndex = null;
  let score = 0;

  const prefixes = ["A", "B", "C", "D"];

  const questionCounter = document.getElementById("questionCounter");
  const scoreCounter = document.getElementById("scoreCounter");
  const progressBar = document.getElementById("progressBar");
  const topicBadge = document.getElementById("topicBadge");
  const questionText = document.getElementById("questionText");
  const optionsContainer = document.getElementById("optionsContainer");
  const feedbackPanel = document.getElementById("feedbackPanel");
  const feedbackTitle = document.getElementById("feedbackTitle");
  const feedbackText = document.getElementById("feedbackText");
  const checkBtn = document.getElementById("checkBtn");
  const nextBtn = document.getElementById("nextBtn");
  const quizBody = document.getElementById("quizBody");
  const progressHeader = document.getElementById("progressHeader");
  const resultScreen = document.getElementById("resultScreen");
  const finalScore = document.getElementById("finalScore");
  const finalMessage = document.getElementById("finalMessage");
  const restartBtn = document.getElementById("restartBtn");

  function loadQuestion() {
    selectedOptionIndex = null;
    checkBtn.disabled = true;
    checkBtn.style.display = "inline-block";
    nextBtn.style.display = "none";
    feedbackPanel.style.display = "none";
    feedbackPanel.className = "feedback-panel";

    const q = questions[currentQuestionIndex];

    questionCounter.textContent = `Pregunta ${currentQuestionIndex + 1} de ${questions.length}`;
    scoreCounter.textContent = `Aciertos: ${score}`;
    progressBar.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;

    topicBadge.textContent = q.topic;
    questionText.textContent = q.question;

    optionsContainer.innerHTML = "";
    q.options.forEach((optText, index) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerHTML = `<span class="option-prefix">${prefixes[index]}</span> <span>${optText}</span>`;
      btn.addEventListener("click", () => selectOption(index));
      optionsContainer.appendChild(btn);
    });
  }

  function selectOption(index) {
    selectedOptionIndex = index;
    const allOptions = optionsContainer.querySelectorAll(".option-btn");
    allOptions.forEach((btn, idx) => {
      if (idx === index) {
        btn.classList.add("selected");
      } else {
        btn.classList.remove("selected");
      }
    });
    checkBtn.disabled = false;
  }

  function checkAnswer() {
    const q = questions[currentQuestionIndex];
    const allOptions = optionsContainer.querySelectorAll(".option-btn");

    allOptions.forEach(btn => btn.disabled = true);
    checkBtn.style.display = "none";
    nextBtn.style.display = "inline-block";

    const isCorrect = (selectedOptionIndex === q.answer);

    if (isCorrect) {
      score++;
      scoreCounter.textContent = `Aciertos: ${score}`;
      allOptions[selectedOptionIndex].classList.remove("selected");
      allOptions[selectedOptionIndex].classList.add("correct");

      feedbackPanel.className = "feedback-panel success";
      feedbackTitle.innerHTML = "✓ ¡Excelente! Respuesta correcta";
      feedbackText.innerHTML = q.explanation;
    } else {
      allOptions[selectedOptionIndex].classList.remove("selected");
      allOptions[selectedOptionIndex].classList.add("incorrect");
      allOptions[q.answer].classList.add("correct");

      feedbackPanel.className = "feedback-panel error";
      feedbackTitle.innerHTML = "✕ Respuesta incorrecta";
      feedbackText.innerHTML = `<strong>Solución explicada:</strong> ${q.explanation}`;
    }

    feedbackPanel.style.display = "block";
  }

  function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < questions.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    quizBody.style.display = "none";
    progressHeader.style.display = "none";
    resultScreen.style.display = "block";

    finalScore.textContent = `${score} / ${questions.length}`;

    let msg = "";
    if (score === 10) {
      msg = "¡Puntaje perfecto! Demuestras un dominio total tanto de proporciones directas e inversas como de proporcionalidad compuesta y números mixtos.";
    } else if (score >= 7) {
      msg = "¡Muy buen desempeño! Cuentas con bases sólidas para tu examen, solo te recomendamos revisar con cuidado los problemas compuestos y conversiones de tiempo.";
    } else if (score >= 5) {
      msg = "Buen intento. Se recomienda repasar la diferencia entre relaciones directas e inversas y afianzar el método de Causa-Efecto.";
    } else {
      msg = "Es prioritario reforzar conceptos básicos de proporcionalidad, conversión de unidades y simplificación de fracciones.";
    }
    finalMessage.textContent = msg;
  }

  function restartQuiz() {
    currentQuestionIndex = 0;
    score = 0;
    resultScreen.style.display = "none";
    progressHeader.style.display = "block";
    quizBody.style.display = "flex";
    loadQuestion();
  }

  checkBtn.addEventListener("click", checkAnswer);
  nextBtn.addEventListener("click", nextQuestion);
  restartBtn.addEventListener("click", restartQuiz);

  loadQuestion();
</script>

</body>
</html>
