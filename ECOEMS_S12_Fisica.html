<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simulador de Física: Movimiento y Fuerzas</title>
  <style>
    @font-face {
      font-family: 'Mogena';
      src: url('https://fonts.cdnfonts.com/s/91216/MogenaRegular-8Mzx3.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #1e1b4b 40%, #0f766e 80%, #020617 100%);
      --card-bg: rgba(15, 23, 42, 0.90);
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;

      --neon-lime: #2dd4bf;
      --pastel-lime: rgba(45, 212, 191, 0.15);
      --neon-emerald: #818cf8;
      --pastel-emerald: rgba(129, 140, 248, 0.15);
      --neon-cyan: #38bdf8;
      --pastel-cyan: rgba(56, 189, 248, 0.15);
      --neon-green: #22c55e;
      --pastel-green: rgba(34, 197, 94, 0.2);
      --neon-red: #ef4444;
      --pastel-red: rgba(239, 68, 68, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Mogena', 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: clamp(6px, 1.5vw, 20px);
    }

    .quiz-container {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      width: 100%;
      max-width: 1250px;
      min-height: min(94vh, 900px);
      border-radius: clamp(16px, 2.5vw, 28px);
      border: clamp(2px, 0.3vw, 3px) solid var(--neon-lime);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(45, 212, 191, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      margin: auto;
      position: relative;
    }

    .progress-header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: clamp(12px, 2vw, 20px) clamp(16px, 3vw, 36px);
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: clamp(2px, 0.3vw, 3px) solid var(--neon-lime);
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .progress-info {
      display: flex;
      gap: clamp(10px, 2.5vw, 24px);
      flex-wrap: wrap;
      font-size: clamp(0.95rem, 1.2vw, 1.2rem);
      color: var(--neon-lime);
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(45, 212, 191, 0.4);
    }

    .shortcut-hint {
      font-size: 0.8rem;
      color: #99f6e4;
      font-weight: 600;
      display: none;
    }

    @media (min-width: 1024px) {
      .shortcut-hint {
        display: inline-block;
      }
    }

    .top-brand-logo img {
      height: clamp(34px, 5vw, 68px);
      width: auto;
      object-fit: contain;
      filter: contrast(1.15) drop-shadow(0 0 10px rgba(45, 212, 191, 0.5));
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .top-brand-logo img:hover {
      transform: scale(1.1) rotate(-2deg);
    }

    .progress-bar-bg {
      width: 100%;
      height: clamp(10px, 1.1vw, 15px);
      background-color: rgba(30, 41, 59, 0.8);
      border-radius: 30px;
      overflow: hidden;
      border: 1.5px solid rgba(45, 212, 191, 0.4);
    }

    .progress-bar-fill {
      height: 100%;
      width: 5%;
      background: linear-gradient(90deg, var(--neon-lime), var(--neon-emerald), var(--neon-cyan));
      border-radius: 30px;
      box-shadow: 0 0 15px var(--neon-lime);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .quiz-body {
      padding: clamp(16px, 2.5vw, 36px);
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 1150px;
      margin: 0 auto;
      width: 100%;
      overflow-y: auto;
    }

    .question-topic {
      align-self: flex-start;
      font-size: clamp(0.75rem, 0.9vw, 0.9rem);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 6px clamp(12px, 1.5vw, 18px);
      border-radius: 30px;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      font-weight: 900;
      margin-bottom: clamp(10px, 1.5vw, 18px);
      box-shadow: 0 0 15px rgba(45, 212, 191, 0.4);
    }

    .question-text {
      font-size: clamp(1.05rem, 1.5vw, 1.45rem);
      line-height: 1.45;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: clamp(16px, 2vw, 24px);
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: clamp(10px, 1.3vw, 16px);
      margin-bottom: clamp(16px, 2vw, 22px);
    }

    .option-btn {
      background: rgba(30, 41, 59, 0.6);
      border: clamp(2px, 0.25vw, 3px) solid rgba(45, 212, 191, 0.35);
      border-radius: clamp(14px, 1.5vw, 18px);
      padding: clamp(12px, 1.4vw, 16px) clamp(14px, 1.6vw, 18px);
      text-align: left;
      font-size: clamp(0.95rem, 1.15vw, 1.1rem);
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: var(--text-main);
      font-weight: 600;
      line-height: 1.35;
      overflow-wrap: break-word;
      word-break: break-word;
      min-height: 56px;
      position: relative;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--neon-lime);
      background-color: var(--pastel-lime);
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 8px 20px rgba(45, 212, 191, 0.3);
    }

    .option-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .option-btn.selected {
      border-color: var(--neon-lime);
      background-color: var(--pastel-lime);
      color: #99f6e4;
      box-shadow: 0 0 20px rgba(45, 212, 191, 0.5);
      transform: scale(1.01);
    }

    .option-prefix {
      font-weight: 900;
      margin-right: 12px;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      width: clamp(34px, 3.2vw, 40px);
      height: clamp(34px, 3.2vw, 40px);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: clamp(0.85rem, 1vw, 1rem);
      color: #0f172a;
      border: 2px solid var(--neon-lime);
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .option-btn.selected .option-prefix {
      background: var(--neon-lime);
      border-color: #ffffff;
      color: #0f172a;
      transform: rotate(360deg);
    }

    .option-btn.correct {
      background-color: var(--pastel-green) !important;
      border-color: var(--neon-green) !important;
      color: #86efac !important;
      box-shadow: 0 0 22px rgba(34, 197, 94, 0.5) !important;
      animation: popSuccess 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .option-btn.correct .option-prefix {
      background: var(--neon-green);
      border-color: var(--neon-green);
      color: #0f172a;
    }

    .option-btn.incorrect {
      background-color: var(--pastel-red) !important;
      border-color: var(--neon-red) !important;
      color: #fca5a5 !important;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.5) !important;
      animation: shakeError 0.35s ease-in-out;
    }
    .option-btn.incorrect .option-prefix {
      background: var(--neon-red);
      border-color: var(--neon-red);
      color: #ffffff;
    }

    .feedback-panel {
      padding: clamp(14px, 1.8vw, 20px);
      border-radius: clamp(14px, 1.5vw, 18px);
      margin-bottom: clamp(14px, 1.8vw, 20px);
      display: none;
      animation: slideUp 0.3s ease;
      line-height: 1.5;
      font-size: clamp(0.9rem, 1.05vw, 1rem);
    }

    .feedback-panel.success {
      background-color: rgba(34, 197, 94, 0.15);
      border: clamp(2px, 0.25vw, 3px) solid var(--neon-green);
      color: #dcfce7;
    }

    .feedback-panel.error {
      background-color: rgba(239, 68, 68, 0.15);
      border: clamp(2px, 0.25vw, 3px) solid var(--neon-red);
      color: #ffe4e6;
    }

    .feedback-title {
      font-weight: 900;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(1rem, 1.15vw, 1.15rem);
    }

    .quiz-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 4px;
    }

    .action-btn {
      padding: clamp(12px, 1.4vw, 16px) clamp(24px, 2.8vw, 34px);
      font-size: clamp(0.95rem, 1.15vw, 1.1rem);
      font-weight: 800;
      border: none;
      border-radius: clamp(12px, 1.2vw, 16px);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      letter-spacing: 0.5px;
      width: auto;
      min-height: 48px;
    }

    .btn-check {
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      box-shadow: 0 6px 20px rgba(45, 212, 191, 0.4);
    }
    .btn-check:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.15);
    }
    .btn-check:disabled {
      background: #1e293b;
      color: #475569;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-next {
      background: linear-gradient(135deg, var(--neon-emerald), var(--neon-cyan));
      color: #0f172a;
      display: none;
      box-shadow: 0 6px 20px rgba(129, 140, 248, 0.4);
    }
    .btn-next:hover {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.15);
    }

    .result-screen {
      display: none;
      text-align: center;
      padding: clamp(24px, 4vw, 50px) clamp(14px, 3vw, 24px);
      margin: auto;
      max-width: 800px;
      animation: slideUp 0.4s ease;
    }

    .result-title {
      font-size: clamp(1.8rem, 3.2vw, 2.5rem);
      color: var(--neon-lime);
      font-weight: 900;
      text-shadow: 0 0 15px rgba(45, 212, 191, 0.5);
    }

    .result-score {
      font-size: clamp(3.5rem, 7vw, 5rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald), var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: clamp(10px, 1.8vw, 18px) 0;
      filter: drop-shadow(0 0 15px rgba(45, 212, 191, 0.6));
    }

    .result-message {
      font-size: clamp(1rem, 1.3vw, 1.2rem);
      color: var(--text-main);
      margin-bottom: clamp(20px, 2.8vw, 32px);
      line-height: 1.5;
      font-weight: 600;
    }

    .btn-restart {
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      padding: clamp(14px, 1.6vw, 18px) clamp(30px, 3.5vw, 44px);
      font-size: clamp(1rem, 1.2vw, 1.15rem);
      box-shadow: 0 8px 25px rgba(45, 212, 191, 0.5);
    }
    .btn-restart:hover {
      transform: scale(1.06);
      filter: brightness(1.15);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popSuccess {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1.01); }
    }

    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    @media (max-width: 580px) {
      .quiz-footer {
        flex-direction: column;
      }
      .action-btn {
        width: 100%;
        text-align: center;
      }
      .options-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <div class="progress-header" id="progressHeader">
    <div class="header-top">
      <div class="progress-info">
        <span id="questionCounter">Pregunta 1 de 20</span>
        <span id="scoreCounter">Aciertos: 0</span>
        <span class="shortcut-hint">💡 Usa las teclas [A, B, C, D] y [Enter]</span>
      </div>
      <div class="top-brand-logo">
        <img src="Logo_MB.png" alt="Logo ECOEMS">
      </div>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </div>

  <div class="quiz-body" id="quizBody">
    <span class="question-topic" id="topicBadge">Física: Movimiento y Fuerzas</span>
    <h2 class="question-text" id="questionText">Cargando reactivo...</h2>

    <div class="options-grid" id="optionsContainer"></div>

    <div class="feedback-panel" id="feedbackPanel">
      <div class="feedback-title" id="feedbackTitle"></div>
      <div id="feedbackText"></div>
    </div>

    <div class="quiz-footer">
      <button class="action-btn btn-check" id="checkBtn" disabled>Comprobar respuesta</button>
      <button class="action-btn btn-next" id="nextBtn">Siguiente pregunta ➔</button>
    </div>
  </div>

  <div class="result-screen" id="resultScreen">
    <h2 class="result-title" id="resultTitle">¡Evaluación Finalizada!</h2>
    <div class="result-score" id="finalScore">0 / 20</div>
    <p class="result-message" id="finalMessage">Mensaje de desempeño</p>
    <button class="action-btn btn-restart" id="restartBtn">↻ Nuevo orden aleatorio</button>
  </div>
</div>

<script>
  var rawQuestions = [
    {
      topic: "1.5 Movimiento con velocidad variable (Aceleración)",
      question: "¿Cuál de las siguientes afirmaciones describe correctamente un movimiento con aceleración diferente de cero?",
      options: [
        "Un automóvil que avanza en línea recta a 60 km/h sin cambiar su rapidez.",
        "Una caja que permanece inmóvil sobre el piso de una bodega.",
        "Un ciclista que aumenta su rapidez de 3 m/s a 9 m/s en un tramo recto.",
        "Un tren que recorre exactamente 25 m cada segundo en una vía recta."
      ],
      answer: 2,
      explanation: "La aceleración existe únicamente cuando ocurre un cambio en la velocidad (en magnitud o dirección). En los incisos A, B y D la velocidad permanece constante o nula, mientras que en C la rapidez aumenta."
    },
    {
      topic: "1.5 Movimiento con velocidad variable (Aceleración)",
      question: "Un tren magnético parte del reposo y alcanza una velocidad de 30 m/s en un tiempo de 6 s. ¿Cuál es la magnitud de su aceleración?",
      options: [
        "180 m/s²",
        "5 m/s²",
        "0.2 m/s²",
        "24 m/s²"
      ],
      answer: 1,
      explanation: "Aplicando la fórmula a = (vf - vi) / t con vi = 0 m/s, vf = 30 m/s y t = 6 s, se obtiene: a = (30 - 0) / 6 = 5 m/s²."
    },
    {
      topic: "1.5 Movimiento con velocidad variable (Aceleración)",
      question: "Una lancha se desplaza a 18 m/s y disminuye su velocidad uniformemente hasta 6 m/s en 4 s. ¿Cuál es el valor de su aceleración?",
      options: [
        "-3 m/s²",
        "+3 m/s²",
        "-6 m/s²",
        "+6 m/s²"
      ],
      answer: 0,
      explanation: "Sustituyendo en a = (vf - vi) / t = (6 m/s - 18 m/s) / 4 s = -12 m/s / 4 s = -3 m/s². El signo negativo indica desaceleración."
    },
    {
      topic: "1.5 Movimiento con velocidad variable (Aceleración)",
      question: "Si un corredor mantiene una aceleración constante de 1.5 m/s² durante 4 s partiendo de una velocidad inicial de 2 m/s, ¿qué velocidad final alcanza?",
      options: [
        "6 m/s",
        "7.5 m/s",
        "8 m/s",
        "9.5 m/s"
      ],
      answer: 2,
      explanation: "Despejando la velocidad final: vf = vi + a·t = 2 m/s + (1.5 m/s²)(4 s) = 2 + 6 = 8 m/s."
    },
    {
      topic: "1.5 Movimiento con velocidad variable (Aceleración)",
      question: "¿Qué significa físicamente que un vehículo tenga una aceleración de 2.5 m/s²?",
      options: [
        "Que recorre 2.5 m cada segundo.",
        "Que su velocidad aumenta 2.5 m/s por cada segundo que transcurre.",
        "Que tarda 2.5 s en recorrer un metro.",
        "Que su velocidad máxima es de 2.5 m/s."
      ],
      answer: 1,
      explanation: "La unidad m/s² equivale a (m/s)/s, lo que indica cuánto cambia la velocidad en cada unidad de tiempo."
    },
    {
      topic: "1.6 Movimiento de los cuerpos que caen (Caída libre)",
      question: "En un tubo de vidrio al que se le ha extraído todo el aire, se dejan caer al mismo tiempo una moneda de cobre y un trozo de papel desde la parte superior. ¿Qué ocurre durante la caída?",
      options: [
        "La moneda llega primero porque tiene mayor peso.",
        "El papel flota y no desciende porque no hay aire que lo empuje.",
        "Ambos llegan al fondo al mismo tiempo porque experimentan la misma aceleración gravitacional.",
        "La moneda acelera más rápido que el papel debido a su densidad."
      ],
      answer: 2,
      explanation: "En ausencia de resistencia del aire, la aceleración de la gravedad (g ≈ 9.8 m/s²) actúa por igual sobre todos los cuerpos sin depender de su masa o material."
    },
    {
      topic: "1.6 Movimiento de los cuerpos que caen (Caída libre)",
      question: "Si se deja caer una piedra desde lo alto de un puente y tarda 3 s en tocar el agua, ¿con qué velocidad llega a la superficie del agua? (Considera g = 9.8 m/s² y desprecia la fricción del aire).",
      options: [
        "9.8 m/s",
        "19.6 m/s",
        "29.4 m/s",
        "44.1 m/s"
      ],
      answer: 2,
      explanation: "Para un objeto que parte del reposo en caída libre, vf = g·t = (9.8 m/s²)(3 s) = 29.4 m/s."
    },
    {
      topic: "1.6 Movimiento de los cuerpos que caen (Caída libre)",
      question: "¿Por qué al dejar caer una hoja de papel extendida y una piedra al aire libre la piedra llega primero al suelo?",
      options: [
        "Porque la aceleración de la gravedad es mayor sobre los objetos pesados.",
        "Porque la resistencia del aire frena más al papel debido a su gran superficie y poca masa.",
        "Porque la piedra tiene mayor inercia y atrae más fuerte a la Tierra.",
        "Porque el aire empuja hacia abajo únicamente a los cuerpos sólidos compactos."
      ],
      answer: 1,
      explanation: "La gravedad produce la misma aceleración en ambos, pero en presencia de atmósfera la fricción del aire ejerce una fuerza ascendente significativa sobre la hoja extendida."
    },
    {
      topic: "1.6 Movimiento de los cuerpos que caen (Caída libre)",
      question: "Un objeto se suelta desde el reposo en caída libre. Si tomamos g = 10 m/s², ¿qué distancia vertical habrá descendido después de 2 s?",
      options: [
        "10 m",
        "20 m",
        "30 m",
        "40 m"
      ],
      answer: 1,
      explanation: "Empleando la ecuación de distancia en caída libre desde el reposo: h = (g·t²) / 2 = [(10 m/s²)(2 s)²] / 2 = 40 / 2 = 20 m."
    },
    {
      topic: "1.6 Movimiento de los cuerpos que caen (Caída libre)",
      question: "Durante la caída libre de un cuerpo cerca de la superficie terrestre, ¿cómo se comportan su velocidad y su aceleración a medida que desciende?",
      options: [
        "Su velocidad aumenta y su aceleración permanece constante.",
        "Tanto su velocidad como su aceleración aumentan continuamente.",
        "Su velocidad permanece constante y su aceleración aumenta.",
        "Tanto su velocidad como su aceleración disminuyen al acercarse al suelo."
      ],
      answer: 0,
      explanation: "La caída libre es un movimiento uniformemente acelerado: la aceleración tiene un valor constante (g ≈ 9.8 m/s²), lo cual provoca que la velocidad aumente de manera uniforme."
    },
    {
      topic: "2.1 Fuerza resultante",
      question: "Dos personas empujan un mueble hacia la derecha con fuerzas de 35 N y 25 N, mientras otra persona lo empuja hacia la izquierda con una fuerza de 45 N. ¿Cuál es la fuerza resultante sobre el mueble?",
      options: [
        "105 N hacia la derecha.",
        "15 N hacia la derecha.",
        "15 N hacia la izquierda.",
        "55 N hacia la izquierda."
      ],
      answer: 1,
      explanation: "Asignando signo positivo a la derecha y negativo a la izquierda: FR = +35 N + 25 N - 45 N = +15 N, es decir, 15 N hacia la derecha."
    },
    {
      topic: "2.1 Fuerza resultante",
      question: "Sobre un carrito actúan tres fuerzas horizontales: 18 N hacia la derecha, 24 N hacia la izquierda y 12 N hacia la izquierda. ¿Cuál es la magnitud y el sentido de la fuerza neta?",
      options: [
        "18 N hacia la izquierda.",
        "18 N hacia la derecha.",

      options: [

      options: [
        "150 kg",
        "24 kg",
        "57.5 kg",
        "62.5 kg"
      ],
      answer: 1,
      explanation: "Despejando la masa de FR = m·a: m = FR / a = 60 N / 2.5 m/s² = 24 kg."
    },
    {

      question: "Si se jala rápidamente un mantel que está debajo de un plato colocado sobre una mesa lisa, el plato permanece casi en su mismo lugar. ¿A qué propiedad física y ley de Newton se debe este fenómeno?",
      options: [

    {

      question: "Si se duplica la fuerza resultante que actúa sobre un carrito manteniendo su masa constante, ¿qué sucede con su aceleración?",
      options: [
        "Se reduce a la mitad.",
        "Permanece igual.",
        "Se duplica.",
        "Se cuadruplica."
      ],
      answer: 2,
      explanation: "Según la Segunda Ley de Newton (a = FR / m), la aceleración es directamente proporcional a la fuerza resultante; si la fuerza se multiplica por dos y la masa no cambia, la aceleración también se multiplica por dos."

  var questions = [];
  var currentQuestionIndex = 0;
  var selectedOptionIndex = null;
  var score = 0;

  var prefixes = ["A", "B", "C", "D"];

  var questionCounter = document.getElementById("questionCounter");
  var scoreCounter = document.getElementById("scoreCounter");
  var progressBar = document.getElementById("progressBar");
  var topicBadge = document.getElementById("topicBadge");
  var questionText = document.getElementById("questionText");
  var optionsContainer = document.getElementById("optionsContainer");
  var feedbackPanel = document.getElementById("feedbackPanel");
  var feedbackTitle = document.getElementById("feedbackTitle");
  var feedbackText = document.getElementById("feedbackText");
  var checkBtn = document.getElementById("checkBtn");
  var nextBtn = document.getElementById("nextBtn");
  var quizBody = document.getElementById("quizBody");
  var progressHeader = document.getElementById("progressHeader");
  var resultScreen = document.getElementById("resultScreen");
  var finalScore = document.getElementById("finalScore");
  var finalMessage = document.getElementById("finalMessage");
  var resultTitle = document.getElementById("resultTitle");
  var restartBtn = document.getElementById("restartBtn");

  function shuffleArray(array) {
    var shuffled = array.slice();
    for (var i = shuffled.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = shuffled[i];
      shuffled[i] = shuffled[j];
      shuffled[j] = temp;
    }
    return shuffled;
  }

  function initQuiz() {
    questions = shuffleArray(rawQuestions);
    currentQuestionIndex = 0;
    score = 0;
    resultScreen.style.display = "none";
    progressHeader.style.display = "flex";
    quizBody.style.display = "flex";
    loadQuestion();
  }

  function loadQuestion() {
    selectedOptionIndex = null;
    checkBtn.disabled = true;
    checkBtn.style.display = "inline-block";
    nextBtn.style.display = "none";
    feedbackPanel.style.display = "none";
    feedbackPanel.className = "feedback-panel";

    var q = questions[currentQuestionIndex];

    questionCounter.textContent = "Pregunta " + (currentQuestionIndex + 1) + " de " + questions.length;
    scoreCounter.textContent = "Aciertos: " + score;
    progressBar.style.width = (((currentQuestionIndex + 1) / questions.length) * 100) + "%";

    topicBadge.textContent = q.topic;
    questionText.innerHTML = (currentQuestionIndex + 1) + ". " + q.question;

    optionsContainer.innerHTML = "";
    q.options.forEach(function(optText, index) {
      var btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerHTML = '<span class="option-prefix">' + prefixes[index] + '</span> <span>' + optText + '</span>';
      btn.addEventListener("click", function() { selectOption(index); });
      optionsContainer.appendChild(btn);
    });
  }

  function selectOption(index) {
    if (checkBtn.style.display === "none") return;
    selectedOptionIndex = index;
    var allOptions = optionsContainer.querySelectorAll(".option-btn");
    allOptions.forEach(function(btn, idx) {
      if (idx === index) {
        btn.classList.add("selected");
      } else {
        btn.classList.remove("selected");
      }
    });
    checkBtn.disabled = false;
  }

  function checkAnswer() {
    if (selectedOptionIndex === null) return;
    var q = questions[currentQuestionIndex];
    var allOptions = optionsContainer.querySelectorAll(".option-btn");

    allOptions.forEach(function(btn) { btn.disabled = true; });
    checkBtn.style.display = "none";
    nextBtn.style.display = "inline-block";

    var isCorrect = (selectedOptionIndex === q.answer);

    if (isCorrect) {
      score++;
      scoreCounter.textContent = "Aciertos: " + score;
      allOptions[selectedOptionIndex].classList.remove("selected");
      allOptions[selectedOptionIndex].classList.add("correct");

      feedbackPanel.className = "feedback-panel success";
      feedbackTitle.innerHTML = "⚡ ¡Excelente! Respuesta correcta";
      feedbackText.innerHTML = q.explanation;
    } else {
      allOptions[selectedOptionIndex].classList.remove("selected");
      allOptions[selectedOptionIndex].classList.add("incorrect");
      allOptions[q.answer].classList.add("correct");

      feedbackPanel.className = "feedback-panel error";
      feedbackTitle.innerHTML = "💡 Justificación física:";
      feedbackText.innerHTML = "<strong>Fundamento:</strong> " + q.explanation;
    }

    feedbackPanel.style.display = "block";
    nextBtn.focus();
  }

  function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < questions.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    quizBody.style.display = "none";
    progressHeader.style.display = "none";
    resultScreen.style.display = "block";

    finalScore.textContent = score + " / " + questions.length;

    var msg = "";
    if (score === 20) {
      resultTitle.textContent = "🚀 ¡Dominio Absoluto en Movimiento y Fuerzas!";
      msg = "¡Súper bien! Resolviste correctamente los 20 reactivos. Dominas aceleración, caída libre, fuerza resultante y las tres leyes de Newton.";
    } else if (score >= 16) {
      resultTitle.textContent = "🌟 ¡Excelente Desempeño!";
      msg = "Tienes un nivel de preparación en física muy sólido. Repasa los despejes de caída libre y suma de fuerzas vectoriales para alcanzar la perfección.";
    } else if (score >= 11) {
      resultTitle.textContent = "👍 ¡Buen Esfuerzo!";
      msg = "Vas por buen camino. Te sugerimos practicar más los signos de aceleración y desaceleración, así como la identificación de cada ley de Newton.";
    } else {
      resultTitle.textContent = "💪 ¡A Seguir Practicando!";
      msg = "¡No te desanimes! Repasa las fórmulas de aceleración, caída libre y Segunda Ley de Newton (F = m·a), y vuelve a intentarlo con otro orden aleatorio.";
    }
    finalMessage.textContent = msg;
  }

  checkBtn.addEventListener("click", checkAnswer);
  nextBtn.addEventListener("click", nextQuestion);
  restartBtn.addEventListener("click", initQuiz);

  document.addEventListener("keydown", function(e) {
    if (resultScreen.style.display === "block") {
      if (e.key === "Enter") initQuiz();
      return;
    }

    var key = e.key.toUpperCase();
    if (["A", "1"].indexOf(key) !== -1) selectOption(0);
    else if (["B", "2"].indexOf(key) !== -1) selectOption(1);
    else if (["C", "3"].indexOf(key) !== -1) selectOption(2);
    else if (["D", "4"].indexOf(key) !== -1) selectOption(3);
    else if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (checkBtn.style.display !== "none" && !checkBtn.disabled) {
        checkAnswer();
      } else if (nextBtn.style.display !== "none") {
        nextQuestion();
      }
    }
  });

  window.addEventListener("DOMContentLoaded", initQuiz);
</script>
