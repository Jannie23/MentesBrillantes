<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simulador de Matemáticas 2: Estadística y Gráficas</title>
  <style>
    @font-face {
      font-family: 'Mogena';
      src: url('https://fonts.cdnfonts.com/s/91216/MogenaRegular-8Mzx3.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1d4ed8 35%, #1e1b4b 70%, #020617 100%);
      --card-bg: rgba(15, 23, 42, 0.90);
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;

      --neon-lime: #f59e0b;
      --pastel-lime: rgba(245, 158, 11, 0.15);
      --neon-emerald: #60a5fa;
      --pastel-emerald: rgba(96, 165, 250, 0.15);
      --neon-cyan: #38bdf8;
      --pastel-cyan: rgba(56, 189, 248, 0.15);
      --neon-green: #22c55e;
      --pastel-green: rgba(34, 197, 94, 0.2);
      --neon-red: #ef4444;
      --pastel-red: rgba(239, 68, 68, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Mogena', 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: clamp(6px, 1.5vw, 20px);
    }

    .quiz-container {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      width: 100%;
      max-width: 1250px;
      min-height: min(94vh, 900px);
      border-radius: clamp(16px, 2.5vw, 28px);
      border: clamp(2px, 0.3vw, 3px) solid var(--neon-lime);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(245, 158, 11, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      margin: auto;
      position: relative;
    }

    .progress-header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: clamp(12px, 2vw, 20px) clamp(16px, 3vw, 36px);
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: clamp(2px, 0.3vw, 3px) solid var(--neon-lime);
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .progress-info {
      display: flex;
      gap: clamp(10px, 2.5vw, 24px);
      flex-wrap: wrap;
      font-size: clamp(0.95rem, 1.2vw, 1.2rem);
      color: var(--neon-lime);
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
    }

    .shortcut-hint {
      font-size: 0.8rem;
      color: #fde68a;
      font-weight: 600;
      display: none;
    }

    @media (min-width: 1024px) {
      .shortcut-hint {
        display: inline-block;
      }
    }

    .top-brand-logo img {
      height: clamp(34px, 5vw, 68px);
      width: auto;
      object-fit: contain;
      filter: contrast(1.15) drop-shadow(0 0 10px rgba(245, 158, 11, 0.5));
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .top-brand-logo img:hover {
      transform: scale(1.1) rotate(-2deg);
    }

    .progress-bar-bg {
      width: 100%;
      height: clamp(10px, 1.1vw, 15px);
      background-color: rgba(30, 41, 59, 0.8);
      border-radius: 30px;
      overflow: hidden;
      border: 1.5px solid rgba(245, 158, 11, 0.4);
    }

    .progress-bar-fill {
      height: 100%;
      width: 5%;
      background: linear-gradient(90deg, var(--neon-lime), var(--neon-emerald), var(--neon-cyan));
      border-radius: 30px;
      box-shadow: 0 0 15px var(--neon-lime);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .quiz-body {
      padding: clamp(16px, 2.5vw, 36px);
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 1150px;
      margin: 0 auto;
      width: 100%;
      overflow-y: auto;
    }

    .question-topic {
      align-self: flex-start;
      font-size: clamp(0.75rem, 0.9vw, 0.9rem);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 6px clamp(12px, 1.5vw, 18px);
      border-radius: 30px;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      font-weight: 900;
      margin-bottom: clamp(10px, 1.5vw, 18px);
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
    }

    .question-text {
      font-size: clamp(1.05rem, 1.5vw, 1.45rem);
      line-height: 1.45;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: clamp(16px, 2vw, 24px);
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: clamp(10px, 1.3vw, 16px);
      margin-bottom: clamp(16px, 2vw, 22px);
    }

    .option-btn {
      background: rgba(30, 41, 59, 0.6);
      border: clamp(2px, 0.25vw, 3px) solid rgba(245, 158, 11, 0.35);
      border-radius: clamp(14px, 1.5vw, 18px);
      padding: clamp(12px, 1.4vw, 16px) clamp(14px, 1.6vw, 18px);
      text-align: left;
      font-size: clamp(0.95rem, 1.15vw, 1.1rem);
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: var(--text-main);
      font-weight: 600;
      line-height: 1.35;
      overflow-wrap: break-word;
      word-break: break-word;
      min-height: 56px;
      position: relative;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--neon-lime);
      background-color: var(--pastel-lime);
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3);
    }

    .option-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .option-btn.selected {
      border-color: var(--neon-lime);
      background-color: var(--pastel-lime);
      color: #fde68a;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.5);
      transform: scale(1.01);
    }

    .option-prefix {
      font-weight: 900;
      margin-right: 12px;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      width: clamp(34px, 3.2vw, 40px);
      height: clamp(34px, 3.2vw, 40px);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: clamp(0.85rem, 1vw, 1rem);
      color: #0f172a;
      border: 2px solid var(--neon-lime);
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .option-btn.selected .option-prefix {
      background: var(--neon-lime);
      border-color: #ffffff;
      color: #0f172a;
      transform: rotate(360deg);
    }

    .option-btn.correct {
      background-color: var(--pastel-green) !important;
      border-color: var(--neon-green) !important;
      color: #86efac !important;
      box-shadow: 0 0 22px rgba(34, 197, 94, 0.5) !important;
      animation: popSuccess 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .option-btn.correct .option-prefix {
      background: var(--neon-green);
      border-color: var(--neon-green);
      color: #0f172a;
    }

    .option-btn.incorrect {
      background-color: var(--pastel-red) !important;
      border-color: var(--neon-red) !important;
      color: #fca5a5 !important;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.5) !important;
      animation: shakeError 0.35s ease-in-out;
    }
    .option-btn.incorrect .option-prefix {
      background: var(--neon-red);
      border-color: var(--neon-red);
      color: #ffffff;
    }

    .feedback-panel {
      padding: clamp(14px, 1.8vw, 20px);
      border-radius: clamp(14px, 1.5vw, 18px);
      margin-bottom: clamp(14px, 1.8vw, 20px);
      display: none;
      animation: slideUp 0.3s ease;
      line-height: 1.5;
      font-size: clamp(0.9rem, 1.05vw, 1rem);
    }

    .feedback-panel.success {
      background-color: rgba(34, 197, 94, 0.15);
      border: clamp(2px, 0.25vw, 3px) solid var(--neon-green);
      color: #dcfce7;
    }

    .feedback-panel.error {
      background-color: rgba(239, 68, 68, 0.15);
      border: clamp(2px, 0.25vw, 3px) solid var(--neon-red);
      color: #ffe4e6;
    }

    .feedback-title {
      font-weight: 900;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(1rem, 1.15vw, 1.15rem);
    }

    .quiz-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 4px;
    }

    .action-btn {
      padding: clamp(12px, 1.4vw, 16px) clamp(24px, 2.8vw, 34px);
      font-size: clamp(0.95rem, 1.15vw, 1.1rem);
      font-weight: 800;
      border: none;
      border-radius: clamp(12px, 1.2vw, 16px);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      letter-spacing: 0.5px;
      width: auto;
      min-height: 48px;
    }

    .btn-check {
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
    }
    .btn-check:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.15);
    }
    .btn-check:disabled {
      background: #1e293b;
      color: #475569;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-next {
      background: linear-gradient(135deg, var(--neon-emerald), var(--neon-cyan));
      color: #0f172a;
      display: none;
      box-shadow: 0 6px 20px rgba(96, 165, 250, 0.4);
    }
    .btn-next:hover {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.15);
    }

    .result-screen {
      display: none;
      text-align: center;
      padding: clamp(24px, 4vw, 50px) clamp(14px, 3vw, 24px);
      margin: auto;
      max-width: 800px;
      animation: slideUp 0.4s ease;
    }

    .result-title {
      font-size: clamp(1.8rem, 3.2vw, 2.5rem);
      color: var(--neon-lime);
      font-weight: 900;
      text-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
    }

    .result-score {
      font-size: clamp(3.5rem, 7vw, 5rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald), var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: clamp(10px, 1.8vw, 18px) 0;
      filter: drop-shadow(0 0 15px rgba(245, 158, 11, 0.6));
    }

    .result-message {
      font-size: clamp(1rem, 1.3vw, 1.2rem);
      color: var(--text-main);
      margin-bottom: clamp(20px, 2.8vw, 32px);
      line-height: 1.5;
      font-weight: 600;
    }

    .btn-restart {
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      padding: clamp(14px, 1.6vw, 18px) clamp(30px, 3.5vw, 44px);
      font-size: clamp(1rem, 1.2vw, 1.15rem);
      box-shadow: 0 8px 25px rgba(245, 158, 11, 0.5);
    }
    .btn-restart:hover {
      transform: scale(1.06);
      filter: brightness(1.15);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popSuccess {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1.01); }
    }

    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    @media (max-width: 580px) {
      .quiz-footer {
        flex-direction: column;
      }
      .action-btn {
        width: 100%;
        text-align: center;
      }
      .options-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <div class="progress-header" id="progressHeader">
    <div class="header-top">
      <div class="progress-info">
        <span id="questionCounter">Pregunta 1 de 20</span>
        <span id="scoreCounter">Aciertos: 0</span>
        <span class="shortcut-hint">💡 Usa las teclas [A, B, C, D] y [Enter]</span>
      </div>
      <div class="top-brand-logo">
        <img src="Logo_MB.png" alt="Logo ECOEMS">
      </div>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </div>

  <div class="quiz-body" id="quizBody">
    <span class="question-topic" id="topicBadge">Matemáticas 2: Estadística y Gráficas</span>
    <h2 class="question-text" id="questionText">Cargando reactivo...</h2>

    <div class="options-grid" id="optionsContainer"></div>

    <div class="feedback-panel" id="feedbackPanel">
      <div class="feedback-title" id="feedbackTitle"></div>
      <div id="feedbackText"></div>
    </div>

    <div class="quiz-footer">
      <button class="action-btn btn-check" id="checkBtn" disabled>Comprobar respuesta</button>
      <button class="action-btn btn-next" id="nextBtn">Siguiente pregunta ➔</button>
    </div>
  </div>

  <div class="result-screen" id="resultScreen">
    <h2 class="result-title" id="resultTitle">¡Evaluación Finalizada!</h2>
    <div class="result-score" id="finalScore">0 / 20</div>
    <p class="result-message" id="finalMessage">Mensaje de desempeño</p>
    <button class="action-btn btn-restart" id="restartBtn">↻ Reiniciar simulador</button>
  </div>
</div>

<script>
  var rawQuestions = [
    {
      topic: "Frecuencia Relativa",
      question: "1. En una muestra de 120 personas, 36 eligieron la opción 'A favor'. ¿Cuál es la frecuencia relativa de esta categoría?",
      options: [
        "0.36",
        "0.30",
        "0.25",
        "0.40"
      ],
      answer: 1,
      explanation: "La frecuencia relativa se calcula dividiendo la frecuencia absoluta entre el total de datos: fr = f / n = 36 / 120 = 0.30."
    },
    {
      topic: "Porcentaje de Incremento",
      question: "2. El precio de un artículo era de $160 en enero y aumentó a $184 en junio. ¿Cuál fue el porcentaje de incremento del precio?",
      options: [
        "15%",
        "12%",
        "18%",
        "24%"
      ],
      answer: 0,
      explanation: "Incremento % = [(184 - 160) / 160] × 100% = (24 / 160) × 100% = 0.15 × 100% = 15%."
    },
    {
      topic: "Números Índice (Base Fija)",
      question: "3. El número de clientes atendidos en un taller durante cuatro meses fue: Mes 1 (150), Mes 2 (180), Mes 3 (225) y Mes 4 (270). Tomando el Mes 1 como base 100, ¿cuál es el índice del Mes 3?",
      options: [
        "125",
        "135",
        "150",
        "160"
      ],
      answer: 2,
      explanation: "Con el Mes 1 (150) como base 100: Índice₃ = (225 / 150) × 100 = 1.50 × 100 = 150."
    },
    {
      topic: "Frecuencia Acumulada y Porcentajes",
      question: "4. Una tabla de frecuencia registra la distribución de libros leídos en un grupo de 50 alumnos: 1 libro (15 alumnos), 2 libros (20 alumnos), 3 libros (10 alumnos), 4 libros (5 alumnos). ¿Qué porcentaje del grupo leyó al menos 3 libros?",
      options: [
        "30%",
        "20%",
        "40%",
        "15%"
      ],
      answer: 0,
      explanation: "Los alumnos que leyeron al menos 3 libros son los de 3 y 4 libros: 10 + 5 = 15 alumnos. El porcentaje es (15 / 50) × 100% = 0.30 × 100% = 30%."
    },
    {
      topic: "Variación Porcentual de Índices",
      question: "5. El valor de un índice de insumos aumentó de 160 a 192 puntos. ¿Cuál fue la variación porcentual del índice?",
      options: [
        "18%",
        "20%",
        "32%",
        "16%"
      ],
      answer: 1,
      explanation: "Variación % = [(192 - 160) / 160] × 100% = (32 / 160) × 100% = 0.20 × 100% = 20%."
    },
    {
      topic: "Cálculo de Índice con Base Enero",
      question: "6. La producción mensual de una fábrica fue: Enero (400), Febrero (440), Marzo (520), Abril (600). Si Enero corresponde al índice base 100, ¿cuál es el índice para el mes de Abril?",
      options: [
        "140",
        "150",
        "160",
        "130"
      ],
      answer: 1,
      explanation: "Tomando Enero (400) como base: Índice_Abril = (600 / 400) × 100 = 1.50 × 100 = 150."
    },
    {
      topic: "Frecuencia Relativa Proporcional",
      question: "7. En una encuesta a 250 personas, la frecuencia absoluta de la categoría 'Transporte Público' es 125. ¿Cuál es el valor de su frecuencia relativa?",
      options: [
        "0.25",
        "0.50",
        "0.40",
        "0.60"
      ],
      answer: 1,
      explanation: "fr = 125 / 250 = 0.50."
    },
    {
      topic: "Media Aritmética Simple",
      question: "8. Las alturas en cm de siete estudiantes son: 155, 160, 158, 162, 165, 158, 164. ¿Cuál es la media aritmética de las alturas?",
      options: [
        "160.3 cm",
        "161.0 cm",
        "159.5 cm",
        "162.0 cm"
      ],
      answer: 1,
      explanation: "Sumando los 7 datos: 155 + 160 + 158 + 162 + 165 + 158 + 164 = 1127. Dividiendo entre 7: x̄ = 1127 / 7 = 161.0 cm."
    },
    {
      topic: "Mediana en Datos Pares",
      question: "9. Los registros de tiempo en segundos de ocho corredores son: 12, 15, 11, 14, 13, 16, 12, 18. ¿Cuál es la mediana del conjunto de datos?",
      options: [
        "13.0 s",
        "13.5 s",
        "14.0 s",
        "12.5 s"
      ],
      answer: 1,
      explanation: "Datos ordenados (n = 8): 11, 12, 12, 13, 14, 15, 16, 18. La mediana es el promedio de los dos datos centrales: Me = (13 + 14) / 2 = 13.5 s."
    },
    {
      topic: "Moda Estadística",
      question: "10. Se registran las ventas diarias de pares de zapatos en una tienda durante una semana: 10, 12, 15, 12, 14, 12, 16. ¿Cuál es la moda de este conjunto de datos?",
      options: [
        "14",
        "15",
        "12",
        "13"
      ],
      answer: 2,
      explanation: "El valor 12 es el que tiene mayor frecuencia absoluta (se repite 3 veces)."
    },
    {
      topic: "Resistencia de la Mediana a Valores Atípicos",
      question: "11. En una pequeña empresa, seis empleados perciben sueldos de $6000, $6200, $6100, $6300, $6000 y un ejecutivo percibe $70000. ¿Qué medida de tendencia central describe de forma más representativa el salario típico de los trabajadores de la empresa?",
      options: [
        "La media aritmética.",
        "La mediana.",
        "La suma promedio.",
        "El rango medio."
      ],
      answer: 1,
      explanation: "El sueldo atípico de $70,000 eleva la media a $15,233.33, la cual distorsiona la realidad. La mediana ($6,150) no es afectada por valores extremos y representa mejor el sueldo típico."
    },
    {
      topic: "Promedio de Temperaturas",
      question: "12. Las temperaturas máximas registradas durante seis días fueron: 22 °C, 24 °C, 25 °C, 23 °C, 26 °C, 24 °C. ¿Cuál es la media aritmética de las temperaturas?",
      options: [
        "23.5 °C",
        "24.0 °C",
        "24.5 °C",
        "25.0 °C"
      ],
      answer: 1,
      explanation: "Suma total: 22 + 24 + 25 + 23 + 26 + 24 = 144. Media: x̄ = 144 / 6 = 24.0 °C."
    },
    {
      topic: "Medidas en Variables Categóricas",
      question: "13. En un estudio sobre preferencia de marca de refrescos (Marca A, Marca B, Marca C), ¿cuál de las siguientes medidas es la ÚNICA aplicable por tratarse de una variable cualitativa categórica?",
      options: [
        "Media",
        "Mediana",
        "Moda",
        "Desviación media"
      ],
      answer: 2,
      explanation: "Para variables cualitativas no numéricas no se pueden efectuar sumas ni ordenar de menor a mayor, por lo que únicamente es posible determinar la categoría más frecuente (la moda)."
    },
    {
      topic: "Frecuencia Absoluta desde Ángulo Central",
      question: "14. En un diagrama circular de 300 encuestados, el sector que representa a los usuarios de 'Bicicleta' mide 54°. ¿Cuántos encuestados utilizan bicicleta?",
      options: [
        "45 personas",
        "54 personas",
        "60 personas",
        "50 personas"
      ],
      answer: 0,
      explanation: "f = n × (θ / 360°) = 300 × (54° / 360°) = 300 × 0.15 = 45 personas."
    },
    {
      topic: "Conversión a Grados para Sectores",
      question: "15. Un estudio con 200 estudiantes muestra sus actividades de fin de semana: Cine (60), Lectura (40), Deportes (80) y Música (20). ¿Qué ángulo le corresponde al sector de 'Deportes' en un gráfico circular?",
      options: [
        "144°",
        "120°",
        "108°",
        "90°"
      ],
      answer: 0,
      explanation: "θ = 360° × (f / n) = 360° × (80 / 200) = 360° × 0.40 = 144°."
    },
    {
      topic: "Porcentaje de Participación en Barras",
      question: "16. Las ventas registradas en una gráfica de barras para cuatro productos son: Producto A (60), Producto B (80), Producto C (100) y Producto D (160). ¿Qué porcentaje del total de ventas corresponde al Producto C?",
      options: [
        "20%",
        "25%",
        "30%",
        "15%"
      ],
      answer: 1,
      explanation: "Suma total de ventas: 60 + 80 + 100 + 160 = 400. Porcentaje del Producto C: (100 / 400) × 100% = 0.25 × 100% = 25%."
    },
    {
      topic: "Análisis Crítico de Gráficas Engañosas",
      question: "17. Un reporte de noticias incluye una gráfica de barras comparando la producción de dos fábricas. La barra de la Fábrica 1 mide 6 cm de alto (representando 510 unidades) y la barra de la Fábrica 2 mide 1 cm de alto (representando 500 unidades). ¿Por qué la gráfica exagera visualmente la diferencia?",
      options: [
        "Porque las barras se graficaron con anchos horizontales desiguales.",
        "Porque el eje vertical se truncó e inició en 498 en lugar de iniciar en 0.",
        "Porque se utilizó una gráfica circular invertida.",
        "Porque las unidades estaban calculadas en porcentajes."
      ],
      answer: 1,
      explanation: "Al truncar el eje vertical e iniciar cerca de 500, una pequeña diferencia de 10 unidades (2%) se percibe visualmente como si una fábrica produjera 6 veces más que la otra."
    },
    {
      topic: "Cálculo de Población por Ángulo Central",
      question: "18. En una gráfica circular que representa a 400 personas, el sector de la categoría X tiene un ángulo central de 126°. ¿Cuántas personas pertenecen a la categoría X?",
      options: [
        "140 personas",
        "126 personas",
        "150 personas",
        "160 personas"
      ],
      answer: 0,
      explanation: "f = n × (θ / 360°) = 400 × (126° / 360°) = 400 × 0.35 = 140 personas."
    },
    {
      topic: "Conversión de Datos a Ángulos Circulares",
      question: "19. Se presentan las frecuencias de venta de cuatro bebidas en un negocio: Agua (90), Jugo (60), Refresco (120) y Té (30). ¿Qué ángulo le correspondería a la categoría 'Agua' en un gráfico circular?",
      options: [
        "90°",
        "108°",
        "120°",
        "135°"
      ],
      answer: 1,
      explanation: "Total de bebidas: 90 + 60 + 120 + 30 = 300. Ángulo para Agua: θ = 360° × (90 / 300) = 360° × 0.30 = 108°."
    },
    {
      topic: "Ángulo Restante y Porcentaje en Gráfica Circular",
      question: "20. En un diagrama circular dividido en cuatro sectores (W, X, Y, Z), los sectores W, X e Y miden 100°, 110° y 70°, respectivamente. ¿Qué porcentaje del total representa el sector Z?",
      options: [
        "20%",
        "25%",
        "22.2%",
        "30%"
      ],
      answer: 2,
      explanation: "El ángulo del sector Z es 360° - (100° + 110° + 70°) = 360° - 280° = 80°. El porcentaje que representa es (80° / 360°) × 100% = (2 / 9) × 100% ≈ 22.22% ≈ 22.2%."
    }
  ];

  var questions = [];
  var currentQuestionIndex = 0;
  var selectedOptionIndex = null;
  var score = 0;

  var prefixes = ["A", "B", "C", "D"];

  var questionCounter = document.getElementById("questionCounter");
  var scoreCounter = document.getElementById("scoreCounter");
  var progressBar = document.getElementById("progressBar");
  var topicBadge = document.getElementById("topicBadge");
  var questionText = document.getElementById("questionText");
  var optionsContainer = document.getElementById("optionsContainer");
  var feedbackPanel = document.getElementById("feedbackPanel");
  var feedbackTitle = document.getElementById("feedbackTitle");
  var feedbackText = document.getElementById("feedbackText");
  var checkBtn = document.getElementById("checkBtn");
  var nextBtn = document.getElementById("nextBtn");
  var quizBody = document.getElementById("quizBody");
  var progressHeader = document.getElementById("progressHeader");
  var resultScreen = document.getElementById("resultScreen");
  var finalScore = document.getElementById("finalScore");
  var finalMessage = document.getElementById("finalMessage");
  var resultTitle = document.getElementById("resultTitle");
  var restartBtn = document.getElementById("restartBtn");

  function initQuiz() {
    questions = rawQuestions;
    currentQuestionIndex = 0;
    score = 0;
    resultScreen.style.display = "none";
    progressHeader.style.display = "flex";
    quizBody.style.display = "flex";
    loadQuestion();
  }

  function loadQuestion() {
    selectedOptionIndex = null;
    checkBtn.disabled = true;
    checkBtn.style.display = "inline-block";
    nextBtn.style.display = "none";
    feedbackPanel.style.display = "none";
    feedbackPanel.className = "feedback-panel";

    var q = questions[currentQuestionIndex];

    questionCounter.textContent = "Pregunta " + (currentQuestionIndex + 1) + " de " + questions.length;
    scoreCounter.textContent = "Aciertos: " + score;
    progressBar.style.width = (((currentQuestionIndex + 1) / questions.length) * 100) + "%";

    topicBadge.textContent = q.topic;
    questionText.innerHTML = q.question;

    optionsContainer.innerHTML = "";
    q.options.forEach(function(optText, index) {
      var btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerHTML = '<span class="option-prefix">' + prefixes[index] + '</span> <span>' + optText + '</span>';
      btn.addEventListener("click", function() { selectOption(index); });
      optionsContainer.appendChild(btn);
    });
  }

  function selectOption(index) {
    if (checkBtn.style.display === "none") return;
    selectedOptionIndex = index;
    var allOptions = optionsContainer.querySelectorAll(".option-btn");
    allOptions.forEach(function(btn, idx) {
      if (idx === index) {
        btn.classList.add("selected");
      } else {
        btn.classList.remove("selected");
      }
    });
    checkBtn.disabled = false;
  }

  function checkAnswer() {
    if (selectedOptionIndex === null) return;
    var q = questions[currentQuestionIndex];
    var allOptions = optionsContainer.querySelectorAll(".option-btn");

    allOptions.forEach(function(btn) { btn.disabled = true; });
    checkBtn.style.display = "none";
    nextBtn.style.display = "inline-block";

    var isCorrect = (selectedOptionIndex === q.answer);

    if (isCorrect) {
      score++;
      scoreCounter.textContent = "Aciertos: " + score;
      allOptions[selectedOptionIndex].classList.remove("selected");
      allOptions[selectedOptionIndex].classList.add("correct");

      feedbackPanel.className = "feedback-panel success";
      feedbackTitle.innerHTML = "📊 ¡Excelente! Respuesta correcta";
      feedbackText.innerHTML = q.explanation;
    } else {
      allOptions[selectedOptionIndex].classList.remove("selected");
      allOptions[selectedOptionIndex].classList.add("incorrect");
      allOptions[q.answer].classList.add("correct");

      feedbackPanel.className = "feedback-panel error";
      feedbackTitle.innerHTML = "💡 Solución paso a paso:";
      feedbackText.innerHTML = "<strong>Demostración:</strong> " + q.explanation;
    }

    feedbackPanel.style.display = "block";
    nextBtn.focus();
  }

  function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < questions.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    quizBody.style.display = "none";
    progressHeader.style.display = "none";
    resultScreen.style.display = "block";

    finalScore.textContent = score + " / " + questions.length;

    var msg = "";
    if (score === 20) {
      resultTitle.textContent = "📈 ¡Dominio Absoluto en Estadística y Gráficas!";
      msg = "¡Súper bien! Resolviste correctamente los 20 reactivos. Dominas las frecuencias relativas, la media, mediana y moda, los cálculos de sectores circulares y la lectura crítica de gráficos.";
    } else if (score >= 16) {
      resultTitle.textContent = "🌟 ¡Excelente Desempeño!";
      msg = "Tienes un nivel de preparación en matemática estadística muy alto. Revisa detenidamente la conversión de ángulos a porcentajes para afinar detalles.";
    } else if (score >= 11) {
      resultTitle.textContent = "👍 ¡Buen Esfuerzo!";
      msg = "Vas por buen camino. Te sugerimos repasar la diferencia entre la media y la mediana cuando hay valores atípicos y el cálculo de números índice.";
    } else {
      resultTitle.textContent = "💪 ¡A Seguir Estudiando!";
      msg = "¡No te desanimes! Refuerza los porcentajes de incremento y las propiedades de las gráficas circulares para volver a intentarlo.";
    }
    finalMessage.textContent = msg;
  }

  checkBtn.addEventListener("click", checkAnswer);
  nextBtn.addEventListener("click", nextQuestion);
  restartBtn.addEventListener("click", initQuiz);

  document.addEventListener("keydown", function(e) {
    if (resultScreen.style.display === "block") {
      if (e.key === "Enter") initQuiz();
      return;
    }

    var key = e.key.toUpperCase();
    if (["A", "1"].indexOf(key) !== -1) selectOption(0);
    else if (["B", "2"].indexOf(key) !== -1) selectOption(1);
    else if (["C", "3"].indexOf(key) !== -1) selectOption(2);
    else if (["D", "4"].indexOf(key) !== -1) selectOption(3);
    else if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (checkBtn.style.display !== "none" && !checkBtn.disabled) {
        checkAnswer();
      } else if (nextBtn.style.display !== "none") {
        nextQuestion();
      }
    }
  });

  window.addEventListener("DOMContentLoaded", initQuiz);
</script>

</body>
</html>
