<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simulador de Física: Mecánica y Energía</title>
  <style>
    @font-face {
      font-family: 'Mogena';
      src: url('https://fonts.cdnfonts.com/s/91216/MogenaRegular-8Mzx3.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 35%, #0f172a 70%, #020617 100%);
      --card-bg: rgba(15, 23, 42, 0.88);
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;

      --neon-lime: #38bdf8;
      --pastel-lime: rgba(56, 189, 248, 0.15);
      --neon-emerald: #818cf8;
      --pastel-emerald: rgba(129, 140, 248, 0.15);
      --neon-cyan: #c084fc;
      --pastel-cyan: rgba(192, 132, 252, 0.15);
      --neon-green: #22c55e;
      --pastel-green: rgba(34, 197, 94, 0.2);
      --neon-red: #f43f5e;
      --pastel-red: rgba(244, 63, 94, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Mogena', 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: clamp(6px, 1.5vw, 20px);
    }

    .quiz-container {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      width: 100%;
      max-width: 1250px;
      min-height: min(94vh, 900px);
      border-radius: clamp(16px, 2.5vw, 28px);
      border: clamp(2px, 0.3vw, 3px) solid var(--neon-lime);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      margin: auto;
      position: relative;
    }

    .progress-header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: clamp(12px, 2vw, 20px) clamp(16px, 3vw, 36px);
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: clamp(2px, 0.3vw, 3px) solid var(--neon-lime);
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .progress-info {
      display: flex;
      gap: clamp(10px, 2.5vw, 24px);
      flex-wrap: wrap;
      font-size: clamp(0.95rem, 1.2vw, 1.2rem);
      color: var(--neon-lime);
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    .shortcut-hint {
      font-size: 0.8rem;
      color: #93c5fd;
      font-weight: 600;
      display: none;
    }

    @media (min-width: 1024px) {
      .shortcut-hint {
        display: inline-block;
      }
    }

    .top-brand-logo img {
      height: clamp(34px, 5vw, 68px);
      width: auto;
      object-fit: contain;
      filter: contrast(1.15) drop-shadow(0 0 10px rgba(56, 189, 248, 0.5));
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .top-brand-logo img:hover {
      transform: scale(1.1) rotate(-2deg);
    }

    .progress-bar-bg {
      width: 100%;
      height: clamp(10px, 1.1vw, 15px);
      background-color: rgba(30, 41, 59, 0.8);
      border-radius: 30px;
      overflow: hidden;
      border: 1.5px solid rgba(56, 189, 248, 0.4);
    }

    .progress-bar-fill {
      height: 100%;
      width: 5%;
      background: linear-gradient(90deg, var(--neon-lime), var(--neon-emerald), var(--neon-cyan));
      border-radius: 30px;
      box-shadow: 0 0 15px var(--neon-lime);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .quiz-body {
      padding: clamp(16px, 2.5vw, 36px);
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 1150px;
      margin: 0 auto;
      width: 100%;
      overflow-y: auto;
    }

    .question-topic {
      align-self: flex-start;
      font-size: clamp(0.75rem, 0.9vw, 0.9rem);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 6px clamp(12px, 1.5vw, 18px);
      border-radius: 30px;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      font-weight: 900;
      margin-bottom: clamp(10px, 1.5vw, 18px);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    .question-text {
      font-size: clamp(1.05rem, 1.5vw, 1.45rem);
      line-height: 1.45;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: clamp(16px, 2vw, 24px);
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: clamp(10px, 1.3vw, 16px);
      margin-bottom: clamp(16px, 2vw, 22px);
    }

    .option-btn {
      background: rgba(30, 41, 59, 0.6);
      border: clamp(2px, 0.25vw, 3px) solid rgba(56, 189, 248, 0.35);
      border-radius: clamp(14px, 1.5vw, 18px);
      padding: clamp(12px, 1.4vw, 16px) clamp(14px, 1.6vw, 18px);
      text-align: left;
      font-size: clamp(0.95rem, 1.15vw, 1.1rem);
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: var(--text-main);
      font-weight: 600;
      line-height: 1.35;
      overflow-wrap: break-word;
      word-break: break-word;
      min-height: 56px;
      position: relative;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--neon-lime);
      background-color: var(--pastel-lime);
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
    }

    .option-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .option-btn.selected {
      border-color: var(--neon-lime);
      background-color: var(--pastel-lime);
      color: #7dd3fc;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
      transform: scale(1.01);
    }

    .option-prefix {
      font-weight: 900;
      margin-right: 12px;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      width: clamp(34px, 3.2vw, 40px);
      height: clamp(34px, 3.2vw, 40px);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: clamp(0.85rem, 1vw, 1rem);
      color: #0f172a;
      border: 2px solid var(--neon-lime);
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .option-btn.selected .option-prefix {
      background: var(--neon-lime);
      border-color: #ffffff;
      color: #0f172a;
      transform: rotate(360deg);
    }

    .option-btn.correct {
      background-color: var(--pastel-green) !important;
      border-color: var(--neon-green) !important;
      color: #86efac !important;
      box-shadow: 0 0 22px rgba(34, 197, 94, 0.5) !important;
      animation: popSuccess 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .option-btn.correct .option-prefix {
      background: var(--neon-green);
      border-color: var(--neon-green);
      color: #0f172a;
    }

    .option-btn.incorrect {
      background-color: var(--pastel-red) !important;
      border-color: var(--neon-red) !important;
      color: #fca5a5 !important;
      box-shadow: 0 0 20px rgba(244, 63, 94, 0.5) !important;
      animation: shakeError 0.35s ease-in-out;
    }
    .option-btn.incorrect .option-prefix {
      background: var(--neon-red);
      border-color: var(--neon-red);
      color: #ffffff;
    }

    .feedback-panel {
      padding: clamp(14px, 1.8vw, 20px);
      border-radius: clamp(14px, 1.5vw, 18px);
      margin-bottom: clamp(14px, 1.8vw, 20px);
      display: none;
      animation: slideUp 0.3s ease;
      line-height: 1.5;
      font-size: clamp(0.9rem, 1.05vw, 1rem);
    }

    .feedback-panel.success {
      background-color: rgba(34, 197, 94, 0.15);
      border: clamp(2px, 0.25vw, 3px) solid var(--neon-green);
      color: #dcfce7;
    }

    .feedback-panel.error {
      background-color: rgba(244, 63, 94, 0.15);
      border: clamp(2px, 0.25vw, 3px) solid var(--neon-red);
      color: #ffe4e6;
    }

    .feedback-title {
      font-weight: 900;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(1rem, 1.15vw, 1.15rem);
    }

    .quiz-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 4px;
    }

    .action-btn {
      padding: clamp(12px, 1.4vw, 16px) clamp(24px, 2.8vw, 34px);
      font-size: clamp(0.95rem, 1.15vw, 1.1rem);
      font-weight: 800;
      border: none;
      border-radius: clamp(12px, 1.2vw, 16px);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      letter-spacing: 0.5px;
      width: auto;
      min-height: 48px;
    }

    .btn-check {
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
    }
    .btn-check:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.15);
    }
    .btn-check:disabled {
      background: #1e293b;
      color: #475569;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-next {
      background: linear-gradient(135deg, var(--neon-emerald), var(--neon-cyan));
      color: #0f172a;
      display: none;
      box-shadow: 0 6px 20px rgba(129, 140, 248, 0.4);
    }
    .btn-next:hover {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.15);
    }

    .result-screen {
      display: none;
      text-align: center;
      padding: clamp(24px, 4vw, 50px) clamp(14px, 3vw, 24px);
      margin: auto;
      max-width: 800px;
      animation: slideUp 0.4s ease;
    }

    .result-title {
      font-size: clamp(1.8rem, 3.2vw, 2.5rem);
      color: var(--neon-lime);
      font-weight: 900;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
    }

    .result-score {
      font-size: clamp(3.5rem, 7vw, 5rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald), var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: clamp(10px, 1.8vw, 18px) 0;
      filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.6));
    }

    .result-message {
      font-size: clamp(1rem, 1.3vw, 1.2rem);
      color: var(--text-main);
      margin-bottom: clamp(20px, 2.8vw, 32px);
      line-height: 1.5;
      font-weight: 600;
    }

    .btn-restart {
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      padding: clamp(14px, 1.6vw, 18px) clamp(30px, 3.5vw, 44px);
      font-size: clamp(1rem, 1.2vw, 1.15rem);
      box-shadow: 0 8px 25px rgba(56, 189, 248, 0.5);
    }
    .btn-restart:hover {
      transform: scale(1.06);
      filter: brightness(1.15);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popSuccess {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1.01); }
    }

    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    @media (max-width: 580px) {
      .quiz-footer {
        flex-direction: column;
      }
      .action-btn {
        width: 100%;
        text-align: center;
      }
      .options-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <div class="progress-header" id="progressHeader">
    <div class="header-top">
      <div class="progress-info">
        <span id="questionCounter">Pregunta 1 de 15</span>
        <span id="scoreCounter">Aciertos: 0</span>
        <span class="shortcut-hint">💡 Usa las teclas [A, B, C, D] y [Enter]</span>
      </div>
      <div class="top-brand-logo">
        <img src="Logo_MB.png" alt="Logo ECOEMS">
      </div>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </div>

  <div class="quiz-body" id="quizBody">
    <span class="question-topic" id="topicBadge">Estática y Dinámica</span>
    <h2 class="question-text" id="questionText">Cargando reactivo...</h2>

    <div class="options-grid" id="optionsContainer"></div>

    <div class="feedback-panel" id="feedbackPanel">
      <div class="feedback-title" id="feedbackTitle"></div>
      <div id="feedbackText"></div>
    </div>

    <div class="quiz-footer">
      <button class="action-btn btn-check" id="checkBtn" disabled>Comprobar respuesta</button>
      <button class="action-btn btn-next" id="nextBtn">Siguiente pregunta ➔</button>
    </div>
  </div>

  <div class="result-screen" id="resultScreen">
    <h2 class="result-title" id="resultTitle">¡Evaluación Finalizada!</h2>
    <div class="result-score" id="finalScore">0 / 15</div>
    <p class="result-message" id="finalMessage">Mensaje de desempeño</p>
    <button class="action-btn btn-restart" id="restartBtn">↻ Reiniciar simulador</button>
  </div>
</div>

<script>
  const rawQuestions = [
    {
      topic: "Estática y Equilibrio de Fuerzas",
      question: "Una lámpara de 120 N cuelga en reposo mediante dos cables idénticos que forman un ángulo de 30° con la horizontal. ¿Cuál es la tensión en cada cable?",
      options: [
        "60 N",
        "120 N",
        "240 N",
        "120√3 N"
      ],
      answer: 1,
      explanation: "Tensión en cables: 2T · sin(30°) = W. Como sin(30°) = 0.5, se cumple que 2T(0.5) = W → T = W = 120 N."
    },
    {
      topic: "Torque y Equilibrio Rotacional",
      question: "Una barra horizontal de peso despreciable mide 4 m y está apoyada en su extremo izquierdo. A 1 m del apoyo se coloca una carga de 300 N. ¿Qué fuerza vertical hacia arriba se debe aplicar en el extremo derecho para mantener el equilibrio rotacional?",
      options: [
        "75 N",
        "150 N",
        "300 N",
        "1200 N"
      ],
      answer: 0,
      explanation: "Torque en la barra: Στ = 0 → F · (4 m) = 300 N · (1 m) → F = 300 / 4 = 75 N."
    },
    {
      topic: "Trabajo Mecánico y Potencia",
      question: "El trabajador A eleva una caja de 200 N a una altura de 6 m en 10 s. El trabajador B eleva la misma caja a la misma altura en 15 s. ¿Qué afirmación es correcta?",
      options: [
        "B realiza más trabajo que A.",
        "A realiza más trabajo que B.",
        "Ambos realizan el mismo trabajo, pero A desarrolla mayor potencia.",
        "Ambos desarrollan la misma potencia mecánica."
      ],
      answer: 2,
      explanation: "Trabajo vs Potencia: Ambos realizan W = 200 N · 6 m = 1200 J. Como A tarda menos tiempo (10 s vs 15 s), desarrolla mayor potencia."
    },
    {
      topic: "Comparación de Potencia Mecánica",
      question: "Una máquina realiza 18,000 J de trabajo útil en 30 s. Una segunda máquina realiza 24,000 J en 60 s. ¿Cuál es la comparación correcta de sus potencias?",
      options: [
        "La primera desarrolla 600 W y posee mayor potencia que la segunda.",
        "La segunda máquina desarrolla mayor potencia que la primera.",
        "Ambas máquinas desarrollan exactamente 400 W de potencia.",
        "La primera desarrolla 540,000 W de potencia."
      ],
      answer: 0,
      explanation: "Cálculo de Potencia: P1 = 18,000 / 30 = 600 W. P2 = 24,000 / 60 = 400 W. Por lo tanto, P1 > P2."
    },
    {
      topic: "Energía Cinética",
      question: "Un automóvil de 1,000 kg aumenta su rapidez de 10 m/s a 20 m/s. ¿Cuánto aumenta su energía cinética durante esta aceleración?",
      options: [
        "50,000 J",
        "100,000 J",
        "150,000 J",
        "200,000 J"
      ],
      answer: 2,
      explanation: "Aumento de Ec: ΔEc = 1/2 · m · (vf² - vi²) = 500 · (20² - 10²) = 500 · (400 - 100) = 150,000 J."
    },
    {
      topic: "Concepto de Trabajo Nulo",
      question: "¿En cuál de las siguientes situaciones el trabajo mecánico realizado sobre un objeto es estrictamente IGUAL A CERO?",
      options: [
        "Empujar un carrito con una fuerza de 50 N a lo largo de 10 m.",
        "Caminar horizontalmente cargando una mochila de 100 N a velocidad constante.",
        "Levantar una caja verticalmente desde el suelo hasta una mesa.",
        "Detener un vehículo mediante la fuerza de fricción de los frenos."
      ],
      answer: 1,
      explanation: "Trabajo Nulo: La fuerza de soporte es vertical y el desplazamiento es horizontal (θ = 90°), por lo que cos(90°) = 0 y W = 0."
    },
    {
      topic: "Condiciones de Equilibrio Traslacional",
      question: "Un objeto de masa m reposa sobre una superficie plana. Para que permanezca en equilibrio traslacional en dos dimensiones (x, y), se debe cumplir que:",
      options: [
        "ΣFx = 0 y ΣFy = 0",
        "ΣFx = m · a",
        "Στ = F · d",
        "La velocidad del objeto sea siempre variable."
      ],
      answer: 0,
      explanation: "Equilibrio Traslacional: La fuerza neta vectorial en ambas dimensiones debe ser nula: ΣFx = 0 y ΣFy = 0."
    },
    {
      topic: "Relación Cuadrática de la Energía Cinética",
      question: "Si la velocidad de un objeto en movimiento se duplica manteniendo su masa constante, su energía cinética se:",
      options: [
        "Duplica",
        "Triplica",
        "Cuadruplica",
        "Reduce a la mitad"
      ],
      answer: 2,
      explanation: "Relación cuadrática: Ec = 1/2 · m · v². Al ser proporcional al cuadrado de la velocidad, duplicarla cuadruplica la energía (2² = 4)."
    },
    {
      topic: "Trabajo con Ángulo",
      question: "Una fuerza constante de 50 N se aplica a un bloque formando un ángulo de 60° con la horizontal. Si el bloque se desplaza 8 m horizontalmente, ¿cuál es el trabajo realizado? (Considera cos 60° = 0.5):",
      options: [
        "400 J",
        "200 J",
        "346 J",
        "0 J"
      ],
      answer: 1,
      explanation: "Fórmula de Trabajo: W = F · d · cos(θ) = 50 N · 8 m · cos(60°) = 400 · 0.5 = 200 J."
    },
    {
      topic: "Potencia con Velocidad Constante",
      question: "¿Cuál es la potencia desarrollada por un motor que ejerce una fuerza constante de 500 N para mover un vehículo a una velocidad constante de 12 m/s?",
      options: [
        "41.6 W",
        "3,000 W",
        "6,000 W",
        "60,000 W"
      ],
      answer: 2,
      explanation: "Potencia con velocidad: P = F · v = 500 N · 12 m/s = 6,000 W."
    },
    {
      topic: "Momento de Torsión (Torque)",
      question: "Para un cuerpo rígido, el momento de torsión o torque producido por una fuerza depende directamente de:",
      options: [
        "Únicamente de la masa del cuerpo.",
        "La magnitud de la fuerza y la distancia perpendicular al eje de rotación.",
        "El tiempo durante el cual se aplica la fuerza.",
        "La velocidad angular máxima alcanzada."
      ],
      answer: 1,
      explanation: "Torque o Momento: τ = F · d_perpendicular. Depende directamente de la fuerza aplicada y del brazo de palanca."
    },
    {
      topic: "Potencia Contra la Gravedad",
      question: "Si un atleta de 60 kg sube por una escalera de 5 m de altura en 4 s, ¿cuánta potencia desarrolla contra la gravedad? (Usar g = 10 m/s²):",
      options: [
        "750 W",
        "300 W",
        "3,000 W",
        "150 W"
      ],
      answer: 0,
      explanation: "Potencia de elevación: W = m · g · h = 60 · 10 · 5 = 3,000 J. P = 3,000 J / 4 s = 750 W."
    },
    {
      topic: "Trabajo por Fricción",
      question: "Un bloque desliza sobre una mesa horizontal con fricción. El trabajo realizado por la fuerza de fricción sobre el bloque es:",
      options: [
        "Siempre positivo",
        "Siempre negativo",
        "Nulo",
        "Independiente del desplazamiento"
      ],
      answer: 1,
      explanation: "Fuerza opuesta: La fricción actúa en sentido contrario al desplazamiento (θ = 180°), cos(180°) = -1, por lo que el trabajo es siempre negativo."
    },
    {
      topic: "Unidades del Sistema Internacional",
      question: "¿Cuál de las siguientes unidades equivale exactamente a 1 Watt (W) en el Sistema Internacional?",
      options: [
        "1 N · m",
        "1 J / s",
        "1 kg · m / s²",
        "1 J · s"
      ],
      answer: 1,
      explanation: "Unidades SI: El Watt mide la tasa de transferencia energética por unidad de tiempo: 1 W = 1 Joule / segundo."
    },
    {
      topic: "Equilibrio en Palancas",
      question: "Una palanca de 2 m tiene su punto de apoyo en el centro. Si se aplica una fuerza hacia abajo de 100 N en un extremo, ¿qué fuerza hacia abajo se debe aplicar en el otro extremo para mantenerla en equilibrio?",
      options: [
        "50 N",
        "100 N",
        "200 N",
        "0 N"
      ],
      answer: 1,
      explanation: "Equilibrio de Palanca: Al estar el pivote exactamente en el centro, los brazos miden 1 m de cada lado, requiriendo 100 N para equilibrar los torques."
    }
  ];

  let questions = [];
  let currentQuestionIndex = 0;
  let selectedOptionIndex = null;
  let score = 0;

  const prefixes = ["A", "B", "C", "D"];

  const questionCounter = document.getElementById("questionCounter");
  const scoreCounter = document.getElementById("scoreCounter");
  const progressBar = document.getElementById("progressBar");
  const topicBadge = document.getElementById("topicBadge");
  const questionText = document.getElementById("questionText");
  const optionsContainer = document.getElementById("optionsContainer");
  const feedbackPanel = document.getElementById("feedbackPanel");
  const feedbackTitle = document.getElementById("feedbackTitle");
  const feedbackText = document.getElementById("feedbackText");
  const checkBtn = document.getElementById("checkBtn");
  const nextBtn = document.getElementById("nextBtn");
  const quizBody = document.getElementById("quizBody");
  const progressHeader = document.getElementById("progressHeader");
  const resultScreen = document.getElementById("resultScreen");
  const finalScore = document.getElementById("finalScore");
  const finalMessage = document.getElementById("finalMessage");
  const resultTitle = document.getElementById("resultTitle");
  const restartBtn = document.getElementById("restartBtn");

  function shuffleArray(array) {
    const shuffled = [...array];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
  }

  function initQuiz() {
    questions = shuffleArray(rawQuestions);
    currentQuestionIndex = 0;
    score = 0;
    resultScreen.style.display = "none";
    progressHeader.style.display = "flex";
    quizBody.style.display = "flex";
    loadQuestion();
  }

  function loadQuestion() {
    selectedOptionIndex = null;
    checkBtn.disabled = true;
    checkBtn.style.display = "inline-block";
    nextBtn.style.display = "none";
    feedbackPanel.style.display = "none";
    feedbackPanel.className = "feedback-panel";

    const q = questions[currentQuestionIndex];

    questionCounter.textContent = `Pregunta ${currentQuestionIndex + 1} de ${questions.length}`;
    scoreCounter.textContent = `Aciertos: ${score}`;
    progressBar.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;

    topicBadge.textContent = q.topic;
    questionText.innerHTML = q.question;

    optionsContainer.innerHTML = "";
    q.options.forEach((optText, index) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerHTML = `<span class="option-prefix">${prefixes[index]}</span> <span>${optText}</span>`;
      btn.addEventListener("click", () => selectOption(index));
      optionsContainer.appendChild(btn);
    });
  }

  function selectOption(index) {
    if (checkBtn.style.display === "none") return;
    selectedOptionIndex = index;
    const allOptions = optionsContainer.querySelectorAll(".option-btn");
    allOptions.forEach((btn, idx) => {
      if (idx === index) {
        btn.classList.add("selected");
      } else {
        btn.classList.remove("selected");
      }
    });
    checkBtn.disabled = false;
  }

  function checkAnswer() {
    if (selectedOptionIndex === null) return;
    const q = questions[currentQuestionIndex];
    const allOptions = optionsContainer.querySelectorAll(".option-btn");

    allOptions.forEach(btn => btn.disabled = true);
    checkBtn.style.display = "none";
    nextBtn.style.display = "inline-block";

    const isCorrect = (selectedOptionIndex === q.answer);

    if (isCorrect) {
      score++;
      scoreCounter.textContent = `Aciertos: ${score}`;
      allOptions[selectedOptionIndex].classList.remove("selected");
      allOptions[selectedOptionIndex].classList.add("correct");

      feedbackPanel.className = "feedback-panel success";
      feedbackTitle.innerHTML = "⚡ ¡Excelente! Respuesta correcta";
      feedbackText.innerHTML = q.explanation;
    } else {
      allOptions[selectedOptionIndex].classList.remove("selected");
      allOptions[selectedOptionIndex].classList.add("incorrect");
      allOptions[q.answer].classList.add("correct");

      feedbackPanel.className = "feedback-panel error";
      feedbackTitle.innerHTML = "💡 ¡Casi! Justificación física:";
      feedbackText.innerHTML = `<strong>Fundamento técnico:</strong> ${q.explanation}`;
    }

    feedbackPanel.style.display = "block";
    nextBtn.focus();
  }

  function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < questions.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    quizBody.style.display = "none";
    progressHeader.style.display = "none";
    resultScreen.style.display = "block";

    finalScore.textContent = `${score} / ${questions.length}`;

    let msg = "";
    if (score === 15) {
      resultTitle.textContent = "⚡ ¡Dominio Absoluto de Física!";
      msg = "¡Súper bien! Resolviste correctamente los 15 reactivos. Dominas la estática, el trabajo mecánico, la potencia y los cálculos energéticos.";
    } else if (score >= 12) {
      resultTitle.textContent = "🌟 ¡Excelente Desempeño!";
      msg = "Tienes un nivel muy avanzado de preparación. Revisa los detalles de los problemas numéricos en los que fallaste para perfeccionar.";
    } else if (score >= 8) {
      resultTitle.textContent = "👍 ¡Buen Esfuerzo!";
      msg = "Vas por buen camino. Te sugerimos repasar los conceptos de torque, descomposición de fuerzas y potencia.";
    } else {
      resultTitle.textContent = "💪 ¡A Seguir Estudiando!";
      msg = "¡No te desanimes! Refuerza las fórmulas de trabajo y conservación de la energía para volver a intentarlo.";
    }
    finalMessage.textContent = msg;
  }

  checkBtn.addEventListener("click", checkAnswer);
  nextBtn.addEventListener("click", nextQuestion);
  restartBtn.addEventListener("click", initQuiz);

  document.addEventListener("keydown", (e) => {
    if (resultScreen.style.display === "block") {
      if (e.key === "Enter") initQuiz();
      return;
    }

    const key = e.key.toUpperCase();
    if (["A", "1"].includes(key)) selectOption(0);
    else if (["B", "2"].includes(key)) selectOption(1);
    else if (["C", "3"].includes(key)) selectOption(2);
    else if (["D", "4"].includes(key)) selectOption(3);
    else if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (checkBtn.style.display !== "none" && !checkBtn.disabled) {
        checkAnswer();
      } else if (nextBtn.style.display !== "none") {
        nextQuestion();
      }
    }
  });

  initQuiz();
</script>

</body>
</html>
