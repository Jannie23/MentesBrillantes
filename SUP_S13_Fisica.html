<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simulador de Física Superior: Ondas y Propiedades de la Materia</title>
  <style>
    @font-face {
      font-family: 'Mogena';
      src: url('https://fonts.cdnfonts.com/s/91216/MogenaRegular-8Mzx3.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #3b0764 40%, #0e7490 80%, #020617 100%);
      --card-bg: rgba(15, 23, 42, 0.90);
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;

      --neon-lime: #22d3ee;
      --pastel-lime: rgba(34, 211, 238, 0.15);
      --neon-emerald: #c084fc;
      --pastel-emerald: rgba(192, 132, 252, 0.15);
      --neon-cyan: #a78bfa;
      --pastel-cyan: rgba(167, 139, 250, 0.15);
      --neon-green: #22c55e;
      --pastel-green: rgba(34, 197, 94, 0.2);
      --neon-red: #ef4444;
      --pastel-red: rgba(239, 68, 68, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Mogena', 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: clamp(6px, 1.5vw, 20px);
    }

    .quiz-container {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      width: 100%;
      max-width: 1250px;
      min-height: min(94vh, 900px);
      border-radius: clamp(16px, 2.5vw, 28px);
      border: clamp(2px, 0.3vw, 3px) solid var(--neon-lime);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(34, 211, 238, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      margin: auto;
      position: relative;
    }

    .progress-header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: clamp(12px, 2vw, 20px) clamp(16px, 3vw, 36px);
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: clamp(2px, 0.3vw, 3px) solid var(--neon-lime);
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .progress-info {
      display: flex;
      gap: clamp(10px, 2.5vw, 24px);
      flex-wrap: wrap;
      font-size: clamp(0.95rem, 1.2vw, 1.2rem);
      color: var(--neon-lime);
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(34, 211, 238, 0.4);
    }

    .shortcut-hint {
      font-size: 0.8rem;
      color: #a5f3fc;
      font-weight: 600;
      display: none;
    }

    @media (min-width: 1024px) {
      .shortcut-hint {
        display: inline-block;
      }
    }

    .top-brand-logo img {
      height: clamp(34px, 5vw, 68px);
      width: auto;
      object-fit: contain;
      filter: contrast(1.15) drop-shadow(0 0 10px rgba(34, 211, 238, 0.5));
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .top-brand-logo img:hover {
      transform: scale(1.1) rotate(-2deg);
    }

    .progress-bar-bg {
      width: 100%;
      height: clamp(10px, 1.1vw, 15px);
      background-color: rgba(30, 41, 59, 0.8);
      border-radius: 30px;
      overflow: hidden;
      border: 1.5px solid rgba(34, 211, 238, 0.4);
    }

    .progress-bar-fill {
      height: 100%;
      width: 5%;
      background: linear-gradient(90deg, var(--neon-lime), var(--neon-emerald), var(--neon-cyan));
      border-radius: 30px;
      box-shadow: 0 0 15px var(--neon-lime);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .quiz-body {
      padding: clamp(16px, 2.5vw, 36px);
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 1150px;
      margin: 0 auto;
      width: 100%;
      overflow-y: auto;
    }

    .question-topic {
      align-self: flex-start;
      font-size: clamp(0.75rem, 0.9vw, 0.9rem);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 6px clamp(12px, 1.5vw, 18px);
      border-radius: 30px;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      font-weight: 900;
      margin-bottom: clamp(10px, 1.5vw, 18px);
      box-shadow: 0 0 15px rgba(34, 211, 238, 0.4);
    }

    .question-text {
      font-size: clamp(1.05rem, 1.5vw, 1.45rem);
      line-height: 1.45;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: clamp(16px, 2vw, 24px);
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: clamp(10px, 1.3vw, 16px);
      margin-bottom: clamp(16px, 2vw, 22px);
    }

    .option-btn {
      background: rgba(30, 41, 59, 0.6);
      border: clamp(2px, 0.25vw, 3px) solid rgba(34, 211, 238, 0.35);
      border-radius: clamp(14px, 1.5vw, 18px);
      padding: clamp(12px, 1.4vw, 16px) clamp(14px, 1.6vw, 18px);
      text-align: left;
      font-size: clamp(0.95rem, 1.15vw, 1.1rem);
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: var(--text-main);
      font-weight: 600;
      line-height: 1.35;
      overflow-wrap: break-word;
      word-break: break-word;
      min-height: 56px;
      position: relative;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--neon-lime);
      background-color: var(--pastel-lime);
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 8px 20px rgba(34, 211, 238, 0.3);
    }

    .option-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .option-btn.selected {
      border-color: var(--neon-lime);
      background-color: var(--pastel-lime);
      color: #a5f3fc;
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.5);
      transform: scale(1.01);
    }

    .option-prefix {
      font-weight: 900;
      margin-right: 12px;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      width: clamp(34px, 3.2vw, 40px);
      height: clamp(34px, 3.2vw, 40px);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: clamp(0.85rem, 1vw, 1rem);
      color: #0f172a;
      border: 2px solid var(--neon-lime);
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .option-btn.selected .option-prefix {
      background: var(--neon-lime);
      border-color: #ffffff;
      color: #0f172a;
      transform: rotate(360deg);
    }

    .option-btn.correct {
      background-color: var(--pastel-green) !important;
      border-color: var(--neon-green) !important;
      color: #86efac !important;
      box-shadow: 0 0 22px rgba(34, 197, 94, 0.5) !important;
      animation: popSuccess 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .option-btn.correct .option-prefix {
      background: var(--neon-green);
      border-color: var(--neon-green);
      color: #0f172a;
    }

    .option-btn.incorrect {
      background-color: var(--pastel-red) !important;
      border-color: var(--neon-red) !important;
      color: #fca5a5 !important;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.5) !important;
      animation: shakeError 0.35s ease-in-out;
    }
    .option-btn.incorrect .option-prefix {
      background: var(--neon-red);
      border-color: var(--neon-red);
      color: #ffffff;
    }

    .feedback-panel {
      padding: clamp(14px, 1.8vw, 20px);
      border-radius: clamp(14px, 1.5vw, 18px);
      margin-bottom: clamp(14px, 1.8vw, 20px);
      display: none;
      animation: slideUp 0.3s ease;
      line-height: 1.5;
      font-size: clamp(0.9rem, 1.05vw, 1rem);
    }

    .feedback-panel.success {
      background-color: rgba(34, 197, 94, 0.15);
      border: clamp(2px, 0.25vw, 3px) solid var(--neon-green);
      color: #dcfce7;
    }

    .feedback-panel.error {
      background-color: rgba(239, 68, 68, 0.15);
      border: clamp(2px, 0.25vw, 3px) solid var(--neon-red);
      color: #ffe4e6;
    }

    .feedback-title {
      font-weight: 900;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(1rem, 1.15vw, 1.15rem);
    }

    .quiz-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 4px;
    }

    .action-btn {
      padding: clamp(12px, 1.4vw, 16px) clamp(24px, 2.8vw, 34px);
      font-size: clamp(0.95rem, 1.15vw, 1.1rem);
      font-weight: 800;
      border: none;
      border-radius: clamp(12px, 1.2vw, 16px);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      letter-spacing: 0.5px;
      width: auto;
      min-height: 48px;
    }

    .btn-check {
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      box-shadow: 0 6px 20px rgba(34, 211, 238, 0.4);
    }
    .btn-check:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.15);
    }
    .btn-check:disabled {
      background: #1e293b;
      color: #475569;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-next {
      background: linear-gradient(135deg, var(--neon-emerald), var(--neon-cyan));
      color: #0f172a;
      display: none;
      box-shadow: 0 6px 20px rgba(192, 132, 252, 0.4);
    }
    .btn-next:hover {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.15);
    }

    .result-screen {
      display: none;
      text-align: center;
      padding: clamp(24px, 4vw, 50px) clamp(14px, 3vw, 24px);
      margin: auto;
      max-width: 800px;
      animation: slideUp 0.4s ease;
    }

    .result-title {
      font-size: clamp(1.8rem, 3.2vw, 2.5rem);
      color: var(--neon-lime);
      font-weight: 900;
      text-shadow: 0 0 15px rgba(34, 211, 238, 0.5);
    }

    .result-score {
      font-size: clamp(3.5rem, 7vw, 5rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald), var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: clamp(10px, 1.8vw, 18px) 0;
      filter: drop-shadow(0 0 15px rgba(34, 211, 238, 0.6));
    }

    .result-message {
      font-size: clamp(1rem, 1.3vw, 1.2rem);
      color: var(--text-main);
      margin-bottom: clamp(20px, 2.8vw, 32px);
      line-height: 1.5;
      font-weight: 600;
    }

    .btn-restart {
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      padding: clamp(14px, 1.6vw, 18px) clamp(30px, 3.5vw, 44px);
      font-size: clamp(1rem, 1.2vw, 1.15rem);
      box-shadow: 0 8px 25px rgba(34, 211, 238, 0.5);
    }
    .btn-restart:hover {
      transform: scale(1.06);
      filter: brightness(1.15);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popSuccess {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1.01); }
    }

    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    @media (max-width: 580px) {
      .quiz-footer {
        flex-direction: column;
      }
      .action-btn {
        width: 100%;
        text-align: center;
      }
      .options-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <div class="progress-header" id="progressHeader">
    <div class="header-top">
      <div class="progress-info">
        <span id="questionCounter">Pregunta 1 de 20</span>
        <span id="scoreCounter">Aciertos: 0</span>
        <span class="shortcut-hint">💡 Usa las teclas [A, B, C, D] y [Enter]</span>
      </div>
      <div class="top-brand-logo">
        <img src="Logo_MB.png" alt="Logo ECOEMS">
      </div>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </div>

  <div class="quiz-body" id="quizBody">
    <span class="question-topic" id="topicBadge">Física Superior: Ondas y Materia</span>
    <h2 class="question-text" id="questionText">Cargando reactivo...</h2>

    <div class="options-grid" id="optionsContainer"></div>

    <div class="feedback-panel" id="feedbackPanel">
      <div class="feedback-title" id="feedbackTitle"></div>
      <div id="feedbackText"></div>
    </div>

    <div class="quiz-footer">
      <button class="action-btn btn-check" id="checkBtn" disabled>Comprobar respuesta</button>
      <button class="action-btn btn-next" id="nextBtn">Siguiente pregunta ➔</button>
    </div>
  </div>

  <div class="result-screen" id="resultScreen">
    <h2 class="result-title" id="resultTitle">¡Evaluación Finalizada!</h2>
    <div class="result-score" id="finalScore">0 / 20</div>
    <p class="result-message" id="finalMessage">Mensaje de desempeño</p>
    <button class="action-btn btn-restart" id="restartBtn">↻ Reiniciar simulador</button>
  </div>
</div>

<script>
  var rawQuestions = [
    {
      topic: "Período y Velocidad Ondulatoria",
      question: "1. Una onda mecánica viaja a través de un resorte con una rapidez de v = 18 m/s y una longitud de onda de λ = 0.6 m. ¿Cuál es el período (T) de oscilación de la onda?",
      options: [
        "0.033 s",
        "30.0 s",
        "0.60 s",
        "10.8 s"
      ],
      answer: 0,
      explanation: "De la ecuación v = λ / T despejamos el período: T = λ / v = 0.6 m / 18 m/s = 1/30 s ≈ 0.033 s."
    },
    {
      topic: "Frecuencia y Rapidez de Propagación",
      question: "2. Un generador de ondas produce 120 oscilaciones completas en un lapso de 4 segundos. Si la longitud de onda medida es de 0.8 m, ¿cuál es la velocidad de propagación de la onda?",
      options: [
        "24 m/s",
        "30 m/s",
        "37.5 m/s",
        "96 m/s"
      ],
      answer: 0,
      explanation: "Primero calculamos la frecuencia: f = 120 ciclos / 4 s = 30 Hz. Luego aplicamos v = λ · f = (0.8 m)(30 Hz) = 24 m/s."
    },
    {
      topic: "Relación Inversa Frecuencia-Longitud de Onda",
      question: "3. Dos ondas sonoras, Onda X y Onda Y, se propagan simultáneamente en el aire a la misma temperatura. Si la frecuencia de la Onda X es el triple de la frecuencia de la Onda Y (f_X = 3f_Y), ¿cómo se comparan sus longitudes de onda?",
      options: [
        "λ_X = 3λ_Y",
        "λ_X = (1/3)λ_Y",
        "λ_X = λ_Y",
        "λ_X = (1/9)λ_Y"
      ],
      answer: 1,
      explanation: "En un mismo medio homogéneo, la velocidad v es igual para ambas ondas (v = λ_X·f_X = λ_Y·f_Y). Al ser λ inversamente proporcional a f, si f_X es tres veces mayor, λ_X debe ser un tercio de λ_Y."
    },
    {
      topic: "Naturaleza Física de las Ondas",
      question: "4. ¿Qué magnitud física transporta una onda mecánica mientras se desplaza por un medio elástico?",
      options: [
        "Masa neta de las partículas del medio de un extremo a otro.",
        "Energía y cantidad de movimiento sin transporte neto de materia.",
        "Carga eléctrica estática acumulada en los nodos.",
        "Volumen constante del medio receptor."
      ],
      answer: 1,
      explanation: "Por definición física, toda onda mecánica transfiere energía a través de la vibración local de las partículas del medio, las cuales oscilan en torno a su equilibrio sin desplazarse permanentemente."
    },
    {
      topic: "Cálculo de Rapidez de Olas",
      question: "5. Una boya en el mar sube y baja completando un ciclo cada 2.5 s. Si la distancia horizontal entre dos crestas consecutivas de las olas es de 15 m, ¿con qué rapidez avanzan las olas?",
      options: [
        "6.0 m/s",
        "37.5 m/s",
        "0.16 m/s",
        "12.5 m/s"
      ],
      answer: 0,
      explanation: "Usando la relación v = λ / T, sustituimos λ = 15 m y T = 2.5 s: v = 15 m / 2.5 s = 6.0 m/s."
    },
    {
      topic: "Variación de Frecuencia a Velocidad Constante",
      question: "6. Si la frecuencia de una fuente vibratoria que produce ondas en una cuerda tensa se reduce a la cuarta parte de su valor original sin modificar la tensión de la cuerda, ¿qué ocurre con la longitud de onda?",
      options: [
        "Se reduce a la cuarta parte.",
        "Se cuadruplica.",
        "Permanece constante.",
        "Se reduce a la mitad."
      ],
      answer: 1,
      explanation: "Al no cambiar la tensión ni la cuerda, la velocidad v permanece constante. Como λ = v / f, al dividir f entre 4, la longitud de onda se multiplica por 4."
    },
    {
      topic: "Longitud de Onda en Ultrasonido",
      question: "7. ¿Cuál es la longitud de onda de una señal ultrasónica que viaja en un tejido biológico a 1,500 m/s con una frecuencia de 50,000 Hz?",
      options: [
        "0.03 m",
        "33.3 m",
        "0.30 m",
        "7.5 m"
      ],
      answer: 0,
      explanation: "Despejando λ de v = λ · f: λ = v / f = 1,500 m/s / 50,000 Hz = 0.03 m."
    },
    {
      topic: "Reflexión en Extremo Libre",
      question: "8. Un pulso en forma de valle viaja por una cuerda cuyo extremo derecho está sujetado mediante un anillo ligero que desliza libremente sin fricción sobre una varilla vertical. ¿Cómo regresa el pulso tras reflejarse en dicho extremo?",
      options: [
        "Regresa como una cresta (invertido 180°).",
        "Regresa como un valle (sin invertirse).",
        "Se absorbe completamente y no hay pulso reflejado.",
        "Regresa con el doble de velocidad y la mitad de frecuencia."
      ],
      answer: 1,
      explanation: "Al tratarse de un extremo libre, no existe una fuerza de reacción rígida que invierta la fase de la perturbación, por lo que el pulso se refleja conservando su misma orientación original (valle)."
    },
    {
      topic: "Invariancia de la Frecuencia en Refracción",
      question: "9. Cuando un rayo de luz o una onda mecánica atraviesa oblicuamente la frontera entre dos medios diferentes experimentando refracción, ¿qué parámetro ondulatorio permanece invariante?",
      options: [
        "La velocidad de propagación (v).",
        "La longitud de onda (λ).",
        "La frecuencia (f).",
        "El ángulo respecto a la normal."
      ],
      answer: 2,
      explanation: "Durante la refracción, la frecuencia depende exclusivamente de la fuente emisora y no del medio atravesado, por lo que permanece constante mientras cambian v y λ."
    },
    {
      topic: "Cambio de Velocidad entre Medios",
      question: "10. Una onda viaja por un medio 1 con velocidad v₁ = 45 m/s y longitud de onda λ₁ = 1.5 m. Al pasar a un medio 2, su longitud de onda disminuye a λ₂ = 0.9 m. ¿Cuál es la velocidad de la onda en el medio 2?",
      options: [
        "27 m/s",
        "75 m/s",
        "30 m/s",
        "15 m/s"
      ],
      answer: 0,
      explanation: "Como la frecuencia f es constante: f = v₁ / λ₁ = 45 / 1.5 = 30 Hz. En el medio 2: v₂ = λ₂ · f = (0.9 m)(30 Hz) = 27 m/s."
    },
    {
      topic: "Transmisión en Cuerdas de Diferente Densidad",
      question: "11. Una cuerda delgada se ata por un extremo a una cuerda mucho más gruesa y pesada. Si se envía una cresta desde la cuerda delgada hacia la unión, ¿qué sucede con el pulso que logra transmitirse (refractarse) hacia la cuerda gruesa?",
      options: [
        "Viaja más rápido y con mayor longitud de onda.",
        "Viaja más lento y con menor longitud de onda, manteniendo la misma frecuencia.",
        "Aumenta su frecuencia al doble pero conserva su velocidad.",
        "Se detiene inmediatamente al tocar la cuerda gruesa."
      ],
      answer: 1,
      explanation: "En una cuerda de mayor densidad lineal (más gruesa), la rapidez de propagación v disminuye. Como f se mantiene constante, λ = v / f también disminuye proporcionalmente."
    },
    {
      topic: "Fenómeno de Reflexión Ondulatoria",
      question: "12. ¿Qué fenómeno ondulatorio explica que una onda regrese al mismo medio tras chocar contra una superficie rígida, conservando su rapidez, frecuencia y longitud de onda?",
      options: [
        "Refracción",
        "Reflexión",
        "Difracción",
        "Dispersión cromática"
      ],
      answer: 1,
      explanation: "La reflexión es el rebote de una onda sobre una frontera hacia el mismo medio de procedencia, por lo que al no cambiar de medio, tanto v como f y λ mantienen sus magnitudes iniciales."
    },
    {
      topic: "Refracción de Ondas Sísmicas",
      question: "13. Una onda sísmica primaria pasa de una capa de roca sedimentaria donde viaja a 4,000 m/s con λ₁ = 800 m hacia una capa de roca ígnea más rígida donde su velocidad sube a 6,000 m/s. ¿Cuál será su nueva longitud de onda en la roca ígnea?",
      options: [
        "1,200 m",
        "533.3 m",
        "800 m",
        "1,600 m"
      ],
      answer: 0,
      explanation: "Calculamos la frecuencia invariante: f = 4,000 / 800 = 5 Hz. En el nuevo medio: λ₂ = v₂ / f = 6,000 m/s / 5 Hz = 1,200 m."
    },
    {
      topic: "Reflexión en Extremo Fijo",
      question: "14. Un pulso positivo (cresta) se propaga por una cuerda hacia una pared sólida donde el extremo está firmemente amarrado. ¿Cuál es la diferencia de fase entre el pulso incidente y el pulso reflejado?",
      options: [
        "0° (no hay cambio de fase).",
        "90° (cuarto de ciclo).",
        "180° (inversión completa del pulso).",
        "360° (ciclo completo sin inversión)."
      ],
      answer: 2,
      explanation: "La reflexión en un extremo fijo invierte la polaridad del pulso (una cresta se transforma en valle), lo que matemáticamente equivale a un desfase de 180° (π rad)."
    },
    {
      topic: "Cálculo de Masa mediante Densidad",
      question: "15. Un bloque sólido homogéneo de cobre tiene una densidad de 8.96 g/cm³. Si se funde y moldea para fabricar un cilindro cuyo volumen es de 250 cm³, ¿cuál será la masa de dicho cilindro?",
      options: [
        "2,240 g",
        "27.9 g",
        "896 g",
        "2,500 g"
      ],
      answer: 0,
      explanation: "De d = m / V despejamos la masa: m = d · V = (8.96 g/cm³)(250 cm³) = 2,240 g."
    },
    {
      topic: "Propiedades Intensivas de la Materia",
      question: "16. ¿Cuál de las siguientes listas contiene únicamente propiedades intensivas de la materia?",
      options: [
        "Masa, volumen y longitud.",
        "Densidad, temperatura de ebullición y conductividad eléctrica.",
        "Peso, densidad y calor absorbido.",
        "Volumen, densidad y masa."
      ],
      answer: 1,
      explanation: "Las propiedades intensivas no dependen de la cantidad de muestra analizada. La densidad, el punto de ebullición y la conductividad son iguales en 1 g o en 10 kg de la misma sustancia pura."
    },
    {
      topic: "Flotabilidad y Densidad Relativa",
      question: "17. Se tienen tres esferas macizas hechas de distintos materiales: Esfera 1 (m = 400 g, V = 500 cm³), Esfera 2 (m = 600 g, V = 300 cm³) y Esfera 3 (m = 250 g, V = 200 cm³). Si se colocan en un recipiente con agua (d_agua = 1.0 g/cm³), ¿cuál de ellas flotará en la superficie?",
      options: [
        "Únicamente la Esfera 1.",
        "Únicamente la Esfera 2.",
        "Las Esferas 2 y 3.",
        "Ninguna de las tres esferas flotará."
      ],
      answer: 0,
      explanation: "Calculamos cada densidad: d₁ = 400 / 500 = 0.80 g/cm³; d₂ = 600 / 300 = 2.0 g/cm³; d₃ = 250 / 200 = 1.25 g/cm³. Solo la Esfera 1 tiene densidad menor a 1.0 g/cm³, por lo que es la única que flota."
    },
    {
      topic: "Cálculo de Volumen en Fluidos",
      question: "18. Un tanque contiene 450 kg de aceite vegetal cuya densidad es de 900 kg/m³. ¿Qué volumen ocupa el aceite dentro del tanque?",
      options: [
        "0.50 m³",
        "2.00 m³",
        "405 m³",
        "0.45 m³"
      ],
      answer: 0,
      explanation: "Despejando el volumen de la fórmula de densidad: V = m / d = 450 kg / 900 kg/m³ = 0.50 m³."
    },
    {
      topic: "Invariancia de la Densidad",
      question: "19. Una barra uniforme de hierro de 1,200 g y 150 cm³ se funde junto con otra barra idéntica de hierro de las mismas dimensiones para formar una sola pieza grande de 2,400 g y 300 cm³. ¿Qué ocurre con la densidad de la pieza resultante respecto a las barras iniciales?",
      options: [
        "Se duplica a 16.0 g/cm³.",
        "Se mantiene exactamente igual en 8.0 g/cm³.",
        "Se reduce a la mitad (4.0 g/cm³).",
        "Aumenta en un 50%."
      ],
      answer: 1,
      explanation: "Al duplicarse tanto la masa (2,400 g) como el volumen (300 cm³), su cociente permanece invariante: d = 2,400 g / 300 cm³ = 8.0 g/cm³, confirmando que la densidad es una propiedad intensiva."
    },
    {
      topic: "Propiedades Extensivas de la Materia",
      question: "20. ¿Por qué la masa y el volumen se clasifican como propiedades extensivas de la materia?",
      options: [
        "Porque permiten identificar cualquier elemento químico sin importar el tamaño de la muestra.",
        "Porque su valor numérico es directamente proporcional a la cantidad de materia presente en el sistema.",
        "Porque nunca cambian aunque se agregue o retire materia del cuerpo.",
        "Porque solo se manifiestan en sustancias en estado gaseoso."
      ],
      answer: 1,
      explanation: "Las propiedades extensivas dependen de la extensión o cantidad de sustancia contenida en el objeto (si se duplica la cantidad de materia, se duplican la masa y el volumen)."
    }
  ];

  var questions = [];
  var currentQuestionIndex = 0;
  var selectedOptionIndex = null;
  var score = 0;

  var prefixes = ["A", "B", "C", "D"];

  var questionCounter = document.getElementById("questionCounter");
  var scoreCounter = document.getElementById("scoreCounter");
  var progressBar = document.getElementById("progressBar");
  var topicBadge = document.getElementById("topicBadge");
  var questionText = document.getElementById("questionText");
  var optionsContainer = document.getElementById("optionsContainer");
  var feedbackPanel = document.getElementById("feedbackPanel");
  var feedbackTitle = document.getElementById("feedbackTitle");
  var feedbackText = document.getElementById("feedbackText");
  var checkBtn = document.getElementById("checkBtn");
  var nextBtn = document.getElementById("nextBtn");
  var quizBody = document.getElementById("quizBody");
  var progressHeader = document.getElementById("progressHeader");
  var resultScreen = document.getElementById("resultScreen");
  var finalScore = document.getElementById("finalScore");
  var finalMessage = document.getElementById("finalMessage");
  var resultTitle = document.getElementById("resultTitle");
  var restartBtn = document.getElementById("restartBtn");

  function initQuiz() {
    questions = rawQuestions;
    currentQuestionIndex = 0;
    score = 0;
    resultScreen.style.display = "none";
    progressHeader.style.display = "flex";
    quizBody.style.display = "flex";
    loadQuestion();
  }

  function loadQuestion() {
    selectedOptionIndex = null;
    checkBtn.disabled = true;
    checkBtn.style.display = "inline-block";
    nextBtn.style.display = "none";
    feedbackPanel.style.display = "none";
    feedbackPanel.className = "feedback-panel";

    var q = questions[currentQuestionIndex];

    questionCounter.textContent = "Pregunta " + (currentQuestionIndex + 1) + " de " + questions.length;
    scoreCounter.textContent = "Aciertos: " + score;
    progressBar.style.width = (((currentQuestionIndex + 1) / questions.length) * 100) + "%";

    topicBadge.textContent = q.topic;
    questionText.innerHTML = q.question;

    optionsContainer.innerHTML = "";
    q.options.forEach(function(optText, index) {
      var btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerHTML = '<span class="option-prefix">' + prefixes[index] + '</span> <span>' + optText + '</span>';
      btn.addEventListener("click", function() { selectOption(index); });
      optionsContainer.appendChild(btn);
    });
  }

  function selectOption(index) {
    if (checkBtn.style.display === "none") return;
    selectedOptionIndex = index;
    var allOptions = optionsContainer.querySelectorAll(".option-btn");
    allOptions.forEach(function(btn, idx) {
      if (idx === index) {
        btn.classList.add("selected");
      } else {
        btn.classList.remove("selected");
      }
    });
    checkBtn.disabled = false;
  }

  function checkAnswer() {
    if (selectedOptionIndex === null) return;
    var q = questions[currentQuestionIndex];
    var allOptions = optionsContainer.querySelectorAll(".option-btn");

    allOptions.forEach(function(btn) { btn.disabled = true; });
    checkBtn.style.display = "none";
    nextBtn.style.display = "inline-block";

    var isCorrect = (selectedOptionIndex === q.answer);

    if (isCorrect) {
      score++;
      scoreCounter.textContent = "Aciertos: " + score;
      allOptions[selectedOptionIndex].classList.remove("selected");
      allOptions[selectedOptionIndex].classList.add("correct");

      feedbackPanel.className = "feedback-panel success";
      feedbackTitle.innerHTML = "🌊 ¡Excelente! Respuesta correcta";
      feedbackText.innerHTML = q.explanation;
    } else {
      allOptions[selectedOptionIndex].classList.remove("selected");
      allOptions[selectedOptionIndex].classList.add("incorrect");
      allOptions[q.answer].classList.add("correct");

      feedbackPanel.className = "feedback-panel error";
      feedbackTitle.innerHTML = "💡 Justificación física:";
      feedbackText.innerHTML = "<strong>Fundamento:</strong> " + q.explanation;
    }

    feedbackPanel.style.display = "block";
    nextBtn.focus();
  }

  function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < questions.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    quizBody.style.display = "none";
    progressHeader.style.display = "none";
    resultScreen.style.display = "block";

    finalScore.textContent = score + " / " + questions.length;

    var msg = "";
    if (score === 20) {
      resultTitle.textContent = "⚡ ¡Dominio Absoluto en Ondas y Materia!";
      msg = "¡Súper bien! Resolviste correctamente los 20 reactivos. Dominas velocidad de propagación, reflexión, refracción y propiedades intensivas y extensivas de la materia.";
    } else if (score >= 16) {
      resultTitle.textContent = "🌟 ¡Excelente Desempeño!";
      msg = "Tienes un nivel de preparación en física muy avanzado. Revisa detenidamente las diferencias entre reflexión en extremo fijo y libre para afinar los últimos detalles.";
    } else if (score >= 11) {
      resultTitle.textContent = "👍 ¡Buen Esfuerzo!";
      msg = "Vas por buen camino. Te sugerimos repasar la relación v = λ·f durante la refracción y los despejes de la fórmula de densidad (d = m / V).";
    } else {
      resultTitle.textContent = "💪 ¡A Seguir Estudiando!";
      msg = "¡No te desanimes! Refuerza las ecuaciones ondulatorias (frecuencia, período y longitud de onda) y la distinción entre propiedades intensivas y extensivas para volver a intentarlo.";
    }
    finalMessage.textContent = msg;
  }

  checkBtn.addEventListener("click", checkAnswer);
  nextBtn.addEventListener("click", nextQuestion);
  restartBtn.addEventListener("click", initQuiz);

  document.addEventListener("keydown", function(e) {
    if (resultScreen.style.display === "block") {
      if (e.key === "Enter") initQuiz();
      return;
    }

    var key = e.key.toUpperCase();
    if (["A", "1"].indexOf(key) !== -1) selectOption(0);
    else if (["B", "2"].indexOf(key) !== -1) selectOption(1);
    else if (["C", "3"].indexOf(key) !== -1) selectOption(2);
    else if (["D", "4"].indexOf(key) !== -1) selectOption(3);
    else if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (checkBtn.style.display !== "none" && !checkBtn.disabled) {
        checkAnswer();
      } else if (nextBtn.style.display !== "none") {
        nextQuestion();
      }
    }
  });

  window.addEventListener("DOMContentLoaded", initQuiz);
</script>

</body>
