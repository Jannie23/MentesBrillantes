<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simulador de Química: El Aire y su Composición</title>
  <style>
    @font-face {
      font-family: 'Mogena';
      src: url('https://fonts.cdnfonts.com/s/91216/MogenaRegular-8Mzx3.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #0284c7 35%, #1e3a8a 70%, #020617 100%);
      --card-bg: rgba(15, 23, 42, 0.90);
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;

      --neon-lime: #38bdf8;
      --pastel-lime: rgba(56, 189, 248, 0.15);
      --neon-emerald: #0ea5e9;
      --pastel-emerald: rgba(14, 165, 233, 0.15);
      --neon-cyan: #7dd3fc;
      --pastel-cyan: rgba(125, 211, 252, 0.15);
      --neon-green: #22c55e;
      --pastel-green: rgba(34, 197, 94, 0.2);
      --neon-red: #ef4444;
      --pastel-red: rgba(239, 68, 68, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Mogena', 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: clamp(6px, 1.5vw, 20px);
    }

    .quiz-container {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      width: 100%;
      max-width: 1250px;
      min-height: min(94vh, 900px);
      border-radius: clamp(16px, 2.5vw, 28px);
      border: clamp(2px, 0.3vw, 3px) solid var(--neon-lime);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      margin: auto;
      position: relative;
    }

    .progress-header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: clamp(12px, 2vw, 20px) clamp(16px, 3vw, 36px);
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: clamp(2px, 0.3vw, 3px) solid var(--neon-lime);
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .progress-info {
      display: flex;
      gap: clamp(10px, 2.5vw, 24px);
      flex-wrap: wrap;
      font-size: clamp(0.95rem, 1.2vw, 1.2rem);
      color: var(--neon-lime);
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    .shortcut-hint {
      font-size: 0.8rem;
      color: #bae6fd;
      font-weight: 600;
      display: none;
    }

    @media (min-width: 1024px) {
      .shortcut-hint {
        display: inline-block;
      }
    }

    .top-brand-logo img {
      height: clamp(34px, 5vw, 68px);
      width: auto;
      object-fit: contain;
      filter: contrast(1.15) drop-shadow(0 0 10px rgba(56, 189, 248, 0.5));
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .top-brand-logo img:hover {
      transform: scale(1.1) rotate(-2deg);
    }

    .progress-bar-bg {
      width: 100%;
      height: clamp(10px, 1.1vw, 15px);
      background-color: rgba(30, 41, 59, 0.8);
      border-radius: 30px;
      overflow: hidden;
      border: 1.5px solid rgba(56, 189, 248, 0.4);
    }

    .progress-bar-fill {
      height: 100%;
      width: 5%;
      background: linear-gradient(90deg, var(--neon-lime), var(--neon-emerald), var(--neon-cyan));
      border-radius: 30px;
      box-shadow: 0 0 15px var(--neon-lime);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .quiz-body {
      padding: clamp(16px, 2.5vw, 36px);
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 1150px;
      margin: 0 auto;
      width: 100%;
      overflow-y: auto;
    }

    .question-topic {
      align-self: flex-start;
      font-size: clamp(0.75rem, 0.9vw, 0.9rem);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 6px clamp(12px, 1.5vw, 18px);
      border-radius: 30px;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      font-weight: 900;
      margin-bottom: clamp(10px, 1.5vw, 18px);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    .question-text {
      font-size: clamp(1.05rem, 1.5vw, 1.45rem);
      line-height: 1.45;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: clamp(16px, 2vw, 24px);
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: clamp(10px, 1.3vw, 16px);
      margin-bottom: clamp(16px, 2vw, 22px);
    }

    .option-btn {
      background: rgba(30, 41, 59, 0.6);
      border: clamp(2px, 0.25vw, 3px) solid rgba(56, 189, 248, 0.35);
      border-radius: clamp(14px, 1.5vw, 18px);
      padding: clamp(12px, 1.4vw, 16px) clamp(14px, 1.6vw, 18px);
      text-align: left;
      font-size: clamp(0.95rem, 1.15vw, 1.1rem);
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: var(--text-main);
      font-weight: 600;
      line-height: 1.35;
      overflow-wrap: break-word;
      word-break: break-word;
      min-height: 56px;
      position: relative;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--neon-lime);
      background-color: var(--pastel-lime);
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
    }

    .option-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .option-btn.selected {
      border-color: var(--neon-lime);
      background-color: var(--pastel-lime);
      color: #bae6fd;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
      transform: scale(1.01);
    }

    .option-prefix {
      font-weight: 900;
      margin-right: 12px;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      width: clamp(34px, 3.2vw, 40px);
      height: clamp(34px, 3.2vw, 40px);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: clamp(0.85rem, 1vw, 1rem);
      color: #0f172a;
      border: 2px solid var(--neon-lime);
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .option-btn.selected .option-prefix {
      background: var(--neon-lime);
      border-color: #ffffff;
      color: #0f172a;
      transform: rotate(360deg);
    }

    .option-btn.correct {
      background-color: var(--pastel-green) !important;
      border-color: var(--neon-green) !important;
      color: #86efac !important;
      box-shadow: 0 0 22px rgba(34, 197, 94, 0.5) !important;
      animation: popSuccess 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .option-btn.correct .option-prefix {
      background: var(--neon-green);
      border-color: var(--neon-green);
      color: #0f172a;
    }

    .option-btn.incorrect {
      background-color: var(--pastel-red) !important;
      border-color: var(--neon-red) !important;
      color: #fca5a5 !important;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.5) !important;
      animation: shakeError 0.35s ease-in-out;
    }
    .option-btn.incorrect .option-prefix {
      background: var(--neon-red);
      border-color: var(--neon-red);
      color: #ffffff;
    }

    .feedback-panel {
      padding: clamp(14px, 1.8vw, 20px);
      border-radius: clamp(14px, 1.5vw, 18px);
      margin-bottom: clamp(14px, 1.8vw, 20px);
      display: none;
      animation: slideUp 0.3s ease;
      line-height: 1.5;
      font-size: clamp(0.9rem, 1.05vw, 1rem);
    }

    .feedback-panel.success {
      background-color: rgba(34, 197, 94, 0.15);
      border: clamp(2px, 0.25vw, 3px) solid var(--neon-green);
      color: #dcfce7;
    }

    .feedback-panel.error {
      background-color: rgba(239, 68, 68, 0.15);
      border: clamp(2px, 0.25vw, 3px) solid var(--neon-red);
      color: #ffe4e6;
    }

    .feedback-title {
      font-weight: 900;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(1rem, 1.15vw, 1.15rem);
    }

    .quiz-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 4px;
    }

    .action-btn {
      padding: clamp(12px, 1.4vw, 16px) clamp(24px, 2.8vw, 34px);
      font-size: clamp(0.95rem, 1.15vw, 1.1rem);
      font-weight: 800;
      border: none;
      border-radius: clamp(12px, 1.2vw, 16px);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      letter-spacing: 0.5px;
      width: auto;
      min-height: 48px;
    }

    .btn-check {
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
    }
    .btn-check:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.15);
    }
    .btn-check:disabled {
      background: #1e293b;
      color: #475569;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-next {
      background: linear-gradient(135deg, var(--neon-emerald), var(--neon-cyan));
      color: #0f172a;
      display: none;
      box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4);
    }
    .btn-next:hover {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.15);
    }

    .result-screen {
      display: none;
      text-align: center;
      padding: clamp(24px, 4vw, 50px) clamp(14px, 3vw, 24px);
      margin: auto;
      max-width: 800px;
      animation: slideUp 0.4s ease;
    }

    .result-title {
      font-size: clamp(1.8rem, 3.2vw, 2.5rem);
      color: var(--neon-lime);
      font-weight: 900;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
    }

    .result-score {
      font-size: clamp(3.5rem, 7vw, 5rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald), var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: clamp(10px, 1.8vw, 18px) 0;
      filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.6));
    }

    .result-message {
      font-size: clamp(1rem, 1.3vw, 1.2rem);
      color: var(--text-main);
      margin-bottom: clamp(20px, 2.8vw, 32px);
      line-height: 1.5;
      font-weight: 600;
    }

    .btn-restart {
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      padding: clamp(14px, 1.6vw, 18px) clamp(30px, 3.5vw, 44px);
      font-size: clamp(1rem, 1.2vw, 1.15rem);
      box-shadow: 0 8px 25px rgba(56, 189, 248, 0.5);
    }
    .btn-restart:hover {
      transform: scale(1.06);
      filter: brightness(1.15);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popSuccess {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1.01); }
    }

    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    @media (max-width: 580px) {
      .quiz-footer {
        flex-direction: column;
      }
      .action-btn {
        width: 100%;
        text-align: center;
      }
      .options-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <div class="progress-header" id="progressHeader">
    <div class="header-top">
      <div class="progress-info">
        <span id="questionCounter">Pregunta 1 de 20</span>
        <span id="scoreCounter">Aciertos: 0</span>
        <span class="shortcut-hint">💡 Usa las teclas [A, B, C, D] y [Enter]</span>
      </div>
      <div class="top-brand-logo">
        <img src="Logo_MB.png" alt="Logo ECOEMS">
      </div>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </div>

  <div class="quiz-body" id="quizBody">
    <span class="question-topic" id="topicBadge">Química General: El Aire y su Composición</span>
    <h2 class="question-text" id="questionText">Cargando reactivo...</h2>

    <div class="options-grid" id="optionsContainer"></div>

    <div class="feedback-panel" id="feedbackPanel">
      <div class="feedback-title" id="feedbackTitle"></div>
      <div id="feedbackText"></div>
    </div>

    <div class="quiz-footer">
      <button class="action-btn btn-check" id="checkBtn" disabled>Comprobar respuesta</button>
      <button class="action-btn btn-next" id="nextBtn">Siguiente pregunta ➔</button>
    </div>
  </div>

  <div class="result-screen" id="resultScreen">
    <h2 class="result-title" id="resultTitle">¡Evaluación Finalizada!</h2>
    <div class="result-score" id="finalScore">0 / 20</div>
    <p class="result-message" id="finalMessage">Mensaje de desempeño</p>
    <button class="action-btn btn-restart" id="restartBtn">↻ Reiniciar simulador</button>
  </div>
</div>

<script>
  var rawQuestions = [
    {
      topic: "Naturaleza del Aire Atmosférico",
      question: "1. ¿Cuál de las siguientes características demuestra experimentalmente que el aire atmosférico es una mezcla homogénea y no un compuesto químico?",
      options: [
        "Todos sus componentes poseen exactamente el mismo punto de fusión y ebullición.",
        "Sus proporciones pueden variar ligeramente según la altitud o humedad y sus gases se separan por métodos físicos.",
        "Sus componentes están unidos mediante enlaces covalentes polares muy estables.",
        "Al combinarse nitrógeno y oxígeno en la atmósfera se libera continuamente energía luminosa."
      ],
      answer: 1,
      explanation: "A diferencia de un compuesto químico (que tiene composición fija y requiere métodos químicos para descomponerse), una mezcla presenta composición variable y sus componentes conservan su identidad física, permitiendo su separación mediante procesos físicos."
    },
    {
      topic: "Separación Industrial de Gases",
      question: "2. En la industria química, ¿qué procedimiento físico se emplea para obtener nitrógeno (N₂) y oxígeno (O₂) de alta pureza a partir del aire atmosférico?",
      options: [
        "Electrólisis del aire a altas temperaturas.",
        "Filtración a través de membranas de papel poroso.",
        "Licuefacción seguida de destilación fraccionada.",
        "Decantación por diferencia de solubilidad en agua."
      ],
      answer: 2,
      explanation: "El aire se enfría y comprime hasta licuarlo (aire líquido) y posteriormente se somete a destilación fraccionada, aprovechando los diferentes puntos de ebullición del nitrógeno (-195.8 °C) y del oxígeno (-183.0 °C)."
    },
    {
      topic: "Gases Nobles en la Atmósfera",
      question: "3. ¿Cuál es el gas noble más abundante en la atmósfera terrestre, representando aproximadamente el 0.93% del volumen del aire seco?",
      options: [
        "Helio (He)",
        "Neón (Ne)",
        "Argón (Ar)",
        "Kriptón (Kr)"
      ],
      answer: 2,
      explanation: "El argón (Ar) es el tercer componente más abundante del aire seco (después del N₂ y el O₂), constituyendo cerca del 0.93% del volumen total."
    },
    {
      topic: "Función del Nitrógeno Molecular",
      question: "4. ¿Qué papel desempeña principalmente el nitrógeno molecular (N₂) dentro de la mezcla gaseosa del aire durante los procesos ordinarios de combustión?",
      options: [
        "Actúa como el principal agente oxidante que inicia la flama.",
        "Funciona como un gas diluyente inerte que modera la velocidad de las reacciones de combustión.",
        "Se convierte espontáneamente en dióxido de carbono al entrar en contacto con el fuego.",
        "Absorbe toda la radiación infrarroja impidiendo que ocurra oxidación."
      ],
      answer: 1,
      explanation: "Debido a la gran estabilidad de su triple enlace (N≡N), el nitrógeno es poco reactivo a temperaturas ordinarias y actúa diluyendo al oxígeno (21%), evitando que las combustiones ocurran de forma violenta e incontrolada."
    },
    {
      topic: "Redistribución de Fracciones por Humedad",
      question: "5. Si una masa de aire seco absorbe vapor de agua proveniente de la evaporación de un lago hasta alcanzar un 2% de contenido de H₂O(g), ¿qué ocurre con el porcentaje en volumen del nitrógeno en esa muestra?",
      options: [
        "Aumenta exactamente al 80%.",
        "Permanece inalterado en exactamente 78.00%.",
        "Disminuye ligeramente por debajo del 78% al redistribuirse las fracciones de la mezcla.",
        "Se reduce a la mitad porque el agua reacciona con el nitrógeno."
      ],
      answer: 2,
      explanation: "Al incorporarse un nuevo componente gaseoso (H₂O) a la mezcla, la suma total debe seguir siendo 100%, por lo que las fracciones porcentuales de todos los gases secos (N₂, O₂, Ar) disminuyen proporcionalmente (78% × 0.98 = 76.44%)."
    },
    {
      topic: "Compuesto vs Mezcla Física",
      question: "6. ¿Cuál de las siguientes opciones describe correctamente la diferencia entre una molécula de dióxido de carbono (CO₂) y el aire atmosférico?",
      options: [
        "El CO₂ es un elemento químico y el aire es un compuesto.",
        "El CO₂ es un compuesto químico con proporción fija de átomos, mientras que el aire es una mezcla física de diversas sustancias.",
        "Ambos son mezclas homogéneas que pueden separarse por centrifugación.",
        "El aire posee una fórmula química definida y el CO₂ carece de ella."
      ],
      answer: 1,
      explanation: "El CO₂ es una sustancia pura (compuesto) formada por carbono y oxígeno unidos químicamente en relación fija 1:2; el aire es una mezcla física de múltiples gases independientes."
    },
    {
      topic: "Combustión en Sistemas Cerrados",
      question: "7. Al introducir una vela encendida dentro de un frasco cerrado con aire, la flama se apaga después de unos segundos. ¿Qué ocurre con la composición del aire dentro del frasco?",
      options: [
        "Desaparece por completo el nitrógeno y aumenta el argón.",
        "Disminuye la concentración de O₂ y aumenta la proporción de CO₂ y vapor de agua.",
        "Todo el aire se transforma en hidrógeno gaseoso.",
        "La proporción de O₂ se incrementa hasta alcanzar el 78%."
      ],
      answer: 1,
      explanation: "La combustión consume oxígeno (O₂) como reactivo comburente y produce dióxido de carbono (CO₂) y vapor de agua (H₂O), alterando la composición porcentual de la mezcla encerrada."
    },
    {
      topic: "Clasificación de Mezclas Homogéneas",
      question: "8. ¿Por qué el aire se clasifica específicamente como una mezcla homogénea y no como una mezcla heterogénea?",
      options: [
        "Porque sus gases se separan en capas visibles según su color.",
        "Porque presenta una sola fase gaseosa uniforme donde no se distinguen sus componentes a simple vista ni al microscopio.",
        "Porque todos sus componentes tienen la misma masa molar.",
        "Porque es imposible separar sus componentes por ningún medio."
      ],
      answer: 1,
      explanation: "En condiciones de equilibrio, los gases son miscibles entre sí en cualquier proporción formando una única fase uniforme con propiedades intensivas idénticas en cualquier punto de la muestra."
    },
    {
      topic: "Teoría Cinético-Molecular y Presión",
      question: "9. ¿Qué propiedad física fundamental permite que el oxígeno y el nitrógeno del aire ejerzan presión sobre las paredes de un neumático?",
      options: [
        "La atracción gravitacional exclusiva entre las moléculas de argón.",
        "El movimiento caótico continuo y las colisiones elásticas de las moléculas gaseosas contra las paredes del recipiente.",
        "La formación de enlaces iónicos entre el gas y el caucho.",
        "La alta viscosidad del vapor de agua atmosférico."
      ],
      answer: 1,
      explanation: "De acuerdo con la teoría cinético-molecular, la presión de una mezcla gaseosa es el resultado de la suma de los choques moleculares de todos sus gases constituyentes contra las paredes del contenedor."
    },
    {
      topic: "Gases de Efecto Invernadero",
      question: "10. ¿Cuál de los siguientes gases presentes en el aire atmosférico es el principal responsable del efecto invernadero natural debido a su capacidad para absorber radiación infrarroja?",
      options: [
        "Nitrógeno (N₂)",
        "Argón (Ar)",
        "Dióxido de carbono (CO₂)",
        "Oxígeno (O₂)"
      ],
      answer: 2,
      explanation: "Las moléculas triatómicas asimétricas o con momentos dipolares inducibles como el CO₂ y el H₂O absorben eficazmente la radiación infrarroja emitida por la superficie terrestre, a diferencia de los gases diatómicos homonucleares (N₂, O₂) y monoatómicos (Ar)."

    {

      question: "11. En un laboratorio se almacena un cilindro con 800 L de aire seco. Considerando que el nitrógeno constituye el 78% del volumen, ¿qué volumen de nitrógeno contiene el cilindro?",
      options: [
        "624 L",
        "168 L",
        "584 L",
        "640 L"

    {

      question: "12. Una cámara hiperbárica opera a una presión total de 250 kPa utilizando aire seco (21% de oxígeno). De acuerdo con la Ley de Dalton, ¿cuál es la presión parcial del oxígeno dentro de la cámara?",
      options: [
        "21.0 kPa",
        "52.5 kPa",
        "195.0 kPa",
        "42.0 kPa"

      question: "13. Un reactor contiene 150 mol de aire seco. Si el 78% corresponde a N₂ y el 1% a otros gases, ¿cuántos moles de oxígeno (O₂) hay en el reactor?",
      options: [
        "31.5 mol",
        "117.0 mol",
        "1.5 mol",
        "21.0 mol"
      ],

      options: [
        "46.8 kPa",
        "12.6 kPa",
        "78.0 kPa",
        "52.2 kPa"
      ],
      answer: 0,
      explanation: "P_N₂ = P_total × X_N₂ = 60 kPa × 0.78 = 46.8 kPa."

    {

      question: "15. Una habitación cerrada contiene un volumen total de 40 m³ de aire seco. ¿Cuántos metros cúbicos de oxígeno (O₂) se encuentran en la habitación?",

        "8.4 m³",
        "31.2 m³",

      explanation: "Despejando el volumen total de V_O₂ = V_total × 0.21: V_total = 63 L / 0.21 = 300 L."

      options: [

    {
      topic: "Presión Parcial de Gases Minoritarios (CO₂)",

      options: [
        "0.04 kPa",
        "4.00 kPa",

      answer: 0,
      explanation: "Un porcentaje de 0.04% equivale a una fracción molar de X_CO₂ = 0.04 / 100 = 0.0004. Multiplicando por la presión total: P_CO₂ = 100 kPa × 0.0004 = 0.04 kPa."

  var questions = [];
  var currentQuestionIndex = 0;
  var selectedOptionIndex = null;
  var score = 0;

  var prefixes = ["A", "B", "C", "D"];

  var questionCounter = document.getElementById("questionCounter");
  var scoreCounter = document.getElementById("scoreCounter");
  var progressBar = document.getElementById("progressBar");
  var topicBadge = document.getElementById("topicBadge");
  var questionText = document.getElementById("questionText");
  var optionsContainer = document.getElementById("optionsContainer");
  var feedbackPanel = document.getElementById("feedbackPanel");
  var feedbackTitle = document.getElementById("feedbackTitle");
  var feedbackText = document.getElementById("feedbackText");
  var checkBtn = document.getElementById("checkBtn");
  var nextBtn = document.getElementById("nextBtn");
  var quizBody = document.getElementById("quizBody");
  var progressHeader = document.getElementById("progressHeader");
  var resultScreen = document.getElementById("resultScreen");
  var finalScore = document.getElementById("finalScore");
  var finalMessage = document.getElementById("finalMessage");
  var resultTitle = document.getElementById("resultTitle");
  var restartBtn = document.getElementById("restartBtn");

  function initQuiz() {
    questions = rawQuestions;
    currentQuestionIndex = 0;
    score = 0;
    resultScreen.style.display = "none";
    progressHeader.style.display = "flex";
    quizBody.style.display = "flex";
    loadQuestion();
  }

  function loadQuestion() {
    selectedOptionIndex = null;
    checkBtn.disabled = true;
    checkBtn.style.display = "inline-block";
    nextBtn.style.display = "none";
    feedbackPanel.style.display = "none";
    feedbackPanel.className = "feedback-panel";

    var q = questions[currentQuestionIndex];

    questionCounter.textContent = "Pregunta " + (currentQuestionIndex + 1) + " de " + questions.length;
    scoreCounter.textContent = "Aciertos: " + score;
    progressBar.style.width = (((currentQuestionIndex + 1) / questions.length) * 100) + "%";

    topicBadge.textContent = q.topic;
    questionText.innerHTML = q.question;

    optionsContainer.innerHTML = "";
    q.options.forEach(function(optText, index) {
      var btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerHTML = '<span class="option-prefix">' + prefixes[index] + '</span> <span>' + optText + '</span>';
      btn.addEventListener("click", function() { selectOption(index); });
      optionsContainer.appendChild(btn);
    });
  }

  function selectOption(index) {
    if (checkBtn.style.display === "none") return;
    selectedOptionIndex = index;
    var allOptions = optionsContainer.querySelectorAll(".option-btn");
    allOptions.forEach(function(btn, idx) {
      if (idx === index) {
        btn.classList.add("selected");
      } else {
        btn.classList.remove("selected");
      }
    });
    checkBtn.disabled = false;
  }

  function checkAnswer() {
    if (selectedOptionIndex === null) return;
    var q = questions[currentQuestionIndex];
    var allOptions = optionsContainer.querySelectorAll(".option-btn");

    allOptions.forEach(function(btn) { btn.disabled = true; });
    checkBtn.style.display = "none";
    nextBtn.style.display = "inline-block";

    var isCorrect = (selectedOptionIndex === q.answer);

    if (isCorrect) {
      score++;
      scoreCounter.textContent = "Aciertos: " + score;
      allOptions[selectedOptionIndex].classList.remove("selected");
      allOptions[selectedOptionIndex].classList.add("correct");

      feedbackPanel.className = "feedback-panel success";
      feedbackTitle.innerHTML = "🌬️ ¡Excelente! Respuesta correcta";
      feedbackText.innerHTML = q.explanation;
    } else {
      allOptions[selectedOptionIndex].classList.remove("selected");
      allOptions[selectedOptionIndex].classList.add("incorrect");
      allOptions[q.answer].classList.add("correct");

      feedbackPanel.className = "feedback-panel error";
      feedbackTitle.innerHTML = "💡 Justificación química:";
      feedbackText.innerHTML = "<strong>Fundamento técnico:</strong> " + q.explanation;
    }

    feedbackPanel.style.display = "block";
    nextBtn.focus();
  }

  function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < questions.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    quizBody.style.display = "none";
    progressHeader.style.display = "none";
    resultScreen.style.display = "block";

    finalScore.textContent = score + " / " + questions.length;

    var msg = "";
    if (score === 20) {
      resultTitle.textContent = "💨 ¡Dominio Absoluto en Química Atmosférica!";
      msg = "¡Súper bien! Resolviste correctamente los 20 reactivos. Dominas la composición del aire seco, la Ley de Dalton, destilación fraccionada y cálculos estequiométricos de mezclas gaseosas.";
    } else if (score >= 16) {
      resultTitle.textContent = "🌟 ¡Excelente Desempeño!";
      msg = "Tienes un nivel de preparación en química muy avanzado. Revisa los cálculos de fracciones molares minoritarias para afinar los últimos detalles.";
    } else if (score >= 11) {
      resultTitle.textContent = "👍 ¡Buen Esfuerzo!";
      msg = "Vas por buen camino. Te sugerimos repasar la Ley de Dalton de las presiones parciales y las diferencias entre mezcla homogénea y compuesto.";
    } else {
      resultTitle.textContent = "💪 ¡A Seguir Estudiando!";
      msg = "¡No te desanimes! Refuerza los porcentajes de composición atmosférica (78% N₂, 21% O₂, 0.93% Ar) y los métodos físicos de separación para volver a intentarlo.";
    }
    finalMessage.textContent = msg;
  }

  checkBtn.addEventListener("click", checkAnswer);
  nextBtn.addEventListener("click", nextQuestion);
  restartBtn.addEventListener("click", initQuiz);

  document.addEventListener("keydown", function(e) {
    if (resultScreen.style.display === "block") {
      if (e.key === "Enter") initQuiz();
      return;
    }

    var key = e.key.toUpperCase();
    if (["A", "1"].indexOf(key) !== -1) selectOption(0);
    else if (["B", "2"].indexOf(key) !== -1) selectOption(1);
    else if (["C", "3"].indexOf(key) !== -1) selectOption(2);
    else if (["D", "4"].indexOf(key) !== -1) selectOption(3);
    else if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (checkBtn.style.display !== "none" && !checkBtn.disabled) {
        checkAnswer();
      } else if (nextBtn.style.display !== "none") {
        nextQuestion();
      }
    }
  });

  window.addEventListener("DOMContentLoaded", initQuiz);
</script>

</body>
</html>
