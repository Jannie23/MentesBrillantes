<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simulador de Matemáticas: Asíntotas Trigonométricas</title>
  <style>
    @font-face {
      font-family: 'Mogena';
      src: url('https://fonts.cdnfonts.com/s/91216/MogenaRegular-8Mzx3.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #0369a1 35%, #0f172a 70%, #020617 100%);
      --card-bg: rgba(15, 23, 42, 0.90);
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;

      --neon-lime: #38bdf8;
      --pastel-lime: rgba(56, 189, 248, 0.15);
      --neon-emerald: #0284c7;
      --pastel-emerald: rgba(2, 132, 199, 0.15);
      --neon-cyan: #818cf8;
      --pastel-cyan: rgba(129, 140, 248, 0.15);
      --neon-green: #22c55e;
      --pastel-green: rgba(34, 197, 94, 0.2);
      --neon-red: #ef4444;
      --pastel-red: rgba(239, 68, 68, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Mogena', 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: clamp(6px, 1.5vw, 20px);
    }

    .quiz-container {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      width: 100%;
      max-width: 1250px;
      min-height: min(94vh, 900px);
      border-radius: clamp(16px, 2.5vw, 28px);
      border: clamp(2px, 0.3vw, 3px) solid var(--neon-lime);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      margin: auto;
      position: relative;
    }

    .progress-header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: clamp(12px, 2vw, 20px) clamp(16px, 3vw, 36px);
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: clamp(2px, 0.3vw, 3px) solid var(--neon-lime);
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .progress-info {
      display: flex;
      gap: clamp(10px, 2.5vw, 24px);
      flex-wrap: wrap;
      font-size: clamp(0.95rem, 1.2vw, 1.2rem);
      color: var(--neon-lime);
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    .shortcut-hint {
      font-size: 0.8rem;
      color: #93c5fd;
      font-weight: 600;
      display: none;
    }

    @media (min-width: 1024px) {
      .shortcut-hint {
        display: inline-block;
      }
    }

    .top-brand-logo img {
      height: clamp(34px, 5vw, 68px);
      width: auto;
      object-fit: contain;
      filter: contrast(1.15) drop-shadow(0 0 10px rgba(56, 189, 248, 0.5));
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .top-brand-logo img:hover {
      transform: scale(1.1) rotate(-2deg);
    }

    .progress-bar-bg {
      width: 100%;
      height: clamp(10px, 1.1vw, 15px);
      background-color: rgba(30, 41, 59, 0.8);
      border-radius: 30px;
      overflow: hidden;
      border: 1.5px solid rgba(56, 189, 248, 0.4);
    }

    .progress-bar-fill {
      height: 100%;
      width: 5%;
      background: linear-gradient(90deg, var(--neon-lime), var(--neon-emerald), var(--neon-cyan));
      border-radius: 30px;
      box-shadow: 0 0 15px var(--neon-lime);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .quiz-body {
      padding: clamp(16px, 2.5vw, 36px);
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 1150px;
      margin: 0 auto;
      width: 100%;
      overflow-y: auto;
    }

    .question-topic {
      align-self: flex-start;
      font-size: clamp(0.75rem, 0.9vw, 0.9rem);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 6px clamp(12px, 1.5vw, 18px);
      border-radius: 30px;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      font-weight: 900;
      margin-bottom: clamp(10px, 1.5vw, 18px);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    .question-text {
      font-size: clamp(1.05rem, 1.5vw, 1.45rem);
      line-height: 1.45;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: clamp(16px, 2vw, 24px);
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: clamp(10px, 1.3vw, 16px);
      margin-bottom: clamp(16px, 2vw, 22px);
    }

    .option-btn {
      background: rgba(30, 41, 59, 0.6);
      border: clamp(2px, 0.25vw, 3px) solid rgba(56, 189, 248, 0.35);
      border-radius: clamp(14px, 1.5vw, 18px);
      padding: clamp(12px, 1.4vw, 16px) clamp(14px, 1.6vw, 18px);
      text-align: left;
      font-size: clamp(0.95rem, 1.15vw, 1.1rem);
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: var(--text-main);
      font-weight: 600;
      line-height: 1.35;
      overflow-wrap: break-word;
      word-break: break-word;
      min-height: 56px;
      position: relative;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--neon-lime);
      background-color: var(--pastel-lime);
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
    }

    .option-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .option-btn.selected {
      border-color: var(--neon-lime);
      background-color: var(--pastel-lime);
      color: #7dd3fc;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
      transform: scale(1.01);
    }

    .option-prefix {
      font-weight: 900;
      margin-right: 12px;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      width: clamp(34px, 3.2vw, 40px);
      height: clamp(34px, 3.2vw, 40px);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: clamp(0.85rem, 1vw, 1rem);
      color: #0f172a;
      border: 2px solid var(--neon-lime);
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .option-btn.selected .option-prefix {
      background: var(--neon-lime);
      border-color: #ffffff;
      color: #0f172a;
      transform: rotate(360deg);
    }

    .option-btn.correct {
      background-color: var(--pastel-green) !important;
      border-color: var(--neon-green) !important;
      color: #86efac !important;
      box-shadow: 0 0 22px rgba(34, 197, 94, 0.5) !important;
      animation: popSuccess 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .option-btn.correct .option-prefix {
      background: var(--neon-green);
      border-color: var(--neon-green);
      color: #0f172a;
    }

    .option-btn.incorrect {
      background-color: var(--pastel-red) !important;
      border-color: var(--neon-red) !important;
      color: #fca5a5 !important;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.5) !important;
      animation: shakeError 0.35s ease-in-out;
    }
    .option-btn.incorrect .option-prefix {
      background: var(--neon-red);
      border-color: var(--neon-red);
      color: #ffffff;
    }

    .feedback-panel {
      padding: clamp(14px, 1.8vw, 20px);
      border-radius: clamp(14px, 1.5vw, 18px);
      margin-bottom: clamp(14px, 1.8vw, 20px);
      display: none;
      animation: slideUp 0.3s ease;
      line-height: 1.5;
      font-size: clamp(0.9rem, 1.05vw, 1rem);
    }

    .feedback-panel.success {
      background-color: rgba(34, 197, 94, 0.15);
      border: clamp(2px, 0.25vw, 3px) solid var(--neon-green);
      color: #dcfce7;
    }

    .feedback-panel.error {
      background-color: rgba(239, 68, 68, 0.15);
      border: clamp(2px, 0.25vw, 3px) solid var(--neon-red);
      color: #ffe4e6;
    }

    .feedback-title {
      font-weight: 900;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(1rem, 1.15vw, 1.15rem);
    }

    .quiz-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 4px;
    }

    .action-btn {
      padding: clamp(12px, 1.4vw, 16px) clamp(24px, 2.8vw, 34px);
      font-size: clamp(0.95rem, 1.15vw, 1.1rem);
      font-weight: 800;
      border: none;
      border-radius: clamp(12px, 1.2vw, 16px);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      letter-spacing: 0.5px;
      width: auto;
      min-height: 48px;
    }

    .btn-check {
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
    }
    .btn-check:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.15);
    }
    .btn-check:disabled {
      background: #1e293b;
      color: #475569;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-next {
      background: linear-gradient(135deg, var(--neon-emerald), var(--neon-cyan));
      color: #0f172a;
      display: none;
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
    }
    .btn-next:hover {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.15);
    }

    .result-screen {
      display: none;
      text-align: center;
      padding: clamp(24px, 4vw, 50px) clamp(14px, 3vw, 24px);
      margin: auto;
      max-width: 800px;
      animation: slideUp 0.4s ease;
    }

    .result-title {
      font-size: clamp(1.8rem, 3.2vw, 2.5rem);
      color: var(--neon-lime);
      font-weight: 900;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
    }

    .result-score {
      font-size: clamp(3.5rem, 7vw, 5rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald), var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: clamp(10px, 1.8vw, 18px) 0;
      filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.6));
    }

    .result-message {
      font-size: clamp(1rem, 1.3vw, 1.2rem);
      color: var(--text-main);
      margin-bottom: clamp(20px, 2.8vw, 32px);
      line-height: 1.5;
      font-weight: 600;
    }

    .btn-restart {
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      padding: clamp(14px, 1.6vw, 18px) clamp(30px, 3.5vw, 44px);
      font-size: clamp(1rem, 1.2vw, 1.15rem);
      box-shadow: 0 8px 25px rgba(56, 189, 248, 0.5);
    }
    .btn-restart:hover {
      transform: scale(1.06);
      filter: brightness(1.15);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popSuccess {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1.01); }
    }

    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    @media (max-width: 580px) {
      .quiz-footer {
        flex-direction: column;
      }
      .action-btn {
        width: 100%;
        text-align: center;
      }
      .options-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <div class="progress-header" id="progressHeader">
    <div class="header-top">
      <div class="progress-info">
        <span id="questionCounter">Pregunta 1 de 20</span>
        <span id="scoreCounter">Aciertos: 0</span>
        <span class="shortcut-hint">💡 Usa las teclas [A, B, C, D] y [Enter]</span>
      </div>
      <div class="top-brand-logo">
        <img src="Logo_MB.png" alt="Logo ECOEMS">
      </div>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </div>

  <div class="quiz-body" id="quizBody">
    <span class="question-topic" id="topicBadge">Asíntotas Trigonométricas</span>
    <h2 class="question-text" id="questionText">Cargando reactivo...</h2>

    <div class="options-grid" id="optionsContainer"></div>

    <div class="feedback-panel" id="feedbackPanel">
      <div class="feedback-title" id="feedbackTitle"></div>
      <div id="feedbackText"></div>
    </div>

    <div class="quiz-footer">
      <button class="action-btn btn-check" id="checkBtn" disabled>Comprobar respuesta</button>
      <button class="action-btn btn-next" id="nextBtn">Siguiente pregunta ➔</button>
    </div>
  </div>

  <div class="result-screen" id="resultScreen">
    <h2 class="result-title" id="resultTitle">¡Evaluación Finalizada!</h2>
    <div class="result-score" id="finalScore">0 / 20</div>
    <p class="result-message" id="finalMessage">Mensaje de desempeño</p>
    <button class="action-btn btn-restart" id="restartBtn">↻ Reiniciar simulador</button>
  </div>
</div>

<script>
  var rawQuestions = [
    {
      topic: "Asíntotas Trigonométricas",
      question: "1. ¿En qué condición fundamental se produce una asíntota vertical en la función f(x) = tan(x)?",
      options: [
        "Cuando sen(x) = 1",
        "Cuando cos(x) = 0",
        "Cuando sen(x) = 0",
        "Cuando cos(x) = 1"
      ],
      answer: 1,
      explanation: "La tangente se define como sen(x)/cos(x). Se genera una asíntota vertical cuando el denominador es cero, es decir, cos(x) = 0."
    },
    {
      topic: "Asíntotas Trigonométricas",
      question: "2. Determina la primera asíntota vertical positiva para la función f(x) = tan(4x).",
      options: [
        "x = π/8",
        "x = π/4",
        "x = π/2",
        "x = 3π/8"
      ],
      answer: 0,
      explanation: "Se plantea 4x = π/2 (para k = 0). Despejando x, obtenemos x = (π/2)/4 = π/8."
    },
    {
      topic: "Asíntotas Trigonométricas",
      question: "3. ¿Cuál es la expresión general de las asíntotas para la función cosecante básica, f(x) = csc(x)?",
      options: [
        "x = π/2 + kπ",
        "x = 2kπ",
        "x = kπ",
        "x = (2k+1)π/4"
      ],
      answer: 2,
      explanation: "Como csc(x) = 1/sen(x), sus asíntotas ocurren cuando sen(x) = 0, lo cual sucede exactamente en los múltiplos enteros de π (x = kπ)."
    },
    {
      topic: "Asíntotas Trigonométricas",
      question: "4. Calcula la primera asíntota vertical positiva de g(x) = tan(x - π/4).",
      options: [
        "x = π/4",
        "x = 3π/4",
        "x = 5π/4",
        "x = π/2"
      ],
      answer: 1,
      explanation: "Planteamos x - π/4 = π/2. Al despejar: x = π/2 + π/4 = 2π/4 + π/4 = 3π/4."
    },
    {
      topic: "Asíntotas Trigonométricas",
      question: "5. Al comparar f(x) = tan(x) con g(x) = tan(5x), ¿cuál es la distancia entre asíntotas consecutivas de g(x)?",
      options: [
        "π",
        "5π",
        "π/5",
        "2π/5"
      ],
      answer: 2,
      explanation: "El factor b = 5 comprime horizontalmente la gráfica. La distancia entre asíntotas es igual al período de la función: T = π/b = π/5."
    },
    {
      topic: "Asíntotas Trigonométricas",
      question: "6. ¿Cuál de las siguientes ecuaciones permite hallar las asíntotas de f(x) = cot(x)?",
      options: [
        "sen(x) = 0",
        "cos(x) = 0",
        "tan(x) = 0",
        "cos(x) = 1"
      ],
      answer: 0,
      explanation: "Como cot(x) = cos(x)/sen(x), las asíntotas ocurren donde el denominador se anula: sen(x) = 0."
    },
    {
      topic: "Asíntotas Trigonométricas",
      question: "7. Encuentra el planteamiento correcto para despejar las asíntotas de h(x) = tan(3x + π/3).",
      options: [
        "3x + π/3 = kπ",
        "3x + π/3 = π/2 + kπ",
        "3x = π/2 + kπ",
        "3x + π/3 = 2kπ"
      ],
      answer: 1,
      explanation: "El argumento completo de la tangente debe igualarse a la condición general de discontinuidad del coseno: π/2 + kπ."
    },
    {
      topic: "Asíntotas Trigonométricas",
      question: "8. Halla la primera asíntota positiva para la función secante f(x) = sec(2x).",
      options: [
        "x = π/4",
        "x = π/2",
        "x = π",
        "x = 3π/4"
      ],
      answer: 0,
      explanation: "sec(2x) = 1/cos(2x). Asíntotas cuando cos(2x) = 0 ⇒ 2x = π/2 ⇒ x = π/4."
    },
    {
      topic: "Asíntotas Trigonométricas",
      question: "9. ¿Cuál es la solución general para las asíntotas de f(x) = tan(x/2)?",
      options: [
        "x = π/4 + kπ/2",
        "x = π + 2kπ",
        "x = π/2 + kπ",
        "x = 2π + kπ"
      ],
      answer: 1,
      explanation: "Igualamos el argumento: x/2 = π/2 + kπ. Multiplicando todo por 2 se obtiene x = π + 2kπ."
    },
    {
      topic: "Asíntotas Trigonométricas",
      question: "10. ¿Cuál de los siguientes valores de x representa una asíntota vertical para f(x) = csc(3x)?",
      options: [
        "x = π/6",
        "x = π/3",
        "x = 5π/6",
        "x = 2π/3"
      ],
      answer: 1,
      explanation: "csc(3x) exige sen(3x) = 0 ⇒ 3x = kπ ⇒ x = kπ/3. Para k = 1 se obtiene x = π/3."
    },
    {
      topic: "Asíntotas Trigonométricas",
      question: "11. Despeja la expresión general de x para las asíntotas de f(x) = tan(2x - π/2).",
      options: [
        "x = π/2 + kπ/2",
        "x = π/4 + kπ/2",
        "x = π + kπ",
        "x = 3π/4 + kπ"
      ],
      answer: 0,
      explanation: "2x - π/2 = π/2 + kπ ⇒ 2x = π + kπ ⇒ x = π/2 + kπ/2."
    },
    {
      topic: "Asíntotas Trigonométricas",
      question: "12. Determina el valor exacto de la menor asíntota positiva de f(x) = cot(x - π/3).",
      options: [
        "x = π/6",
        "x = π/3",
        "x = 2π/3",
        "x = 5π/6"
      ],
      answer: 1,
      explanation: "cot requiere sen(x - π/3) = 0 ⇒ x - π/3 = kπ. Para k = 0, despejamos x = π/3."
    },
    {
      topic: "Asíntotas Trigonométricas",
      question: "13. Las asíntotas de f(x) = tan(x) y g(x) = tan(x + π/2) se diferencian en que las de g(x) están:",
      options: [
        "Desplazadas π/2 unidades a la derecha",
        "Desplazadas π/2 unidades a la izquierda",
        "Multiplicadas por un factor de 2",
        "Comprimidas a la mitad"
      ],
      answer: 1,
      explanation: "El término +π/2 dentro del argumento genera un desfase horizontal hacia la izquierda de π/2 unidades."
    },
    {
      topic: "Asíntotas Trigonométricas",
      question: "14. ¿En qué intervalo de x ∈ [0, π] la función f(x) = tan(2x) NO está definida?",
      options: [
        "x = π/2 solamente",
        "x = π/4 y x = 3π/4",
        "x = π/3 y x = 2π/3",
        "x = 0 y x = π"
      ],
      answer: 1,
      explanation: "La función no está definida en sus asíntotas x = π/4 + kπ/2. En [0, π] las asíntotas son para k = 0 (π/4) y k = 1 (3π/4)."
    },
    {
      topic: "Asíntotas Trigonométricas",
      question: "15. Determina la separación entre asíntotas consecutivas para f(x) = csc(4x).",
      options: [
        "π",
        "π/2",
        "π/4",
        "2π"
      ],
      answer: 2,
      explanation: "Asíntotas en 4x = kπ ⇒ x = kπ/4. La diferencia entre dos valores consecutivos de k es π/4."
    },
    {
      topic: "Asíntotas Trigonométricas",
      question: "16. ¿Cuál es el número total de asíntotas verticales de f(x) = tan(x) en el intervalo [0, 2π]?",
      options: [
        "1",
        "2",
        "3",
        "4"
      ],
      answer: 1,
      explanation: "En el intervalo cerrado [0, 2π], las asíntotas ocurren en x = π/2 y x = 3π/2, sumando un total de 2 asíntotas."
    },
    {
      topic: "Asíntotas Trigonométricas",
      question: "17. ¿Qué función comparte exactamente el mismo conjunto de asíntotas verticales que f(x) = tan(x)?",
      options: [
        "g(x) = cot(x)",
        "g(x) = csc(x)",
        "g(x) = sec(x)",
        "g(x) = sen(x)"
      ],
      answer: 2,
      explanation: "Ambas funciones tienen a cos(x) en el denominador (tan = sen/cos y sec = 1/cos), por lo que se anulan en los mismos puntos."
    },
    {
      topic: "Asíntotas Trigonométricas",
      question: "18. Resuelve la ubicación de la asíntota de f(x) = tan(3x - π) para k = 0.",
      options: [
        "x = π/6",
        "x = π/2",
        "x = 3π/2",
        "x = π/3"
      ],
      answer: 1,
      explanation: "3x - π = π/2 ⇒ 3x = 3π/2 ⇒ x = (3π/2)/3 = π/2."
    },
    {
      topic: "Asíntotas Trigonométricas",
      question: "19. Si una función de la forma f(x) = tan(bx) tiene una asíntota positiva en x = π/6, ¿cuál es el valor de b?",
      options: [
        "b = 2",
        "b = 3",
        "b = 4",
        "b = 6"
      ],
      answer: 1,
      explanation: "Igualamos b(π/6) = π/2 (para la primera asíntota positiva). Cancelando obtenemos b/6 = 1/2 ⇒ b = 6/2 = 3."
    },
    {
      topic: "Asíntotas Trigonométricas",
      question: "20. Indica la primera asíntota negativa para la función tangente estándar f(x) = tan(x).",
      options: [
        "x = -π",
        "x = -π/2",
        "x = -3π/2",
        "x = -π/4"
      ],
      answer: 1,
      explanation: "Sustituyendo k = -1 en la fórmula general x = π/2 + kπ, resulta x = π/2 - π = -π/2."
    }
  ];

  var questions = [];
  var currentQuestionIndex = 0;
  var selectedOptionIndex = null;
  var score = 0;

  var prefixes = ["A", "B", "C", "D"];

  var questionCounter = document.getElementById("questionCounter");
  var scoreCounter = document.getElementById("scoreCounter");
  var progressBar = document.getElementById("progressBar");
  var topicBadge = document.getElementById("topicBadge");
  var questionText = document.getElementById("questionText");
  var optionsContainer = document.getElementById("optionsContainer");
  var feedbackPanel = document.getElementById("feedbackPanel");
  var feedbackTitle = document.getElementById("feedbackTitle");
  var feedbackText = document.getElementById("feedbackText");
  var checkBtn = document.getElementById("checkBtn");
  var nextBtn = document.getElementById("nextBtn");
  var quizBody = document.getElementById("quizBody");
  var progressHeader = document.getElementById("progressHeader");
  var resultScreen = document.getElementById("resultScreen");
  var finalScore = document.getElementById("finalScore");
  var finalMessage = document.getElementById("finalMessage");
  var resultTitle = document.getElementById("resultTitle");
  var restartBtn = document.getElementById("restartBtn");

  function initQuiz() {
    questions = rawQuestions; // Mantiene el orden exacto del PDF
    currentQuestionIndex = 0;
    score = 0;
    resultScreen.style.display = "none";
    progressHeader.style.display = "flex";
    quizBody.style.display = "flex";
    loadQuestion();
  }

  function loadQuestion() {
    selectedOptionIndex = null;
    checkBtn.disabled = true;
    checkBtn.style.display = "inline-block";
    nextBtn.style.display = "none";
    feedbackPanel.style.display = "none";
    feedbackPanel.className = "feedback-panel";

    var q = questions[currentQuestionIndex];

    questionCounter.textContent = "Pregunta " + (currentQuestionIndex + 1) + " de " + questions.length;
    scoreCounter.textContent = "Aciertos: " + score;
    progressBar.style.width = (((currentQuestionIndex + 1) / questions.length) * 100) + "%";

    topicBadge.textContent = q.topic;
    questionText.innerHTML = q.question;

    optionsContainer.innerHTML = "";
    q.options.forEach(function(optText, index) {
      var btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerHTML = '<span class="option-prefix">' + prefixes[index] + '</span> <span>' + optText + '</span>';
      btn.addEventListener("click", function() { selectOption(index); });
      optionsContainer.appendChild(btn);
    });
  }

  function selectOption(index) {
    if (checkBtn.style.display === "none") return;
    selectedOptionIndex = index;
    var allOptions = optionsContainer.querySelectorAll(".option-btn");
    allOptions.forEach(function(btn, idx) {
      if (idx === index) {
        btn.classList.add("selected");
      } else {
        btn.classList.remove("selected");
      }
    });
    checkBtn.disabled = false;
  }

  function checkAnswer() {
    if (selectedOptionIndex === null) return;
    var q = questions[currentQuestionIndex];
    var allOptions = optionsContainer.querySelectorAll(".option-btn");

    allOptions.forEach(function(btn) { btn.disabled = true; });
    checkBtn.style.display = "none";
    nextBtn.style.display = "inline-block";

    var isCorrect = (selectedOptionIndex === q.answer);

    if (isCorrect) {
      score++;
      scoreCounter.textContent = "Aciertos: " + score;
      allOptions[selectedOptionIndex].classList.remove("selected");
      allOptions[selectedOptionIndex].classList.add("correct");

      feedbackPanel.className = "feedback-panel success";
      feedbackTitle.innerHTML = "📐 ¡Excelente! Respuesta correcta";
      feedbackText.innerHTML = q.explanation;
    } else {
      allOptions[selectedOptionIndex].classList.remove("selected");
      allOptions[selectedOptionIndex].classList.add("incorrect");
      allOptions[q.answer].classList.add("correct");

      feedbackPanel.className = "feedback-panel error";
      feedbackTitle.innerHTML = "💡 ¡Casi! Justificación matemática:";
      feedbackText.innerHTML = "<strong>Fundamento técnico:</strong> " + q.explanation;
    }

    feedbackPanel.style.display = "block";
    nextBtn.focus();
  }

  function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < questions.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    quizBody.style.display = "none";
    progressHeader.style.display = "none";
    resultScreen.style.display = "block";

    finalScore.textContent = score + " / " + questions.length;

    var msg = "";
    if (score === 20) {
      resultTitle.textContent = "📐 ¡Dominio Absoluto en Asíntotas Trigonométricas!";
      msg = "¡Súper bien! Resolviste correctamente los 20 reactivos. Dominas las condiciones de discontinuidad de la tangente, cotangente, secante y cosecante, así como desfases y períodos.";
    } else if (score >= 16) {
      resultTitle.textContent = "🌟 ¡Excelente Desempeño!";
      msg = "Tienes un nivel de preparación matemática muy avanzado. Revisa los detalles de los despejes para perfeccionar.";
    } else if (score >= 11) {
      resultTitle.textContent = "👍 ¡Buen Esfuerzo!";
      msg = "Vas por buen camino. Te sugerimos repasar las fórmulas de discontinuidad y desfases horizontales.";
    } else {
      resultTitle.textContent = "💪 ¡A Seguir Estudiando!";
      msg = "¡No te desanimes! Refuerza los conceptos de denominador nulo (cos(x)=0 y sen(x)=0) para volver a intentarlo.";
    }
    finalMessage.textContent = msg;
  }

  checkBtn.addEventListener("click", checkAnswer);
  nextBtn.addEventListener("click", nextQuestion);
  restartBtn.addEventListener("click", initQuiz);

  document.addEventListener("keydown", function(e) {
    if (resultScreen.style.display === "block") {
      if (e.key === "Enter") initQuiz();
      return;
    }

    var key = e.key.toUpperCase();
    if (["A", "1"].indexOf(key) !== -1) selectOption(0);
    else if (["B", "2"].indexOf(key) !== -1) selectOption(1);
    else if (["C", "3"].indexOf(key) !== -1) selectOption(2);
    else if (["D", "4"].indexOf(key) !== -1) selectOption(3);
    else if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (checkBtn.style.display !== "none" && !checkBtn.disabled) {
        checkAnswer();
      } else if (nextBtn.style.display !== "none") {
        nextQuestion();
      }
    }
  });

  window.addEventListener("DOMContentLoaded", initQuiz);
</script>

</body>
</html>
