<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simulador de Biología: Reproducción y Salud</title>
  <style>
    @font-face {
      font-family: 'Mogena';
      src: url('https://fonts.cdnfonts.com/s/91216/MogenaRegular-8Mzx3.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      /* Paleta inicial por defecto: Violeta Cromatina */
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #2e1065 35%, #1e1b4b 70%, #020617 100%);
      --card-bg: rgba(15, 23, 42, 0.90);
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;

      --neon-lime: #a855f7;
      --pastel-lime: rgba(168, 85, 247, 0.15);
      --neon-emerald: #c084fc;
      --pastel-emerald: rgba(192, 132, 252, 0.15);
      --neon-cyan: #e879f9;
      --pastel-cyan: rgba(232, 121, 249, 0.15);
      --neon-green: #22c55e;
      --pastel-green: rgba(34, 197, 94, 0.2);
      --neon-red: #ef4444;
      --pastel-red: rgba(239, 68, 68, 0.2);
    }

    /* Tema 1: División Celular (Mitosis/Meiosis) - Violeta Núcleo/Cromatina */
    body.theme-divisicn {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #2e1065 35%, #1e1b4b 70%, #020617 100%);
      --neon-lime: #a855f7;
      --pastel-lime: rgba(168, 85, 247, 0.15);
      --neon-emerald: #c084fc;
      --pastel-emerald: rgba(192, 132, 252, 0.15);
      --neon-cyan: #e879f9;
    }

    /* Tema 2: Reproducción Sexual/Asexual - Verde Naturaleza/Vida */
    body.theme-reproduccicn {
      --bg-gradient: linear-gradient(135deg, #022c22 0%, #064e3b 35%, #0f3f2e 70%, #022c22 100%);
      --neon-lime: #84cc16;
      --pastel-lime: rgba(132, 204, 22, 0.15);
      --neon-emerald: #10b981;
      --pastel-emerald: rgba(16, 185, 129, 0.15);
      --neon-cyan: #06b6d4;
    }

    /* Tema 3: Salud Reproductiva y Anticonceptivos - Coral/Rosa Cuidado */
    body.theme-salud {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #881337 35%, #4c0519 70%, #020617 100%);
      --neon-lime: #f43f5e;
      --pastel-lime: rgba(244, 63, 94, 0.15);
      --neon-emerald: #fb7185;
      --pastel-emerald: rgba(251, 113, 133, 0.15);
      --neon-cyan: #fda4af;
    }

    /* Tema 4: Infecciones de Transmisión Sexual - Ámbar/Alerta Médica */
    body.theme-its {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #451a03 35%, #78350f 70%, #020617 100%);
      --neon-lime: #f59e0b;
      --pastel-lime: rgba(245, 158, 11, 0.15);
      --neon-emerald: #fbbf24;
      --pastel-emerald: rgba(251, 191, 36, 0.15);
      --neon-cyan: #fde047;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Mogena', 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: clamp(6px, 1.5vw, 20px);
      transition: background 0.5s ease;
    }

    .quiz-container {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      width: 100%;
      max-width: 1250px;
      min-height: min(94vh, 900px);
      border-radius: clamp(16px, 2.5vw, 28px);
      border: clamp(2px, 0.3vw, 3px) solid var(--neon-lime);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 30px var(--pastel-lime);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      margin: auto;
      position: relative;
      transition: border-color 0.5s ease, box-shadow 0.5s ease;
    }

    .progress-header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: clamp(12px, 2vw, 20px) clamp(16px, 3vw, 36px);
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: clamp(2px, 0.3vw, 3px) solid var(--neon-lime);
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: border-color 0.5s ease;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .progress-info {
      display: flex;
      gap: clamp(10px, 2.5vw, 24px);
      flex-wrap: wrap;
      font-size: clamp(0.95rem, 1.2vw, 1.2rem);
      color: var(--neon-lime);
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px var(--pastel-lime);
      transition: color 0.5s ease;
    }

    .shortcut-hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
      display: none;
    }

    @media (min-width: 1024px) {
      .shortcut-hint {
        display: inline-block;
      }
    }

    .top-brand-logo img {
      height: clamp(34px, 5vw, 68px);
      width: auto;
      object-fit: contain;
      filter: contrast(1.15) drop-shadow(0 0 10px var(--pastel-lime));
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .top-brand-logo img:hover {
      transform: scale(1.1) rotate(-2deg);
    }

    .progress-bar-bg {
      width: 100%;
      height: clamp(10px, 1.1vw, 15px);
      background-color: rgba(30, 41, 59, 0.8);
      border-radius: 30px;
      overflow: hidden;
      border: 1.5px solid var(--pastel-lime);
    }

    .progress-bar-fill {
      height: 100%;
      width: 5%;
      background: linear-gradient(90deg, var(--neon-lime), var(--neon-emerald), var(--neon-cyan));
      border-radius: 30px;
      box-shadow: 0 0 15px var(--neon-lime);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .quiz-body {
      padding: clamp(16px, 2.5vw, 36px);
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 1150px;
      margin: 0 auto;
      width: 100%;
      overflow-y: auto;
    }

    .question-topic {
      align-self: flex-start;
      font-size: clamp(0.75rem, 0.9vw, 0.9rem);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 6px clamp(12px, 1.5vw, 18px);
      border-radius: 30px;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #020617;
      font-weight: 900;
      margin-bottom: clamp(10px, 1.5vw, 18px);
      box-shadow: 0 0 15px var(--pastel-lime);
      transition: background 0.5s ease;
    }

    .question-text {
      font-size: clamp(1.05rem, 1.5vw, 1.45rem);
      line-height: 1.45;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: clamp(16px, 2vw, 24px);
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: clamp(10px, 1.3vw, 16px);
      margin-bottom: clamp(16px, 2vw, 22px);
    }

    .option-btn {
      background: rgba(30, 41, 59, 0.6);
      border: clamp(2px, 0.25vw, 3px) solid var(--pastel-lime);
      border-radius: clamp(14px, 1.5vw, 18px);
      padding: clamp(12px, 1.4vw, 16px) clamp(14px, 1.6vw, 18px);
      text-align: left;
      font-size: clamp(0.95rem, 1.15vw, 1.1rem);
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: var(--text-main);
      font-weight: 600;
      line-height: 1.35;
      overflow-wrap: break-word;
      word-break: break-word;
      min-height: 56px;
      position: relative;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--neon-lime);
      background-color: var(--pastel-lime);
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 8px 20px var(--pastel-lime);
    }

    .option-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .option-btn.selected {
      border-color: var(--neon-lime);
      background-color: var(--pastel-lime);
      color: var(--text-main);
      box-shadow: 0 0 20px var(--pastel-lime);
      transform: scale(1.01);
    }

    .option-prefix {
      font-weight: 900;
      margin-right: 12px;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      width: clamp(34px, 3.2vw, 40px);
      height: clamp(34px, 3.2vw, 40px);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: clamp(0.85rem, 1vw, 1rem);
      color: #020617;
      border: 2px solid var(--neon-lime);
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .option-btn.selected .option-prefix {
      background: var(--neon-lime);
      border-color: #ffffff;
      color: #020617;
      transform: rotate(360deg);
    }

    .option-btn.correct {
      background-color: var(--pastel-green) !important;
      border-color: var(--neon-green) !important;
      color: #86efac !important;
      box-shadow: 0 0 22px rgba(34, 197, 94, 0.5) !important;
      animation: popSuccess 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .option-btn.correct .option-prefix {
      background: var(--neon-green);
      border-color: var(--neon-green);
      color: #020617;
    }

    .option-btn.incorrect {
      background-color: var(--pastel-red) !important;
      border-color: var(--neon-red) !important;
      color: #fca5a5 !important;
      box-shadow: 0 0 20px rgba(244, 63, 94, 0.5) !important;
      animation: shakeError 0.35s ease-in-out;
    }
    .option-btn.incorrect .option-prefix {
      background: var(--neon-red);
      border-color: var(--neon-red);
      color: #ffffff;
    }

    .feedback-panel {
      padding: clamp(14px, 1.8vw, 20px);
      border-radius: clamp(14px, 1.5vw, 18px);
      margin-bottom: clamp(14px, 1.8vw, 20px);
      display: none;
      animation: slideUp 0.3s ease;
      line-height: 1.5;
      font-size: clamp(0.9rem, 1.05vw, 1rem);
    }

    .feedback-panel.success {
      background-color: rgba(34, 197, 94, 0.15);
      border: clamp(2px, 0.25vw, 3px) solid var(--neon-green);
      color: #dcfce7;
    }

    .feedback-panel.error {
      background-color: rgba(244, 63, 94, 0.15);
      border: clamp(2px, 0.25vw, 3px) solid var(--neon-red);
      color: #ffe4e6;
    }

    .feedback-title {
      font-weight: 900;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(1rem, 1.15vw, 1.15rem);
    }

    .quiz-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 4px;
    }

    .action-btn {
      padding: clamp(12px, 1.4vw, 16px) clamp(24px, 2.8vw, 34px);
      font-size: clamp(0.95rem, 1.15vw, 1.1rem);
      font-weight: 800;
      border: none;
      border-radius: clamp(12px, 1.2vw, 16px);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      letter-spacing: 0.5px;
      width: auto;
      min-height: 48px;
    }

    .btn-check {
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #020617;
      box-shadow: 0 6px 20px var(--pastel-lime);
    }
    .btn-check:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.15);
    }
    .btn-check:disabled {
      background: #1e293b;
      color: #475569;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-next {
      background: linear-gradient(135deg, var(--neon-emerald), var(--neon-cyan));
      color: #020617;
      display: none;
      box-shadow: 0 6px 20px var(--pastel-emerald);
    }
    .btn-next:hover {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.15);
    }

    .result-screen {
      display: none;
      text-align: center;
      padding: clamp(24px, 4vw, 50px) clamp(14px, 3vw, 24px);
      margin: auto;
      max-width: 800px;
      animation: slideUp 0.4s ease;
    }

    .result-title {
      font-size: clamp(1.8rem, 3.2vw, 2.5rem);
      color: var(--neon-lime);
      font-weight: 900;
      text-shadow: 0 0 15px var(--pastel-lime);
    }

    .result-score {
      font-size: clamp(3.5rem, 7vw, 5rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald), var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: clamp(10px, 1.8vw, 18px) 0;
      filter: drop-shadow(0 0 15px var(--pastel-lime));
    }

    .result-message {
      font-size: clamp(1rem, 1.3vw, 1.2rem);
      color: var(--text-main);
      margin-bottom: clamp(20px, 2.8vw, 32px);
      line-height: 1.5;
      font-weight: 600;
    }

    .btn-restart {
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #020617;
      padding: clamp(14px, 1.6vw, 18px) clamp(30px, 3.5vw, 44px);
      font-size: clamp(1rem, 1.2vw, 1.15rem);
      box-shadow: 0 8px 25px var(--pastel-lime);
    }
    .btn-restart:hover {
      transform: scale(1.06);
      filter: brightness(1.15);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popSuccess {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1.01); }
    }

    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    @media (max-width: 580px) {
      .quiz-footer {
        flex-direction: column;
      }
      .action-btn {
        width: 100%;
        text-align: center;
      }
      .options-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body class="theme-divisicn">

<div class="quiz-container">
  <div class="progress-header" id="progressHeader">
    <div class="header-top">
      <div class="progress-info">
        <span id="questionCounter">Pregunta 1 de 20</span>
        <span id="scoreCounter">Aciertos: 0</span>
        <span class="shortcut-hint">💡 Usa las teclas [A, B, C, D] y [Enter]</span>
      </div>
      <div class="top-brand-logo">
        <img src="Logo_MB.png" alt="Logo ECOEMS">
      </div>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </div>

  <div class="quiz-body" id="quizBody">
    <span class="question-topic" id="topicBadge">Subtema 5.1</span>
    <h2 class="question-text" id="questionText">Cargando reactivo...</h2>

    <div class="options-grid" id="optionsContainer"></div>

    <div class="feedback-panel" id="feedbackPanel">
      <div class="feedback-title" id="feedbackTitle"></div>
      <div id="feedbackText"></div>
    </div>

    <div class="quiz-footer">
      <button class="action-btn btn-check" id="checkBtn" disabled>Comprobar respuesta</button>
      <button class="action-btn btn-next" id="nextBtn">Siguiente pregunta ➔</button>
    </div>
  </div>

  <div class="result-screen" id="resultScreen">
    <h2 class="result-title" id="resultTitle">¡Evaluación Finalizada!</h2>
    <div class="result-score" id="finalScore">0 / 20</div>
    <p class="result-message" id="finalMessage">Mensaje de desempeño</p>
    <button class="action-btn btn-restart" id="restartBtn">↻ Reiniciar simulador</button>
  </div>
</div>

<script>
  var rawQuestions = [
    {
      themeClass: "theme-divisicn",
      topic: "División Celular: Mitosis y Meiosis",
      question: "1. Si una persona sufre una herida epidérmica en el brazo, ¿qué proceso de división celular se activa en las células epiteliales vecinas para regenerar el tejido dañado?",
      options: [
        "Meiosis con reducción de cromosomas.",
        "Mitosis produciendo células idénticas diploides.",
        "Fecundación asexual.",
        "Meiosis creando variabilidad genotípica."
      ],
      answer: 1,
      explanation: "La reparación y regeneración de tejidos somáticos se lleva a cabo exclusivamente por mitosis, produciendo dos células diploides (2n) clones de la original."
    },
    {
      themeClass: "theme-divisicn",
      topic: "División Celular: Mitosis y Meiosis",
      question: "2. Un ovocito primario con 46 cromosomas realiza el proceso de meiosis dentro de las gónadas femeninas. ¿Cuántos cromosomas tendrá cada uno de los gametos resultantes?",
      options: [
        "46 cromosomas diploides.",
        "23 cromosomas haploides.",
        "92 cromosomas duplicados.",
        "12 cromosomas fragmentados."
      ],
      answer: 1,
      explanation: "La meiosis es una división reduccional en la que la célula diploide (2n = 46) divide su material genético para formar óvulos haploides (n = 23)."
    },
    {
      themeClass: "theme-divisicn",
      topic: "División Celular: Mitosis y Meiosis",
      question: "3. Durante la Profase I de la meiosis ocurre el entrecruzamiento o 'crossing-over' entre cromosomas homólogos. ¿Cuál es la consecuencia biológica principal de este evento?",
      options: [
        "Duplicar la cantidad total de ADN celular.",
        "Intercambiar fragmentos de genes creando variabilidad genética.",
        "Detener el proceso de división antes de la citocinesis.",
        "Garantizar que las células hijas sean exactamente idénticas."
      ],
      answer: 1,
      explanation: "El entrecruzamiento reorganiza las combinaciones alélicas en las cromátidas, produciendo gametos con combinaciones genéticas únicas e irrepetibles."
    },
    {
      themeClass: "theme-divisicn",
      topic: "División Celular: Mitosis y Meiosis",
      question: "4. ¿Cuál de las siguientes afirmaciones describe de manera exacta una diferencia fundamental entre mitosis y meiosis?",
      options: [
        "La mitosis produce 4 células haploides y la meiosis 2 diploides.",
        "La mitosis ocurre en células somáticas y la meiosis en la formación de gametos.",
        "La meiosis no realiza replicación previa de ADN.",
        "La mitosis genera gran variabilidad genotípica."
      ],
      answer: 1,
      explanation: "La mitosis renueva y mantiene las células somáticas del cuerpo (2n), mientras que la meiosis produce los gametos (n) en las gónadas."
    },
    {
      themeClass: "theme-divisicn",
      topic: "División Celular: Mitosis y Meiosis",
      question: "5. Si se analiza el cariotipo de una espermátida humana recién formada al concluir la Meiosis II, se observará que contiene:",
      options: [
        "23 cromosomas simples.",
        "46 pares de cromosomas homólogos.",
        "23 pares de cromosomas.",
        "92 cromátidas alineadas."
      ],
      answer: 0,
      explanation: "Al finalizar la Meiosis II se han producido cuatro células con una sola dotación de cada par cromosómico (n = 23 cromosomas simples)."
    },
    {
      themeClass: "theme-reproduccicn",
      topic: "Reproducción Sexual y Asexual",
      question: "6. Una estrella de mar pierde uno de sus brazos y, a partir de ese fragmento, se desarrolla un organismo completo. ¿Qué tipo de reproducción ocurrió y cómo son sus genes?",
      options: [
        "Reproducción sexual; genes altamente recombinados.",
        "Reproducción asexual por fragmentación; genes idénticos al progenitor.",
        "Reproducción meiótica; genes haploides modificados.",
        "Partenogénesis; genes provenientes de dos madres."
      ],
      answer: 1,
      explanation: "La regeneración por fragmentación es un mecanismo asexual por mitosis donde el nuevo ser es genéticamente un clon del único progenitor."
    },
    {
      themeClass: "theme-reproduccicn",
      topic: "Reproducción Sexual y Asexual",
      question: "7. Un cultivo de papas que se multiplica únicamente mediante tubérculos (reproducción asexual) es atacado por una plaga de hongos. ¿Qué ventaja o desventaja presenta la población?",
      options: [
        "Ventaja: La variabilidad genética permitirá la supervivencia de algunas.",
        "Desventaja: Al ser genéticamente idénticas, si el hongo las mata, todas morirán.",
        "Ventaja: Desarrollarán inmunidad por entrecruzamiento inmediato.",
        "Desventaja: Se reproducirán demasiado rápido agotando el hongo."
      ],
      answer: 1,
      explanation: "La falta de variabilidad genética propia de la reproducción asexual hace a toda la población susceptible por igual ante cambios ambientales desfavorables o enfermedades."
    },
    {
      themeClass: "theme-reproduccicn",
      topic: "Reproducción Sexual y Asexual",
      question: "8. ¿Cuál es el proceso clave de la reproducción sexual que permite restaurar la carga cromosómica diploide (2n) de la especie en cada generación?",
      options: [
        "La citocinesis vegetal.",
        "La fecundación o unión de gametos (n + n).",
        "La gemación de las levaduras.",
        "La bipartición bacteriana."

  var questions = [];
  var currentQuestionIndex = 0;
  var selectedOptionIndex = null;
  var score = 0;

  var prefixes = ["A", "B", "C", "D"];

  var questionCounter = document.getElementById("questionCounter");
  var scoreCounter = document.getElementById("scoreCounter");
  var progressBar = document.getElementById("progressBar");
  var topicBadge = document.getElementById("topicBadge");
  var questionText = document.getElementById("questionText");
  var optionsContainer = document.getElementById("optionsContainer");
  var feedbackPanel = document.getElementById("feedbackPanel");
  var feedbackTitle = document.getElementById("feedbackTitle");
  var feedbackText = document.getElementById("feedbackText");
  var checkBtn = document.getElementById("checkBtn");
  var nextBtn = document.getElementById("nextBtn");
  var quizBody = document.getElementById("quizBody");
  var progressHeader = document.getElementById("progressHeader");
  var resultScreen = document.getElementById("resultScreen");
  var finalScore = document.getElementById("finalScore");
  var finalMessage = document.getElementById("finalMessage");
  var resultTitle = document.getElementById("resultTitle");
  var restartBtn = document.getElementById("restartBtn");

  function initQuiz() {
    questions = rawQuestions;
    currentQuestionIndex = 0;
    score = 0;
    resultScreen.style.display = "none";
    progressHeader.style.display = "flex";
    quizBody.style.display = "flex";
    loadQuestion();
  }

  function loadQuestion() {
    selectedOptionIndex = null;
    checkBtn.disabled = true;
    checkBtn.style.display = "inline-block";
    nextBtn.style.display = "none";
    feedbackPanel.style.display = "none";
    feedbackPanel.className = "feedback-panel";

    var q = questions[currentQuestionIndex];

    // Cambiar dinámicamente la paleta según el subtema
    document.body.className = q.themeClass;

    questionCounter.textContent = "Pregunta " + (currentQuestionIndex + 1) + " de " + questions.length;
    scoreCounter.textContent = "Aciertos: " + score;
    progressBar.style.width = (((currentQuestionIndex + 1) / questions.length) * 100) + "%";

    topicBadge.textContent = q.topic;
    questionText.innerHTML = q.question;

    optionsContainer.innerHTML = "";
    q.options.forEach(function(optText, index) {
      var btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerHTML = '<span class="option-prefix">' + prefixes[index] + '</span> <span>' + optText + '</span>';
      btn.addEventListener("click", function() { selectOption(index); });
      optionsContainer.appendChild(btn);
    });
  }

  function selectOption(index) {
    if (checkBtn.style.display === "none") return;
    selectedOptionIndex = index;
    var allOptions = optionsContainer.querySelectorAll(".option-btn");
    allOptions.forEach(function(btn, idx) {
      if (idx === index) {
        btn.classList.add("selected");
      } else {
        btn.classList.remove("selected");
      }
    });
    checkBtn.disabled = false;
  }

  function checkAnswer() {
    if (selectedOptionIndex === null) return;
    var q = questions[currentQuestionIndex];
    var allOptions = optionsContainer.querySelectorAll(".option-btn");

    allOptions.forEach(function(btn) { btn.disabled = true; });
    checkBtn.style.display = "none";
    nextBtn.style.display = "inline-block";

    var isCorrect = (selectedOptionIndex === q.answer);

    if (isCorrect) {
      score++;
      scoreCounter.textContent = "Aciertos: " + score;
      allOptions[selectedOptionIndex].classList.remove("selected");
      allOptions[selectedOptionIndex].classList.add("correct");

      feedbackPanel.className = "feedback-panel success";
      feedbackTitle.innerHTML = "🌱 ¡Excelente! Respuesta correcta";
      feedbackText.innerHTML = q.explanation;
    } else {
      allOptions[selectedOptionIndex].classList.remove("selected");
      allOptions[selectedOptionIndex].classList.add("incorrect");
      allOptions[q.answer].classList.add("correct");

      feedbackPanel.className = "feedback-panel error";
      feedbackTitle.innerHTML = "💡 ¡Casi! Justificación biológica:";
      feedbackText.innerHTML = "<strong>Fundamento técnico:</strong> " + q.explanation;
    }

    feedbackPanel.style.display = "block";
    nextBtn.focus();
  }

  function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < questions.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    quizBody.style.display = "none";
    progressHeader.style.display = "none";
    resultScreen.style.display = "block";

    finalScore.textContent = score + " / " + questions.length;

    var msg = "";
    if (score === 20) {
      resultTitle.textContent = "🧬 ¡Dominio Absoluto en Reproducción y Salud!";
      msg = "¡Súper bien! Resolviste correctamente los 20 reactivos. Dominas la división celular (mitosis/meiosis), reproducción sexual y asexual, métodos anticonceptivos e ITS.";
    } else if (score >= 16) {
      resultTitle.textContent = "🌟 ¡Excelente Desempeño!";
      msg = "Tienes un nivel de preparación muy avanzado. Revisa los detalles conceptuales en los que fallaste para perfeccionar.";
    } else if (score >= 11) {
      resultTitle.textContent = "👍 ¡Buen Esfuerzo!";
      msg = "Vas por buen camino. Te sugerimos repasar la diferencia entre la meiosis y mitosis, así como el mecanismo de los métodos hormonales.";
    } else {
      resultTitle.textContent = "💪 ¡A Seguir Estudiando!";
      msg = "¡No te desanimes! Refuerza los conceptos de variabilidad genética, prevención de ITS y tipos de reproducción asexual para volver a intentarlo.";
    }
    finalMessage.textContent = msg;
  }

  checkBtn.addEventListener("click", checkAnswer);
  nextBtn.addEventListener("click", nextQuestion);
  restartBtn.addEventListener("click", initQuiz);

  document.addEventListener("keydown", function(e) {
    if (resultScreen.style.display === "block") {
      if (e.key === "Enter") initQuiz();
      return;
    }

    var key = e.key.toUpperCase();
    if (["A", "1"].indexOf(key) !== -1) selectOption(0);
    else if (["B", "2"].indexOf(key) !== -1) selectOption(1);
    else if (["C", "3"].indexOf(key) !== -1) selectOption(2);
    else if (["D", "4"].indexOf(key) !== -1) selectOption(3);
    else if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (checkBtn.style.display !== "none" && !checkBtn.disabled) {
        checkAnswer();
      } else if (nextBtn.style.display !== "none") {
        nextQuestion();
      }
    }
  });

  window.addEventListener("DOMContentLoaded", initQuiz);
</script>
