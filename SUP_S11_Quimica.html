<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simulador de Química: El Agua y su Preservación</title>
  <style>
    @font-face {
      font-family: 'Mogena';
      src: url('https://fonts.cdnfonts.com/s/91216/MogenaRegular-8Mzx3.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #0369a1 35%, #0891b2 70%, #020617 100%);
      --card-bg: rgba(15, 23, 42, 0.90);
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;

      --neon-lime: #06b6d4;
      --pastel-lime: rgba(6, 182, 212, 0.15);
      --neon-emerald: #38bdf8;
      --pastel-emerald: rgba(56, 189, 248, 0.15);
      --neon-cyan: #67e8f9;
      --pastel-cyan: rgba(103, 232, 249, 0.15);
      --neon-green: #22c55e;
      --pastel-green: rgba(34, 197, 94, 0.2);
      --neon-red: #ef4444;
      --pastel-red: rgba(239, 68, 68, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Mogena', 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: clamp(6px, 1.5vw, 20px);
    }

    .quiz-container {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      width: 100%;
      max-width: 1250px;
      min-height: min(94vh, 900px);
      border-radius: clamp(16px, 2.5vw, 28px);
      border: clamp(2px, 0.3vw, 3px) solid var(--neon-lime);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(6, 182, 212, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      margin: auto;
      position: relative;
    }

    .progress-header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: clamp(12px, 2vw, 20px) clamp(16px, 3vw, 36px);
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: clamp(2px, 0.3vw, 3px) solid var(--neon-lime);
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .progress-info {
      display: flex;
      gap: clamp(10px, 2.5vw, 24px);
      flex-wrap: wrap;
      font-size: clamp(0.95rem, 1.2vw, 1.2rem);
      color: var(--neon-lime);
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(6, 182, 212, 0.4);
    }

    .shortcut-hint {
      font-size: 0.8rem;
      color: #a5f3fc;
      font-weight: 600;
      display: none;
    }

    @media (min-width: 1024px) {
      .shortcut-hint {
        display: inline-block;
      }
    }

    .top-brand-logo img {
      height: clamp(34px, 5vw, 68px);
      width: auto;
      object-fit: contain;
      filter: contrast(1.15) drop-shadow(0 0 10px rgba(6, 182, 212, 0.5));
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .top-brand-logo img:hover {
      transform: scale(1.1) rotate(-2deg);
    }

    .progress-bar-bg {
      width: 100%;
      height: clamp(10px, 1.1vw, 15px);
      background-color: rgba(30, 41, 59, 0.8);
      border-radius: 30px;
      overflow: hidden;
      border: 1.5px solid rgba(6, 182, 212, 0.4);
    }

    .progress-bar-fill {
      height: 100%;
      width: 5%;
      background: linear-gradient(90deg, var(--neon-lime), var(--neon-emerald), var(--neon-cyan));
      border-radius: 30px;
      box-shadow: 0 0 15px var(--neon-lime);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .quiz-body {
      padding: clamp(16px, 2.5vw, 36px);
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 1150px;
      margin: 0 auto;
      width: 100%;
      overflow-y: auto;
    }

    .question-topic {
      align-self: flex-start;
      font-size: clamp(0.75rem, 0.9vw, 0.9rem);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 6px clamp(12px, 1.5vw, 18px);
      border-radius: 30px;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      font-weight: 900;
      margin-bottom: clamp(10px, 1.5vw, 18px);
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
    }

    .question-text {
      font-size: clamp(1.05rem, 1.5vw, 1.45rem);
      line-height: 1.45;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: clamp(16px, 2vw, 24px);
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: clamp(10px, 1.3vw, 16px);
      margin-bottom: clamp(16px, 2vw, 22px);
    }

    .option-btn {
      background: rgba(30, 41, 59, 0.6);
      border: clamp(2px, 0.25vw, 3px) solid rgba(6, 182, 212, 0.35);
      border-radius: clamp(14px, 1.5vw, 18px);
      padding: clamp(12px, 1.4vw, 16px) clamp(14px, 1.6vw, 18px);
      text-align: left;
      font-size: clamp(0.95rem, 1.15vw, 1.1rem);
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: var(--text-main);
      font-weight: 600;
      line-height: 1.35;
      overflow-wrap: break-word;
      word-break: break-word;
      min-height: 56px;
      position: relative;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--neon-lime);
      background-color: var(--pastel-lime);
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 8px 20px rgba(6, 182, 212, 0.3);
    }

    .option-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .option-btn.selected {
      border-color: var(--neon-lime);
      background-color: var(--pastel-lime);
      color: #67e8f9;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.5);
      transform: scale(1.01);
    }

    .option-prefix {
      font-weight: 900;
      margin-right: 12px;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      width: clamp(34px, 3.2vw, 40px);
      height: clamp(34px, 3.2vw, 40px);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: clamp(0.85rem, 1vw, 1rem);
      color: #0f172a;
      border: 2px solid var(--neon-lime);
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .option-btn.selected .option-prefix {
      background: var(--neon-lime);
      border-color: #ffffff;
      color: #0f172a;
      transform: rotate(360deg);
    }

    .option-btn.correct {
      background-color: var(--pastel-green) !important;
      border-color: var(--neon-green) !important;
      color: #86efac !important;
      box-shadow: 0 0 22px rgba(34, 197, 94, 0.5) !important;
      animation: popSuccess 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .option-btn.correct .option-prefix {
      background: var(--neon-green);
      border-color: var(--neon-green);
      color: #0f172a;
    }

    .option-btn.incorrect {
      background-color: var(--pastel-red) !important;
      border-color: var(--neon-red) !important;
      color: #fca5a5 !important;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.5) !important;
      animation: shakeError 0.35s ease-in-out;
    }
    .option-btn.incorrect .option-prefix {
      background: var(--neon-red);
      border-color: var(--neon-red);
      color: #ffffff;
    }

    .feedback-panel {
      padding: clamp(14px, 1.8vw, 20px);
      border-radius: clamp(14px, 1.5vw, 18px);
      margin-bottom: clamp(14px, 1.8vw, 20px);
      display: none;
      animation: slideUp 0.3s ease;
      line-height: 1.5;
      font-size: clamp(0.9rem, 1.05vw, 1rem);
    }

    .feedback-panel.success {
      background-color: rgba(34, 197, 94, 0.15);
      border: clamp(2px, 0.25vw, 3px) solid var(--neon-green);
      color: #dcfce7;
    }

    .feedback-panel.error {
      background-color: rgba(239, 68, 68, 0.15);
      border: clamp(2px, 0.25vw, 3px) solid var(--neon-red);
      color: #ffe4e6;
    }

    .feedback-title {
      font-weight: 900;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(1rem, 1.15vw, 1.15rem);
    }

    .quiz-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 4px;
    }

    .action-btn {
      padding: clamp(12px, 1.4vw, 16px) clamp(24px, 2.8vw, 34px);
      font-size: clamp(0.95rem, 1.15vw, 1.1rem);
      font-weight: 800;
      border: none;
      border-radius: clamp(12px, 1.2vw, 16px);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      letter-spacing: 0.5px;
      width: auto;
      min-height: 48px;
    }

    .btn-check {
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.4);
    }
    .btn-check:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.15);
    }
    .btn-check:disabled {
      background: #1e293b;
      color: #475569;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-next {
      background: linear-gradient(135deg, var(--neon-emerald), var(--neon-cyan));
      color: #0f172a;
      display: none;
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
    }
    .btn-next:hover {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.15);
    }

    .result-screen {
      display: none;
      text-align: center;
      padding: clamp(24px, 4vw, 50px) clamp(14px, 3vw, 24px);
      margin: auto;
      max-width: 800px;
      animation: slideUp 0.4s ease;
    }

    .result-title {
      font-size: clamp(1.8rem, 3.2vw, 2.5rem);
      color: var(--neon-lime);
      font-weight: 900;
      text-shadow: 0 0 15px rgba(6, 182, 212, 0.5);
    }

    .result-score {
      font-size: clamp(3.5rem, 7vw, 5rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald), var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: clamp(10px, 1.8vw, 18px) 0;
      filter: drop-shadow(0 0 15px rgba(6, 182, 212, 0.6));
    }

    .result-message {
      font-size: clamp(1rem, 1.3vw, 1.2rem);
      color: var(--text-main);
      margin-bottom: clamp(20px, 2.8vw, 32px);
      line-height: 1.5;
      font-weight: 600;
    }

    .btn-restart {
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #0f172a;
      padding: clamp(14px, 1.6vw, 18px) clamp(30px, 3.5vw, 44px);
      font-size: clamp(1rem, 1.2vw, 1.15rem);
      box-shadow: 0 8px 25px rgba(6, 182, 212, 0.5);
    }
    .btn-restart:hover {
      transform: scale(1.06);
      filter: brightness(1.15);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popSuccess {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1.01); }
    }

    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    @media (max-width: 580px) {
      .quiz-footer {
        flex-direction: column;
      }
      .action-btn {
        width: 100%;
        text-align: center;
      }
      .options-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <div class="progress-header" id="progressHeader">
    <div class="header-top">
      <div class="progress-info">
        <span id="questionCounter">Pregunta 1 de 20</span>
        <span id="scoreCounter">Aciertos: 0</span>
        <span class="shortcut-hint">💡 Usa las teclas [A, B, C, D] y [Enter]</span>
      </div>
      <div class="top-brand-logo">
        <img src="Logo_MB.png" alt="Logo ECOEMS">
      </div>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </div>

  <div class="quiz-body" id="quizBody">
    <span class="question-topic" id="topicBadge">Ciencias Ambientales: El Agua y su Preservación</span>
    <h2 class="question-text" id="questionText">Cargando reactivo...</h2>

    <div class="options-grid" id="optionsContainer"></div>

    <div class="feedback-panel" id="feedbackPanel">
      <div class="feedback-title" id="feedbackTitle"></div>
      <div id="feedbackText"></div>
    </div>

    <div class="quiz-footer">
      <button class="action-btn btn-check" id="checkBtn" disabled>Comprobar respuesta</button>
      <button class="action-btn btn-next" id="nextBtn">Siguiente pregunta ➔</button>
    </div>
  </div>

  <div class="result-screen" id="resultScreen">
    <h2 class="result-title" id="resultTitle">¡Evaluación Finalizada!</h2>
    <div class="result-score" id="finalScore">0 / 20</div>
    <p class="result-message" id="finalMessage">Mensaje de desempeño</p>
    <button class="action-btn btn-restart" id="restartBtn">↻ Reiniciar simulador</button>
  </div>
</div>

<script>
  var rawQuestions = [
    {
      topic: "Tratamiento de Aguas Residuales",
      question: "1. En una ciudad industrial se producen 25,000 m³ de aguas residuales al día. Si la planta de tratamiento municipal procesa el 80% de este efluente, ¿qué volumen de agua se vierte al cuerpo receptor sin recibir tratamiento previo?",
      options: [
        "5,000 m³",
        "20,000 m³",
        "4,000 m³",
        "2,500 m³"
      ],
      answer: 0,
      explanation: "El porcentaje de agua que queda sin tratar es 100% - 80% = 20%. Calculando el 20% de 25,000 m³: 25,000 × 0.20 = 5,000 m³."
    },
    {
      topic: "Uso y Consumo de Agua Dulce",
      question: "2. ¿Cuál sector de la actividad humana registra el mayor porcentaje de consumo directo y extracción de agua dulce a nivel global?",
      options: [
        "Sector industrial y minero.",
        "Sector doméstico y residencial.",
        "Sector agrícola y pecuario.",
        "Sector de generación termoeléctrica."
      ],
      answer: 2,
      explanation: "A nivel mundial, el sector agrícola y pecuario representa entre el 70% y el 75% de la extracción total de agua dulce, debido a la irrigación de cultivos."
    },
    {
      topic: "Métodos de Purificación Moleculares",
      question: "3. Una industria farmacéutica requiere agua de muy alta pureza libre de iones disueltos como Na⁺, Ca²⁺ y Cl⁻. ¿Qué método de tratamiento es el más idóneo para remover este tipo de solutos a nivel molecular?",
      options: [
        "Sedimentación primaria en tanques de decantación.",
        "Desinfección mediante cloración gaseosa.",
        "Ósmosis inversa a través de membranas semipermeables.",
        "Filtración con lecho de grava y arena gruesa."
      ],
      answer: 2,
      explanation: "La ósmosis inversa utiliza altas presiones para forzar el paso del agua a través de una membrana semipermeable que retiene sales e iones disueltos, a diferencia de la sedimentación o filtración básica que solo retienen sólidos no disueltos."
    },
    {
      topic: "Balance Hídrico de Acuíferos",
      question: "4. Un acuífero subterráneo recibe una recarga anual por infiltración pluvial de 15 millones de m³. Si durante el mismo periodo se extraen 21 millones de m³ mediante pozos de bombeo, ¿cuál es el estado del balance hídrico del acuífero?",
      options: [
        "Superávit de 6 millones de m³.",
        "Equilibrio estricto en la reserva hídrica.",
        "Déficit de 6 millones de m³.",
        "Déficit de 36 millones de m³."
      ],
      answer: 2,
      explanation: "El balance se calcula como ΔV = V_recarga - V_extracción = 15 - 21 = -6 millones de m³. Al ser un valor negativo, existe un déficit de 6 millones de m³ que deriva en sobreexplotación."
    },
    {
      topic: "Conceptos de Huella Hídrica",
      question: "5. ¿Cuál de las siguientes opciones define el concepto de 'Huella Hídrica Gris'?",
      options: [
        "El volumen de agua de lluvia incorporado a los tejidos de los cultivos.",
        "El volumen de agua extraído de acuíferos subterráneos y ríos para el consumo doméstico.",
        "El volumen de agua requerida para diluir los contaminantes vertidos hasta que el efluente alcance los límites normativos.",
        "El agua evaporada durante el proceso de enfriamiento de una planta termoeléctrica."
      ],
      answer: 2,
      explanation: "La huella hídrica gris mide el grado de contaminación del agua al cuantificar el volumen de agua dulce necesario para asimilar y diluir las cargas contaminantes generadas en un proceso."
    },
    {
      topic: "Contaminación Térmica en Cuerpos de Agua",
      question: "6. Una planta central termoeléctrica descarga agua de enfriamiento a una temperatura de 38 °C en un río cuya temperatura normal es de 20 °C. ¿Qué efecto físico-químico directo ocurre en el río a causa de este vertido?",
      options: [
        "Aumento en la concentración de oxígeno disuelto en el cuerpo de agua.",
        "Disminución en la solubilidad del oxígeno disuelto (O₂).",
        "Precipitación inmediata de todas las sales iónicas disueltas.",
        "Reducción drástica del valor del pH hídrico hacia condiciones ácidas."
      ],
      answer: 1,
      explanation: "La solubilidad de los gases en agua es inversamente proporcional a la temperatura. Al elevarse la temperatura del agua por la descarga industrial, la capacidad del cuerpo receptor para retener oxígeno disuelto (O₂) disminuye de manera sustancial."
    },
    {
      topic: "Huella Hídrica de Productos",
      question: "7. Para elaborar un kilogramo de carne de res se estima que se requieren aproximadamente 15,000 L de agua a lo largo de toda la cadena de producción del alimento. Este valor cuantitativo corresponde al concepto de:",
      options: [
        "Capacidad de carga del suelo.",
        "Demanda química de oxígeno (DQO).",
        "Huella hídrica del producto.",
        "Coeficiente de permeabilidad del acuífero."
      ],
      answer: 2,
      explanation: "La huella hídrica de un producto evalúa el volumen total de agua dulce directa e indirectamente utilizada para la fabricación o producción de dicho bien a lo largo de su cadena de valor."
    },
    {
      topic: "Pérdidas por Evaporación",
      question: "8. Un lago urbano de 500,000 m³ de capacidad pierde anualmente el 12% de su volumen total debido únicamente a procesos de evaporación estival. ¿Qué volumen de agua se evapora cada año?",
      options: [
        "60,000 m³",
        "440,000 m³",
        "6,000 m³",
        "50,000 m³"
      ],
      answer: 0,
      explanation: "Calculando el 12% de 500,000 m³: 500,000 × (12/100) = 60,000 m³."
    },
    {
      topic: "Procesos Físicos de Tratamiento",
      question: "9. ¿Qué etapa primaria de una planta tratadora de aguas residuales se basa en la fuerza de gravedad para asentar y remover las partículas suspendidas de mayor densidad y tamaño?",
      options: [
        "Ósmosis inversa.",
        "Cloración.",
        "Sedimentación.",
        "Intercambio iónico."
      ],
      answer: 2,
      explanation: "La sedimentación es un tratamiento físico basado en la gravedad que permite que los sólidos densos en suspensión se depositen en el fondo de los estanques clarificadores."
    },
    {
      topic: "Preservación y Manejo Sustentable",
      question: "10. Una región agrícola padece de escasez severa de agua subterránea. ¿Cuál de las siguientes medidas representa la estrategia más adecuada para la preservación del recurso hídrico en dicha región?",
      options: [
        "Sustituir los sistemas de riego por goteo eficiente por riego tradicional por inundación.",
        "Implementar sistemas de riego por goteo, reparar redes de distribución y reutilizar aguas residuales tratadas.",
        "Incrementar la profundidad de perforación de los pozos de extracción sin regular la demanda.",
        "Fomentar el cultivo intensivo de especies vegetales de muy alto consumo hídrico."
      ],
      answer: 1,
      explanation: "El manejo sustentable del agua exige optimizar la eficiencia de riego (por goteo en lugar de inundación), erradicar pérdidas por fugas y promover la economía circular mediante la reutilización de agua tratada."
    },
    {
      topic: "Cuantificación de Huella Hídrica Gris",

  var questions = [];
  var currentQuestionIndex = 0;
  var selectedOptionIndex = null;
  var score = 0;

  var prefixes = ["A", "B", "C", "D"];

  var questionCounter = document.getElementById("questionCounter");
  var scoreCounter = document.getElementById("scoreCounter");
  var progressBar = document.getElementById("progressBar");
  var topicBadge = document.getElementById("topicBadge");
  var questionText = document.getElementById("questionText");
  var optionsContainer = document.getElementById("optionsContainer");
  var feedbackPanel = document.getElementById("feedbackPanel");
  var feedbackTitle = document.getElementById("feedbackTitle");
  var feedbackText = document.getElementById("feedbackText");
  var checkBtn = document.getElementById("checkBtn");
  var nextBtn = document.getElementById("nextBtn");
  var quizBody = document.getElementById("quizBody");
  var progressHeader = document.getElementById("progressHeader");
  var resultScreen = document.getElementById("resultScreen");
  var finalScore = document.getElementById("finalScore");
  var finalMessage = document.getElementById("finalMessage");
  var resultTitle = document.getElementById("resultTitle");
  var restartBtn = document.getElementById("restartBtn");

  function initQuiz() {
    questions = rawQuestions;
    currentQuestionIndex = 0;
    score = 0;
    resultScreen.style.display = "none";
    progressHeader.style.display = "flex";
    quizBody.style.display = "flex";
    loadQuestion();
  }

  function loadQuestion() {
    selectedOptionIndex = null;
    checkBtn.disabled = true;
    checkBtn.style.display = "inline-block";
    nextBtn.style.display = "none";
    feedbackPanel.style.display = "none";
    feedbackPanel.className = "feedback-panel";

    var q = questions[currentQuestionIndex];

    questionCounter.textContent = "Pregunta " + (currentQuestionIndex + 1) + " de " + questions.length;
    scoreCounter.textContent = "Aciertos: " + score;
    progressBar.style.width = (((currentQuestionIndex + 1) / questions.length) * 100) + "%";

    topicBadge.textContent = q.topic;
    questionText.innerHTML = q.question;

    optionsContainer.innerHTML = "";
    q.options.forEach(function(optText, index) {
      var btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerHTML = '<span class="option-prefix">' + prefixes[index] + '</span> <span>' + optText + '</span>';
      btn.addEventListener("click", function() { selectOption(index); });
      optionsContainer.appendChild(btn);
    });
  }

  function selectOption(index) {
    if (checkBtn.style.display === "none") return;
    selectedOptionIndex = index;
    var allOptions = optionsContainer.querySelectorAll(".option-btn");
    allOptions.forEach(function(btn, idx) {
      if (idx === index) {
        btn.classList.add("selected");
      } else {
        btn.classList.remove("selected");
      }
    });
    checkBtn.disabled = false;
  }

  function checkAnswer() {
    if (selectedOptionIndex === null) return;
    var q = questions[currentQuestionIndex];
    var allOptions = optionsContainer.querySelectorAll(".option-btn");

    allOptions.forEach(function(btn) { btn.disabled = true; });
    checkBtn.style.display = "none";
    nextBtn.style.display = "inline-block";

    var isCorrect = (selectedOptionIndex === q.answer);

    if (isCorrect) {
      score++;
      scoreCounter.textContent = "Aciertos: " + score;
      allOptions[selectedOptionIndex].classList.remove("selected");
      allOptions[selectedOptionIndex].classList.add("correct");

      feedbackPanel.className = "feedback-panel success";
      feedbackTitle.innerHTML = "💧 ¡Excelente! Respuesta correcta";
      feedbackText.innerHTML = q.explanation;
    } else {
      allOptions[selectedOptionIndex].classList.remove("selected");
      allOptions[selectedOptionIndex].classList.add("incorrect");
      allOptions[q.answer].classList.add("correct");

      feedbackPanel.className = "feedback-panel error";
      feedbackTitle.innerHTML = "💡 Justificación ambiental:";
      feedbackText.innerHTML = "<strong>Fundamento técnico:</strong> " + q.explanation;
    }

    feedbackPanel.style.display = "block";
    nextBtn.focus();
  }

  function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < questions.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    quizBody.style.display = "none";
    progressHeader.style.display = "none";
    resultScreen.style.display = "block";

    finalScore.textContent = score + " / " + questions.length;

    var msg = "";
    if (score === 20) {
      resultTitle.textContent = "🌊 ¡Dominio Absoluto en Preservación del Agua!";
      msg = "¡Súper bien! Resolviste correctamente los 20 reactivos. Dominas la huella hídrica (verde, azul, gris), tratamiento de aguas, balances de acuíferos y contaminación térmica.";
    } else if (score >= 16) {
      resultTitle.textContent = "🌟 ¡Excelente Desempeño!";
      msg = "Tienes un nivel de preparación ambiental muy avanzado. Revisa los detalles de cálculos de balances y huella hídrica para perfeccionar.";
    } else if (score >= 11) {
      resultTitle.textContent = "👍 ¡Buen Esfuerzo!";
      msg = "Vas por buen camino. Te sugerimos repasar la diferencia entre los tipos de huella hídrica y los procesos de purificación molecular.";
    } else {
      resultTitle.textContent = "💪 ¡A Seguir Estudiando!";
      msg = "¡No te desanimes! Refuerza los conceptos de abatimiento freático, ósmosis inversa y tratamiento de efluentes para volver a intentarlo.";
    }
    finalMessage.textContent = msg;
  }

  checkBtn.addEventListener("click", checkAnswer);
  nextBtn.addEventListener("click", nextQuestion);
  restartBtn.addEventListener("click", initQuiz);

  document.addEventListener("keydown", function(e) {
    if (resultScreen.style.display === "block") {
      if (e.key === "Enter") initQuiz();
      return;
    }

    var key = e.key.toUpperCase();
    if (["A", "1"].indexOf(key) !== -1) selectOption(0);
    else if (["B", "2"].indexOf(key) !== -1) selectOption(1);
    else if (["C", "3"].indexOf(key) !== -1) selectOption(2);
    else if (["D", "4"].indexOf(key) !== -1) selectOption(3);
    else if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (checkBtn.style.display !== "none" && !checkBtn.disabled) {
        checkAnswer();
      } else if (nextBtn.style.display !== "none") {
        nextQuestion();
      }
    }
  });

  window.addEventListener("DOMContentLoaded", initQuiz);
</script>
