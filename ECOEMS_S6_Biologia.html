<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simulador de Biología: Nutrición y Salud</title>
  <style>
    @font-face {
      font-family: 'Mogena';
      src: url('https://fonts.cdnfonts.com/s/91216/MogenaRegular-8Mzx3.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-gradient: linear-gradient(135deg, #064e3b 0%, #022c22 35%, #0f3f2e 70%, #022c22 100%);
      --card-bg: rgba(6, 44, 32, 0.88);
      --text-main: #f0fdf4;
      --text-muted: #86efac;

      --neon-lime: #84cc16;
      --pastel-lime: rgba(132, 204, 22, 0.15);
      --neon-emerald: #10b981;
      --pastel-emerald: rgba(16, 185, 129, 0.15);
      --neon-cyan: #06b6d4;
      --pastel-cyan: rgba(6, 182, 212, 0.15);
      --neon-green: #22c55e;
      --pastel-green: rgba(34, 197, 94, 0.2);
      --neon-red: #f43f5e;
      --pastel-red: rgba(244, 63, 94, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Mogena', 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: clamp(6px, 1.5vw, 20px);
    }

    .quiz-container {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      width: 100%;
      max-width: 1250px;
      min-height: min(94vh, 900px);
      border-radius: clamp(16px, 2.5vw, 28px);
      border: clamp(2px, 0.3vw, 3px) solid var(--neon-emerald);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(16, 185, 129, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      margin: auto;
      position: relative;
    }

    .progress-header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: clamp(12px, 2vw, 20px) clamp(16px, 3vw, 36px);
      background: rgba(2, 44, 34, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: clamp(2px, 0.3vw, 3px) solid var(--neon-lime);
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .progress-info {
      display: flex;
      gap: clamp(10px, 2.5vw, 24px);
      flex-wrap: wrap;
      font-size: clamp(0.95rem, 1.2vw, 1.2rem);
      color: var(--neon-lime);
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(132, 204, 22, 0.4);
    }

    .shortcut-hint {
      font-size: 0.8rem;
      color: #a7f3d0;
      font-weight: 600;
      display: none;
    }

    @media (min-width: 1024px) {
      .shortcut-hint {
        display: inline-block;
      }
    }

    .top-brand-logo img {
      height: clamp(34px, 5vw, 68px);
      width: auto;
      object-fit: contain;
      filter: contrast(1.15) drop-shadow(0 0 10px rgba(16, 185, 129, 0.5));
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .top-brand-logo img:hover {
      transform: scale(1.1) rotate(-2deg);
    }

    .progress-bar-bg {
      width: 100%;
      height: clamp(10px, 1.1vw, 15px);
      background-color: rgba(6, 78, 59, 0.8);
      border-radius: 30px;
      overflow: hidden;
      border: 1.5px solid rgba(16, 185, 129, 0.4);
    }

    .progress-bar-fill {
      height: 100%;
      width: 5%;
      background: linear-gradient(90deg, var(--neon-lime), var(--neon-emerald), var(--neon-cyan));
      border-radius: 30px;
      box-shadow: 0 0 15px var(--neon-lime);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .quiz-body {
      padding: clamp(16px, 2.5vw, 36px);
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 1150px;
      margin: 0 auto;
      width: 100%;
      overflow-y: auto;
    }

    .question-topic {
      align-self: flex-start;
      font-size: clamp(0.75rem, 0.9vw, 0.9rem);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 6px clamp(12px, 1.5vw, 18px);
      border-radius: 30px;
      background: linear-gradient(135deg, var(--neon-emerald), var(--neon-cyan));
      color: #022c22;
      font-weight: 900;
      margin-bottom: clamp(10px, 1.5vw, 18px);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
    }

    .question-text {
      font-size: clamp(1.05rem, 1.5vw, 1.45rem);
      line-height: 1.45;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: clamp(16px, 2vw, 24px);
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: clamp(10px, 1.3vw, 16px);
      margin-bottom: clamp(16px, 2vw, 22px);
    }

    .option-btn {
      background: rgba(6, 78, 59, 0.6);
      border: clamp(2px, 0.25vw, 3px) solid rgba(16, 185, 129, 0.35);
      border-radius: clamp(14px, 1.5vw, 18px);
      padding: clamp(12px, 1.4vw, 16px) clamp(14px, 1.6vw, 18px);
      text-align: left;
      font-size: clamp(0.95rem, 1.15vw, 1.1rem);
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: var(--text-main);
      font-weight: 600;
      line-height: 1.35;
      overflow-wrap: break-word;
      word-break: break-word;
      min-height: 56px;
      position: relative;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--neon-lime);
      background-color: var(--pastel-lime);
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 8px 20px rgba(132, 204, 22, 0.3);
    }

    .option-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .option-btn.selected {
      border-color: var(--neon-lime);
      background-color: var(--pastel-lime);
      color: #a3e635;
      box-shadow: 0 0 20px rgba(132, 204, 22, 0.5);
      transform: scale(1.01);
    }

    .option-prefix {
      font-weight: 900;
      margin-right: 12px;
      background: linear-gradient(135deg, var(--neon-emerald), var(--neon-lime));
      width: clamp(34px, 3.2vw, 40px);
      height: clamp(34px, 3.2vw, 40px);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: clamp(0.85rem, 1vw, 1rem);
      color: #022c22;
      border: 2px solid var(--neon-lime);
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .option-btn.selected .option-prefix {
      background: var(--neon-lime);
      border-color: #ffffff;
      color: #022c22;
      transform: rotate(360deg);
    }

    .option-btn.correct {
      background-color: var(--pastel-green) !important;
      border-color: var(--neon-green) !important;
      color: #86efac !important;
      box-shadow: 0 0 22px rgba(34, 197, 94, 0.5) !important;
      animation: popSuccess 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .option-btn.correct .option-prefix {
      background: var(--neon-green);
      border-color: var(--neon-green);
      color: #022c22;
    }

    .option-btn.incorrect {
      background-color: var(--pastel-red) !important;
      border-color: var(--neon-red) !important;
      color: #fca5a5 !important;
      box-shadow: 0 0 20px rgba(244, 63, 94, 0.5) !important;
      animation: shakeError 0.35s ease-in-out;
    }
    .option-btn.incorrect .option-prefix {
      background: var(--neon-red);
      border-color: var(--neon-red);
      color: #ffffff;
    }

    .feedback-panel {
      padding: clamp(14px, 1.8vw, 20px);
      border-radius: clamp(14px, 1.5vw, 18px);
      margin-bottom: clamp(14px, 1.8vw, 20px);
      display: none;
      animation: slideUp 0.3s ease;
      line-height: 1.5;
      font-size: clamp(0.9rem, 1.05vw, 1rem);
    }

    .feedback-panel.success {
      background-color: rgba(34, 197, 94, 0.15);
      border: clamp(2px, 0.25vw, 3px) solid var(--neon-green);
      color: #dcfce7;
    }

    .feedback-panel.error {
      background-color: rgba(244, 63, 94, 0.15);
      border: clamp(2px, 0.25vw, 3px) solid var(--neon-red);
      color: #ffe4e6;
    }

    .feedback-title {
      font-weight: 900;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(1rem, 1.15vw, 1.15rem);
    }

    .quiz-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 4px;
    }

    .action-btn {
      padding: clamp(12px, 1.4vw, 16px) clamp(24px, 2.8vw, 34px);
      font-size: clamp(0.95rem, 1.15vw, 1.1rem);
      font-weight: 800;
      border: none;
      border-radius: clamp(12px, 1.2vw, 16px);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      letter-spacing: 0.5px;
      width: auto;
      min-height: 48px;
    }

    .btn-check {
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #022c22;
      box-shadow: 0 6px 20px rgba(132, 204, 22, 0.4);
    }
    .btn-check:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.15);
    }
    .btn-check:disabled {
      background: #1e3a2b;
      color: #475569;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-next {
      background: linear-gradient(135deg, var(--neon-emerald), var(--neon-cyan));
      color: #022c22;
      display: none;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }
    .btn-next:hover {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.15);
    }

    .result-screen {
      display: none;
      text-align: center;
      padding: clamp(24px, 4vw, 50px) clamp(14px, 3vw, 24px);
      margin: auto;
      max-width: 800px;
      animation: slideUp 0.4s ease;
    }

    .result-title {
      font-size: clamp(1.8rem, 3.2vw, 2.5rem);
      color: var(--neon-lime);
      font-weight: 900;
      text-shadow: 0 0 15px rgba(132, 204, 22, 0.5);
    }

    .result-score {
      font-size: clamp(3.5rem, 7vw, 5rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald), var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: clamp(10px, 1.8vw, 18px) 0;
      filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.6));
    }

    .result-message {
      font-size: clamp(1rem, 1.3vw, 1.2rem);
      color: var(--text-main);
      margin-bottom: clamp(20px, 2.8vw, 32px);
      line-height: 1.5;
      font-weight: 600;
    }

    .btn-restart {
      background: linear-gradient(135deg, var(--neon-lime), var(--neon-emerald));
      color: #022c22;
      padding: clamp(14px, 1.6vw, 18px) clamp(30px, 3.5vw, 44px);
      font-size: clamp(1rem, 1.2vw, 1.15rem);
      box-shadow: 0 8px 25px rgba(132, 204, 22, 0.5);
    }
    .btn-restart:hover {
      transform: scale(1.06);
      filter: brightness(1.15);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popSuccess {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1.01); }
    }

    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    @media (max-width: 580px) {
      .quiz-footer {
        flex-direction: column;
      }
      .action-btn {
        width: 100%;
        text-align: center;
      }
      .options-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <div class="progress-header" id="progressHeader">
    <div class="header-top">
      <div class="progress-info">
        <span id="questionCounter">Pregunta 1 de 12</span>
        <span id="scoreCounter">Aciertos: 0</span>
        <span class="shortcut-hint">💡 Usa las teclas [A, B, C, D] y [Enter]</span>
      </div>
      <div class="top-brand-logo">
        <img src="Logo_MB.png" alt="Logo ECOEMS">
      </div>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </div>

  <div class="quiz-body" id="quizBody">
    <span class="question-topic" id="topicBadge">Tema</span>
    <h2 class="question-text" id="questionText">Cargando reactivo...</h2>

    <div class="options-grid" id="optionsContainer"></div>

    <div class="feedback-panel" id="feedbackPanel">
      <div class="feedback-title" id="feedbackTitle"></div>
      <div id="feedbackText"></div>
    </div>

    <div class="quiz-footer">
      <button class="action-btn btn-check" id="checkBtn" disabled>Comprobar respuesta</button>
      <button class="action-btn btn-next" id="nextBtn">Siguiente pregunta ➔</button>
    </div>
  </div>

  <div class="result-screen" id="resultScreen">
    <h2 class="result-title" id="resultTitle">¡Evaluación Finalizada!</h2>
    <div class="result-score" id="finalScore">0 / 12</div>
    <p class="result-message" id="finalMessage">Mensaje de desempeño</p>
    <button class="action-btn btn-restart" id="restartBtn">↻ Reiniciar simulador</button>
  </div>
</div>

<script>
  const rawQuestions = [
    {
      topic: "Nutrición Autótrofa y Fotosíntesis",
      question: "¿Cuál es la función biológica principal de la fase luminosa de la fotosíntesis realizada en los tilacoides de las plantas autótrofas?",
      options: [
        "Fijar directamente dióxido de carbono (CO₂) para sintetizar glucosa.",
        "Capturar energía solar para producir ATP y NADPH, liberando oxígeno (O₂).",
        "Absorber sales minerales del suelo para formar proteínas celulares.",
        "Degradar glucosa en piruvato mediante respiración anaerobia."
      ],
      answer: 1,
      explanation: "La fase luminosa fotoliza moléculas de agua utilizando luz solar para generar transportadores energéticos (ATP y NADPH) y libera O₂ como subproducto."
    },
    {
      topic: "Clasificación Trófica de Organismos",
      question: "Los organismos descomponedores o saprófitos (como ciertos hongos y bacterias) cumplen un rol fundamental en el ecosistema debido a que:",
      options: [
        "Sintetizan su propio alimento utilizando compuestos inorgánicos y luz solar.",
        "Degradan la materia orgánica muerta y reciclan los nutrimentos inorgánicos hacia el suelo.",
        "Cazan presas vivas controlando la densidad de las poblaciones herbívoras.",
        "Generan el mayor porcentaje de dióxido de carbono consumido por los animales."
      ],
      answer: 1,
      explanation: "Los saprófitos reciclan la materia en descomposición, convirtiéndola en nutrimentos inorgánicos asimilables por los productores fotosintéticos."
    },
    {
      topic: "Fisiología de la Digestión Humana",
      question: "¿En qué órgano del sistema digestivo humano se lleva a cabo la mayor parte de la absorción de nutrimentos procesados hacia el torrente sanguíneo?",
      options: [
        "Estómago",
        "Intestino Delgado",
        "Intestino Grueso",
        "Esófago"
      ],
      answer: 1,
      explanation: "El intestino delgado posee vellosidades y microvellosidades intestinales diseñadas específicamente para maximizar la absorción de nutrimentos hacia la sangre."
    },
    {
      topic: "Bioquímica de Macromoléculas",
      question: "¿Qué biomolécula orgánica constituye la principal fuente de energía de reserva a largo plazo y forma las membranas celulares en los organismos vivos?",
      options: [
        "Proteínas",
        "Lípidos",
        "Carbohidratos",
        "Ácidos Nucleicos"
      ],
      answer: 1,
      explanation: "Los lípidos almacenan el doble de energía por gramo en comparación con los carbohidratos y estructuran las bicapas fosfolipídicas celulares."
    },
    {
      topic: "Salud Nutricional y Trastornos",
      question: "¿Qué trastorno de la conducta alimentaria se caracteriza por el temor intenso a subir de peso, distorsión severa de la imagen corporal y restricción extrema de alimento?",
      options: [
        "Bulimia Nerviosa",
        "Anorexia Nerviosa",
        "Vigorexia",
        "Anemia Ferropénica"
      ],
      answer: 1,
      explanation: "La anorexia nerviosa involucra una autopercepción distorsionada y rechazo a mantener un peso corporal mínimo saludable."
    },
    {
      topic: "Biología Molecular (Enzimas)",
      question: "Las enzimas digestivas (como la amilasa o la tripsina) aceleran las reacciones de degradación de los alimentos actuando como:",
      options: [
        "Hormonas de transporte endocrino.",
        "Catalizadores biológicos de naturaleza proteica.",
        "Biomoléculas energéticas de consumo rápido.",
        "Sustancias amortiguadoras de pH corporal."
      ],
      answer: 1,
      explanation: "Las enzimas son proteínas especializadas que disminuyen la energía de activación de las reacciones químicas celulares."
    },
    {
      topic: "Características de la Dieta Correcta",
      question: "Para considerar que una alimentación cumple con la característica de ser 'Completa', ¿qué condición debe satisfacer según las guías nutricionales?",
      options: [
        "Aportar calorías procedentes exclusivamente de frutas y verduras frescas.",
        "Contener todos los nutrimentos incluyendo los tres grupos principales de alimentos en cada comida.",
        "Garantizar que no contenga ningún tipo de grasas ni carbohidratos refinados.",
        "Consumir únicamente alimentos libres de conservadores sintéticos."
      ],
      answer: 1,
      explanation: "Una dieta completa incluye alimentos de los 3 grupos del Plato del Bien Comer para cubrir todas las biomoléculas requeridas."
    },
    {
      topic: "Anatomía y Fisiología Respiratoria",
      question: "¿En qué estructuras microscópicas del pulmón humano ocurre de manera precisa el intercambio gaseoso (hematosis) entre el aire y la sangre?",
      options: [
        "Bronquios",
        "Alvéolos Pulmonares",
        "Traquea",
        "Bronquiolos Terminales"
      ],
      answer: 1,
      explanation: "Los alvéolos están rodeados de capilares sanguíneos donde el O₂ entra a la sangre y el CO₂ se expulsa por difusión simple."
    },
    {
      topic: "Mecanismos Celulares (Respiración)",
      question: "La respiración celular aerobia difiere de la fermentación anaerobia en que la ruta aerobia:",
      options: [
        "Ocurre completamente en el citoplasma sin requerir organelos.",
        "Utiliza oxígeno como aceptor final de electrones generando un alto rendimiento de ATP.",
        "Produce siempre ácido láctico o etanol como subproductos finales.",
        "Sintetiza glucosa a partir de luz solar."
      ],
      answer: 1,
      explanation: "La respiración aerobia requiere O₂ en la mitocondria y genera aproximadamente 36-38 moléculas de ATP por cada glucosa."
    },
    {
      topic: "Patologías Respiratorias y Factores de Riesgo",
      question: "¿Cuál es el principal agente de riesgo ambiental y conductual asociado al desarrollo de Bronquitis Crónica y Enfisema Pulmonar (EPOC)?",
      options: [
        "Consumo excesivo de sodio en la dieta.",
        "Exposición prolongada al humo de tabaco y contaminantes atmosféricos.",
        "Infecciones bacterianas por falta de vacunación infantil.",
        "Deficiencia severa de vitamina C en la dieta diaria."
      ],
      answer: 1,
      explanation: "El tabaquismo y el humo inhalado destruyen paulatinamente las paredes alveolares y elastina pulmonar."
    },
    {
      topic: "Ecosistemas e Impacto Ambiental",
      question: "¿Qué fenómeno ambiental ocurre cuando el exceso de fertilizantes (nitrógeno y fósforo) arrastrados a los lagos provoca la proliferación descontrolada de algas?",
      options: [
        "Efecto Invernadero",
        "Eutrofización",
        "Lluvia Ácida",
        "Inversión Térmica"
      ],
      answer: 1,
      explanation: "La eutrofización provoca florecimientos de algas que agotan el oxígeno disuelto en el agua al morir y descomponerse."
    },
    {
      topic: "Sustentabilidad y Biodiversidad",
      question: "¿Cuál de las siguientes acciones promueve de manera efectiva el desarrollo sustentable y la conservación de la biodiversidad?",
      options: [
        "Introducción masiva de especies exóticas para controlar plagas locales.",
        "Uso eficiente de energías renovables y aprovechamiento responsable de los recursos naturales.",
        "Deforestación controlada para expandir monocultivos de consumo industrial.",
        "Incineración de residuos plásticos a cielo abierto."
      ],
      answer: 1,
      explanation: "El desarrollo sustentable busca satisfacer las necesidades presentes sin comprometer la capacidad de las futuras generaciones."
    }
  ];

  let questions = [];
  let currentQuestionIndex = 0;
  let selectedOptionIndex = null;
  let score = 0;

  const prefixes = ["A", "B", "C", "D"];

  const questionCounter = document.getElementById("questionCounter");
  const scoreCounter = document.getElementById("scoreCounter");
  const progressBar = document.getElementById("progressBar");
  const topicBadge = document.getElementById("topicBadge");
  const questionText = document.getElementById("questionText");
  const optionsContainer = document.getElementById("optionsContainer");
  const feedbackPanel = document.getElementById("feedbackPanel");
  const feedbackTitle = document.getElementById("feedbackTitle");
  const feedbackText = document.getElementById("feedbackText");
  const checkBtn = document.getElementById("checkBtn");
  const nextBtn = document.getElementById("nextBtn");
  const quizBody = document.getElementById("quizBody");
  const progressHeader = document.getElementById("progressHeader");
  const resultScreen = document.getElementById("resultScreen");
  const finalScore = document.getElementById("finalScore");
  const finalMessage = document.getElementById("finalMessage");
  const resultTitle = document.getElementById("resultTitle");
  const restartBtn = document.getElementById("restartBtn");

  function shuffleArray(array) {
    const shuffled = [...array];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
  }

  function initQuiz() {
    questions = shuffleArray(rawQuestions);
    currentQuestionIndex = 0;
    score = 0;
    resultScreen.style.display = "none";
    progressHeader.style.display = "flex";
    quizBody.style.display = "flex";
    loadQuestion();
  }

  function loadQuestion() {
    selectedOptionIndex = null;
    checkBtn.disabled = true;
    checkBtn.style.display = "inline-block";
    nextBtn.style.display = "none";
    feedbackPanel.style.display = "none";
    feedbackPanel.className = "feedback-panel";

    const q = questions[currentQuestionIndex];

    questionCounter.textContent = `Pregunta ${currentQuestionIndex + 1} de ${questions.length}`;
    scoreCounter.textContent = `Aciertos: ${score}`;
    progressBar.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;

    topicBadge.textContent = q.topic;
    questionText.innerHTML = q.question;

    optionsContainer.innerHTML = "";
    q.options.forEach((optText, index) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerHTML = `<span class="option-prefix">${prefixes[index]}</span> <span>${optText}</span>`;
      btn.addEventListener("click", () => selectOption(index));
      optionsContainer.appendChild(btn);
    });
  }

  function selectOption(index) {
    if (checkBtn.style.display === "none") return;
    selectedOptionIndex = index;
    const allOptions = optionsContainer.querySelectorAll(".option-btn");
    allOptions.forEach((btn, idx) => {
      if (idx === index) {
        btn.classList.add("selected");
      } else {
        btn.classList.remove("selected");
      }
    });
    checkBtn.disabled = false;
  }

  function checkAnswer() {
    if (selectedOptionIndex === null) return;
    const q = questions[currentQuestionIndex];
    const allOptions = optionsContainer.querySelectorAll(".option-btn");

    allOptions.forEach(btn => btn.disabled = true);
    checkBtn.style.display = "none";
    nextBtn.style.display = "inline-block";

    const isCorrect = (selectedOptionIndex === q.answer);

    if (isCorrect) {
      score++;
      scoreCounter.textContent = `Aciertos: ${score}`;
      allOptions[selectedOptionIndex].classList.remove("selected");
      allOptions[selectedOptionIndex].classList.add("correct");

      feedbackPanel.className = "feedback-panel success";
      feedbackTitle.innerHTML = "🌿 ¡Excelente! Respuesta correcta";
      feedbackText.innerHTML = q.explanation;
    } else {
      allOptions[selectedOptionIndex].classList.remove("selected");
      allOptions[selectedOptionIndex].classList.add("incorrect");
      allOptions[q.answer].classList.add("correct");

      feedbackPanel.className = "feedback-panel error";
      feedbackTitle.innerHTML = "💡 ¡Casi! Explicación biológica:";
      feedbackText.innerHTML = `<strong>Fundamento teórico:</strong> ${q.explanation}`;
    }

    feedbackPanel.style.display = "block";
    nextBtn.focus();
  }

  function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < questions.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    quizBody.style.display = "none";
    progressHeader.style.display = "none";
    resultScreen.style.display = "block";

    finalScore.textContent = `${score} / ${questions.length}`;

    let msg = "";
    if (score === 12) {
      resultTitle.textContent = "🌱 ¡Dominio Perfecto en Biología!";
      msg = "¡Súper bien! Resolviste correctamente los 12 reactivos. Dominas la nutrición, fisiología respiratoria e impacto ambiental.";
    } else if (score >= 9) {
      resultTitle.textContent = "🌟 ¡Excelente Desempeño!";
      msg = "Tienes un nivel muy avanzado de preparación. Revisa los detalles conceptuales en las preguntas que fallaste para lograr la perfección.";
    } else if (score >= 6) {
      resultTitle.textContent = "👍 ¡Buen Esfuerzo!";
      msg = "Vas por buen camino. Te sugerimos repasar la respiración celular y las fases de la fotosíntesis.";
    } else {
      resultTitle.textContent = "💪 ¡A Seguir Estudiando!";
      msg = "¡No te desanimes! Refuerza las biomoléculas y el impacto ambiental para volver a intentarlo (las preguntas cambiarán de orden automáticamente).";
    }
    finalMessage.textContent = msg;
  }

  checkBtn.addEventListener("click", checkAnswer);
  nextBtn.addEventListener("click", nextQuestion);
  restartBtn.addEventListener("click", initQuiz);

  document.addEventListener("keydown", (e) => {
    if (resultScreen.style.display === "block") {
      if (e.key === "Enter") initQuiz();
      return;
    }

    const key = e.key.toUpperCase();
    if (["A", "1"].includes(key)) selectOption(0);
    else if (["B", "2"].includes(key)) selectOption(1);
    else if (["C", "3"].includes(key)) selectOption(2);
    else if (["D", "4"].includes(key)) selectOption(3);
    else if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (checkBtn.style.display !== "none" && !checkBtn.disabled) {
        checkAnswer();
      } else if (nextBtn.style.display !== "none") {
        nextQuestion();
      }
    }
  });

  initQuiz();
</script>

</body>
</html>
